  body.theme-rose { --primary: #b5657f; --primary-dark: #9c5069; --primary-soft: #f6dfe8; --accent2: #e7a0b8; }
  @media (prefers-color-scheme: dark) { body.theme-rose { --primary: #d18aa0; --primary-dark: #b5657f; --primary-soft: #3a2632; --accent2: #8a4a62; } }
  .theme-toggle { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border); background: linear-gradient(135deg, var(--primary), var(--accent2)); padding: 0; flex: 0 0 auto; cursor: pointer; transition: transform .12s; }
  .theme-toggle:hover { transform: scale(1.1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; }

  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }

  /* Barra lateral */
  .sidebar {
    background: var(--sidebar);
    color: var(--sidebar-text);
    display: flex; flex-direction: column;
    padding: 16px 0; gap: 4px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 20px 16px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--accent2)); display: grid; place-items: center; font-size: 18px; }
  .brand h1 { font-size: 16px; margin: 0; color: var(--sidebar-text-strong); font-weight: 700; letter-spacing: .2px; }
  .brand small { display: block; font-size: 10.5px; color: var(--sidebar-text); font-weight: 500; }
  .nav { padding: 6px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: start;
    background: transparent; border: 0; color: var(--sidebar-text);
    padding: 9px 12px; border-radius: 8px; font-weight: 600; font-size: 13.5px;
  }
  .nav button .ic { font-size: 16px; width: 20px; text-align: center; }
  .nav button:hover { background: rgba(255,255,255,.06); color: var(--sidebar-text-strong); }
  .nav button.active { background: var(--primary); color: #fff; }
  .side-section { padding: 14px 20px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: #64748b; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .side-accounts { padding: 2px 12px; display: flex; flex-direction: column; gap: 1px; }
  .side-acc { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 7px; background: transparent; border: 0; color: var(--sidebar-text); width: 100%; text-align: start; }
  .side-acc:hover { background: rgba(255,255,255,.06); color: var(--sidebar-text-strong); }
  .side-acc .nm { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-acc .bal { font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .side-acc .bal.neg { color: var(--negative); }
  .side-total { padding: 8px 24px; font-size: 12px; display:flex; justify-content: space-between; color: var(--sidebar-text); border-top: 1px solid rgba(255,255,255,.06); margin-top: 6px; }
  .side-total b { color: var(--sidebar-text-strong); font-variant-numeric: tabular-nums; }
  .add-acc { margin: 8px 16px; padding: 8px; border: 1px dashed rgba(255,255,255,.2); background: transparent; color: var(--sidebar-text); border-radius: 8px; font-weight: 600; font-size: 12.5px; }
  .add-acc:hover { border-color: var(--primary); color: #fff; }
  .side-footer { margin-top: auto; padding: 12px 16px 4px; display: flex; flex-direction: column; gap: 4px; }
  /* Uma linha só, sempre — o ponto de aviso não pode empurrar o texto para baixo. */
  .side-footer button { background: transparent; border: 0; color: var(--sidebar-text); text-align: start; padding: 7px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; display:flex; align-items:center; gap:9px; white-space: nowrap; overflow: hidden; }
  /* Largura fixa para o ícone: os emojis têm larguras diferentes e desalinhavam os rótulos. */
  .side-footer button > span:first-child { flex: 0 0 20px; text-align: center; }
  .side-footer button:hover { background: rgba(255,255,255,.06); color: var(--sidebar-text-strong); }

  /* Zona principal */
  .main { padding: 0; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 26px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  .view-title { font-size: 19px; font-weight: 700; margin: 0; }
  .month-nav { display: flex; align-items: center; gap: 6px; }
  .month-nav button.arrow { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 16px; display: grid; place-items: center; }
  .month-nav button.arrow:hover { background: var(--surface-2); border-color: var(--primary); }
  .month-nav .month-label { font-weight: 700; font-size: 15px; min-width: 150px; text-align: center; }
  .month-nav .today-btn { font-size: 12px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-weight: 600; }

  .rta-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 20px 26px 0; padding: 16px 22px; border-radius: 14px; background: var(--primary); color: #fff; box-shadow: var(--shadow); flex-wrap: wrap; }
  .rta-banner.zero { background: linear-gradient(135deg, var(--primary), var(--accent2)); }
  .rta-banner.over { background: linear-gradient(135deg, #b91c1c, #dc2626); }
  .rta-amount { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .rta-label { font-size: 12.5px; opacity: .92; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  .rta-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .rta-actions button { background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.28); padding: 8px 13px; border-radius: 8px; font-weight: 600; font-size: 12.5px; }
  .rta-actions button:hover { background: rgba(255,255,255,.3); }

  /* Aviso de divergência entre o orçamento e o dinheiro real nas contas */
  .integrity-bar { display: flex; align-items: center; gap: 12px; margin: 10px 26px 0; padding: 11px 16px; border-radius: 12px; background: var(--warning-soft); border: 1px solid var(--warning); color: var(--warning); font-size: 13px; font-weight: 600; flex-wrap: wrap; }
  .integrity-bar .grow { flex: 1; min-width: 170px; }
  .integrity-bar button { background: var(--surface); border: 1px solid var(--warning); color: var(--warning); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .integrity-bar button:hover { background: var(--warning); color: #fff; }
  .upcoming-bar { display: flex; align-items: center; gap: 12px; margin: 10px 26px 0; padding: 10px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); font-size: 13px; font-weight: 600; flex-wrap: wrap; }
  .upcoming-bar .grow { flex: 1; min-width: 170px; }
  .upcoming-bar b { color: var(--text); font-variant-numeric: tabular-nums; }
  .upcoming-bar button { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .upcoming-bar button:hover { border-color: var(--primary); color: var(--primary); }
  .int-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .int-row .who { min-width: 0; }
  .int-row .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .int-row .amt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }

  .content { padding: 20px 26px 60px; }

  .btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 9px 15px; border-radius: 9px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { background: var(--surface-2); border-color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--negative); border-color: var(--negative-soft); }
  .btn.danger:hover { background: var(--negative-soft); }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .search { padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); min-width: 180px; }
  select.filter, input.filter { padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); font-weight: 600; }

  /* Tabela do orçamento */
  .budget-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; box-shadow: var(--shadow); }
  table.budget { width: 100%; border-collapse: collapse; }
  table.budget thead th { text-align: end; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); font-weight: 700; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  table.budget thead th.first { text-align: start; }
  .grp-row td { padding: 11px 18px; background: var(--group-row); border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); font-weight: 700; }
  .grp-row .grp-name { display: flex; align-items: center; gap: 9px; }
  .grp-row .grp-name .caret { transition: transform .15s; color: var(--text-muted); font-size: 12px; }
  .grp-row .grp-name button.grp-toggle { background: transparent; border: 0; display: flex; align-items: center; gap: 9px; color: var(--text); font-weight: 700; padding: 0; }
  .grp-row .grp-add { font-size: 11.5px; color: var(--primary); font-weight: 600; background: transparent; border: 0; opacity: 0; }
  .grp-row:hover .grp-add { opacity: 1; }
  .grp-total { text-align: end; font-variant-numeric: tabular-nums; color: var(--text-muted); font-weight: 600; }

  tr.cat-row td { padding: 9px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr.cat-row:hover { background: var(--surface-2); }
  tr.cat-row:last-child td { border-bottom: 0; }
  .cat-name-cell { display: flex; align-items: center; gap: 10px; }
  .cat-name { font-weight: 600; }
  /* Prioridade: sempre visível e clicável (alta → normal → baixa → alta). */
  .prio-btn { flex: 0 0 auto; width: 22px; height: 22px; padding: 0; border-radius: 6px; border: 1px solid transparent; background: transparent; font-size: 11px; line-height: 1; display: inline-grid; place-items: center; transition: background .12s, border-color .12s; }
  .prio-btn:hover { border-color: var(--border); background: var(--surface-2); }
  /* Escala tipo semáforo. Verde/vermelho vêm de --positive/--negative (e não de --primary),
     para se manterem iguais nos dois temas e não se confundirem com o rosa. */
  .prio-btn.p-alta { color: var(--positive); font-size: 12px; }
  .prio-btn.p-normal { color: var(--text-muted); opacity: .4; }
  .prio-btn.p-baixa { color: var(--negative); font-size: 12px; }
  .cat-name-cell .cat-actions { display: flex; gap: 4px; opacity: 0; }
  tr.cat-row:hover .cat-actions { opacity: 1; }
  .cat-actions button { background: transparent; border: 0; color: var(--text-muted); font-size: 13px; padding: 2px 5px; border-radius: 5px; }
  .cat-actions button:hover { background: var(--neutral-soft); color: var(--text); }
  /* Ocupa toda a largura da coluna da categoria, em qualquer ecrã. */
  .target-bar { height: 5px; border-radius: 4px; background: var(--neutral-soft); margin-top: 5px; overflow: hidden; width: 100%; }
  .target-bar > span { display: block; height: 100%; background: var(--primary); border-radius: 4px; transition: width .18s, background .18s; }
  .target-bar > span.full { background: var(--positive); }   /* alvo cumprido */
  .target-bar > span.warn { background: var(--warning); }    /* abaixo do alvo */
  .target-bar > span.neg  { background: var(--negative); }   /* excesso (negativo) */
  tr[data-drag] { cursor: grab; }
  tr[data-drag]:active { cursor: grabbing; }
  tr.drag-over td { box-shadow: inset 0 2px 0 var(--primary); background: var(--primary-soft); }
  .btn.f-warn.active { background: var(--warning-soft); border-color: var(--warning); color: var(--warning); }
  .btn.f-neg.active  { background: var(--negative-soft); border-color: var(--negative); color: var(--negative); }
  .btn.f-ok.active   { background: var(--positive-soft); border-color: var(--positive); color: var(--positive); }
  .btn.f-alta.active   { background: var(--positive-soft); border-color: var(--positive); color: var(--positive); }
  .btn.f-normal.active { background: var(--neutral-soft); border-color: var(--text-muted); color: var(--text); }
  .btn.f-baixa.active  { background: var(--negative-soft); border-color: var(--negative); color: var(--negative); }
  .toolbar .sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
  .target-note { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  /* Os montantes nunca partem de linha — era o que atirava o «€» para baixo. */
  .num, .grp-total, .activity-cell, .avail-pill { white-space: nowrap; }
  table.budget td.num, table.budget th:not(.first) { width: 1%; }   /* colunas de valores: só o necessário */
  table.budget td:first-child, table.budget th.first { width: auto; }
  .num { text-align: end; font-variant-numeric: tabular-nums; }
  /* Tem de parecer um campo mesmo sem lhe passar o rato por cima — no telemóvel não há rato. */
  .assign-input { width: 108px; text-align: end; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .assign-input:hover { border-color: var(--primary); background: var(--surface); }
  .assign-input:focus { border-color: var(--primary); background: var(--surface); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
  .activity-cell { color: var(--text-muted); }
  .avail-pill { display: inline-block; padding: 4px 11px; border-radius: 20px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .avail-pill.pos { background: var(--positive-soft); color: var(--positive); }
  .avail-pill.zero { background: var(--neutral-soft); color: var(--text-muted); }
  .avail-pill.neg { background: var(--negative-soft); color: var(--negative); }
  .avail-pill.warn { background: var(--warning-soft); color: var(--warning); }

  /* Tabela genérica (transações / contas) */
  .data-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; box-shadow: var(--shadow); }
  table.data { width: 100%; border-collapse: collapse; }
  table.data th { text-align: start; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); font-weight: 700; padding: 11px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
  table.data td { padding: 10px 16px; vertical-align: middle; }
  /* O separador vive na LINHA, não em cada célula — assim não pode ficar aos degraus. */
  table.data tbody tr { border-bottom: 1px solid var(--border); }
  /* Nada parte de linha: com alturas iguais, as linhas ficam sempre direitas em qualquer largura. */
  table.data td, table.data th { white-space: nowrap; }
  table.data tbody tr:last-child { border-bottom: 0; }
  table.data tbody tr:hover, table.data tr.hoverable:hover { background: var(--surface-2); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 600; }
  .pill.budget { background: var(--primary-soft); color: var(--primary-dark); }
  .pill.tracking { background: var(--neutral-soft); color: var(--text-muted); }
  .pill.credit { background: var(--warning-soft); color: var(--warning); }
  .cleared-dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; display: inline-grid; place-items: center; font-size: 11px; color: transparent; }
  .cleared-dot.on { background: var(--positive-soft); border-color: var(--positive); color: var(--positive); }
  .tx-amt.out { color: var(--negative); font-weight: 600; }
  .tx-amt.in { color: var(--positive); font-weight: 600; }
  .muted { color: var(--text-muted); }
  .tag { font-size: 11.5px; color: var(--text-muted); }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .row-actions button { background: transparent; border: 0; color: var(--text-muted); padding: 4px 6px; border-radius: 6px; font-size: 13px; }
  .row-actions button:hover { background: var(--neutral-soft); color: var(--text); }

  .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .empty h3 { margin: 0 0 6px; color: var(--text); }

  /* Cartões de indicadores */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 14px; margin-bottom: 22px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
  .kpi .k-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); font-weight: 700; }
  .kpi .k-value { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 6px; letter-spacing: -.5px; }
  .kpi .k-value.pos { color: var(--positive); }
  .kpi .k-value.neg { color: var(--negative); }

  /* Barras dos relatórios */
  .report-block { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .report-block h3 { margin: 0 0 16px; font-size: 15px; }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 90px; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-row .b-name { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: var(--surface-2); border-radius: 6px; height: 22px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--primary), var(--accent2)); min-width: 2px; }
  /* Valor dentro da barra. O halo na cor do cartão mantém-no legível por cima do
     preenchimento ou fora dele, sem depender de a barra ser clara ou escura. */
  .bar-num { position: absolute; inset-inline-end: 7px; top: 0; line-height: 22px; font-size: 11px; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--text); pointer-events: none;
    text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface), 0 0 2px var(--surface); }
  .bar-val { text-align: end; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12.5px; }
  .rep-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .rep-chip { border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); padding: 5px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 600; }
  .rep-chip:hover { border-color: var(--primary); color: var(--text); }
  .evo-host { min-height: 220px; }
  .evo-pt { cursor: pointer; }
  .chart-tip { position: fixed; z-index: 300; background: var(--sidebar); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; pointer-events: none; opacity: 0; white-space: nowrap; box-shadow: var(--shadow-lg); transition: opacity .1s; }
  .chart-tip.show { opacity: 1; }

  /* Janelas */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 100; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); width: 100%; max-width: 460px; overflow: hidden; animation: pop .16s ease; }
  .modal.wide { max-width: 560px; }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-head h2 { margin: 0; font-size: 16.5px; }
  .modal-head button.x { background: transparent; border: 0; font-size: 20px; color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px; }
  .modal-head button.x:hover { background: var(--surface-2); color: var(--text); }
  .modal-body { padding: 20px 22px; }
  .modal-foot { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .field .hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .split-line select, .split-line input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); }
  .split-line select:focus, .split-line input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 9px; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; font-weight: 600; color: var(--text-muted); }
  .seg button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .help-list { font-size: 13px; color: var(--text-muted); }
  .help-list li { margin-bottom: 9px; }
  .help-list b { color: var(--text); }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(30px); background: var(--sidebar); color: #fff; padding: 12px 20px; border-radius: 10px; box-shadow: var(--shadow-lg); font-weight: 600; font-size: 13px; opacity: 0; transition: all .25s; z-index: 200; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .undo-bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(30px); background: var(--sidebar); color: #fff; padding: 8px 10px 8px 16px; border-radius: 11px; box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 14px; opacity: 0; transition: all .25s; z-index: 210; pointer-events: none; }
  .undo-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .undo-bar .btn { background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.3); }
  .undo-bar .btn:hover { background: rgba(255,255,255,.32); }
  .backup-bar { z-index: 205; max-width: calc(100vw - 24px); flex-wrap: wrap; }
  .dot-badge { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warning); margin-inline-start: 5px; vertical-align: middle; }

  .hidden { display: none !important; }
  .mobile-only { display: none; }
  .so-fone { display: none; }
  button { -webkit-tap-highlight-color: transparent; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    /* Barra lateral -> barra de navegação inferior (estilo iOS) */
    .sidebar {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto;
      height: auto; flex-direction: row; padding: 0; gap: 0; overflow: visible;
      z-index: 60; border-top: 1px solid var(--border);
      box-shadow: 0 -2px 12px rgba(15,23,42,.12);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    }
    .brand, .side-section, .side-accounts, .add-acc, .side-total, .side-footer { display: none; }
    .nav { flex-direction: row; width: 100%; padding: 5px 3px; gap: 0; }
    .nav button { flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 1px; font-size: 9px; letter-spacing: -.2px; border-radius: 9px; min-width: 0; }
    .nav button .ic { font-size: 19px; width: auto; }

    /* Cabeçalho — respeita a área segura do iPhone (notch/Dynamic Island) na aplicação instalada */
    .topbar { padding: calc(11px + env(safe-area-inset-top)) calc(13px + env(safe-area-inset-right)) 11px calc(13px + env(safe-area-inset-left)); flex-wrap: wrap; }
    .view-title { order: 1; font-size: 17px; }
    .mobile-only { display: flex; }
    .topbar-actions { order: 2; margin-inline-start: auto; gap: 6px; }
    .theme-toggle { order: 2; }
    .topbar-actions .btn { padding: 8px 11px; }
    .month-nav { order: 3; width: 100%; justify-content: center; margin-top: 8px; }
    .month-nav .month-label { min-width: 120px; }

    /* Conteúdo com espaço para a barra inferior + área segura do iPhone */
    .content { padding: 16px calc(13px + env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) calc(13px + env(safe-area-inset-left)); }
    .rta-banner { margin: 14px 13px 0; padding: 14px 16px; }
    .integrity-bar, .upcoming-bar { margin: 10px 13px 0; }
    .rta-amount { font-size: 22px; }

    /* Safari faz zoom ao focar qualquer campo com menos de 16px.
       A regra é deliberadamente abrangente para não escapar nenhum campo novo. */
    input, select, textarea, .assign-input { font-size: 16px; }

    /* Orçamento compacto; ações sempre visíveis (não há hover no toque) */
    table.budget thead th, .grp-row td, tr.cat-row td { padding: 8px 6px; }
    .cat-actions, .grp-add { opacity: 1 !important; }
    .cat-name-cell { flex-wrap: wrap; gap: 6px; }
    .assign-input { width: 82px; padding: 6px; }
    .activity-cell, .grp-total { font-size: 12.5px; }
    .avail-pill { padding: 4px 8px; }

    /* Escondido no telemóvel: já existe noutro sítio, ou não cabe. */
    .hide-phone { display: none !important; }
    .so-fone { display: inline; }

    /* Campos de data: o iOS dá-lhes largura própria e centra o texto, o que os fazia
       transbordar da coluna e encavalitar no campo do lado. */
    input[type="date"], input[type="month"] {
      -webkit-appearance: none; appearance: none;
      min-width: 0; max-width: 100%; width: 100%; box-sizing: border-box;
      text-align: start; line-height: 1.35; height: auto;
    }
    .grid-2 > *, .toolbar > * { min-width: 0; }

    /* Lista de transações: a nota vai quase sempre vazia e roubava largura, e o texto
       a partir em duas linhas deixava as alturas das linhas todas diferentes. */
    .col-nota { display: none !important; }
    table.data { min-width: 520px; }
    .btn.f-filtro { padding: 6px 9px; font-size: 13px; }
    .rot { display: none; }          /* rótulo longo: fica só o símbolo ou a forma curta */

    /* Tabelas largas (transações/contas/recorrentes) com deslize horizontal suave */
    table.data { min-width: 620px; }

    /* Modais e gráficos */
    .modal-overlay { padding: 14px 10px calc(14px + env(safe-area-inset-bottom)); align-items: flex-start; }
    .modal { max-width: 100%; }
    .toolbar { gap: 8px; }
    .toolbar .search { min-width: 140px; flex: 1; }
    .bar-row { grid-template-columns: 92px 1fr 68px; }
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .undo-bar { bottom: calc(78px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">💰</div>
      <div>
        <h1>O Meu Orçamento</h1>
        <small>Orçamento base-zero</small>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="budget" class="active"><span class="ic">📊</span> Orçamento</button>
      <button data-view="accounts"><span class="ic">🏦</span> Contas</button>
      <button data-view="transactions"><span class="ic">🧾</span> Transações</button>
      <button data-view="recurring"><span class="ic">📅</span> Recorrentes</button>
      <button data-view="reports"><span class="ic">📈</span> Relatórios</button>
    </nav>

    <div class="side-section"><span>Contas</span></div>
    <div class="side-accounts" id="sideAccounts"></div>
    <button class="add-acc" data-action="add-account">+ Adicionar conta</button>
    <div class="side-total"><span>Património líquido</span><b id="netWorth">—</b></div>

    <div class="side-footer">
      <button data-action="add-tx"><span>➕</span> Nova transação</button>
      <button data-action="payees"><span>🏷️</span> Beneficiários</button>
      <button data-action="data-menu" id="btnData"><span>💾</span> Dados e cópias</button>
      <button data-action="help"><span>❓</span> Como funciona</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <h2 class="view-title" id="viewTitle">Orçamento</h2>
      <div class="month-nav" id="monthNav">
        <button class="arrow" data-action="prev-month" aria-label="Mês anterior">‹</button>
        <span class="month-label" id="monthLabel">—</span>
        <button class="arrow" data-action="next-month" aria-label="Mês seguinte">›</button>
        <button class="today-btn" data-action="this-month">Hoje</button>
      </div>
      <div class="topbar-actions mobile-only">
        <button class="btn sm" data-action="add-tx" aria-label="Nova transação">➕</button>
        <button class="btn sm" data-action="payees" aria-label="Beneficiários">🏷️</button>
        <button class="btn sm" data-action="data-menu" aria-label="Dados e cópias de segurança">💾</button>
        <button class="btn sm" data-action="help" aria-label="Como funciona">❓</button>
      </div>
      <button class="theme-toggle" data-action="toggle-theme" title="Alternar cor: verde / rosa" aria-label="Alternar cor da aplicação"></button>
    </div>

    <div id="rtaWrap"></div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast"></div>
<div class="chart-tip" id="chartTip"></div>
<div class="undo-bar" id="undoBar"><span id="undoText"></span><button class="btn sm" data-action="undo-delete">↩ Anular</button></div>
<div class="undo-bar backup-bar" id="backupBar"><span>💾</span><span id="backupText"></span><button class="btn sm" data-action="backup-now">Guardar agora</button><button class="btn sm" data-action="backup-later">Mais tarde</button></div>

<script>
"use strict";
(function () {
  // ---------- Constantes e auxiliares ----------
  var STORAGE_KEY = "meu-orcamento-v1";
  var INCOME = "__income__"; // identificador da categoria especial do «Pronto a atribuir»

  var PAGINA = 50;   // linhas por página nas listas de transações
  var MONTHS_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var REPORT_COLORS = ["#0d9488","#6366f1","#f59e0b","#ef4444","#0891b2","#db2777","#65a30d","#8b5cf6"];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]); }); }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function monthOf(iso) { return (iso || "").slice(0, 7); }
  function nowMonthKey() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1); }
  function monthLabel(key) { var p = key.split("-"); return MONTHS_PT[parseInt(p[1],10)-1] + " " + p[0]; }
  function shiftMonth(key, delta) {
    var p = key.split("-"); var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1 + delta, 1);
    return d.getFullYear() + "-" + pad(d.getMonth()+1);
  }
  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

  // Visualização universal: "." separa milhares, "," separa cêntimos (ex.: 1.234,56 €)
  var CURRENCIES = [["EUR","€"],["GBP","£"],["USD","$"],["BRL","R$"],["CHF","CHF"],["AOA","Kz"]];
  function currencySym(){
    var c = (state && state.settings && state.settings.currency) || "EUR";
    for (var i=0;i<CURRENCIES.length;i++) if (CURRENCIES[i][0]===c) return CURRENCIES[i][1];
    return c;
  }
  function fmt(n) {
    n = round2(n || 0);
    var neg = n < 0; n = Math.abs(n);
    var s = n.toFixed(2).split(".");
    var intp = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "-" : "") + intp + "," + s[1] + " " + currencySym();
  }
  // Datas sempre em dd/mm/aaaa, sem depender do idioma do aparelho — era isso que fazia
  // aparecer o formato americano a quem tem o telemóvel ou o navegador em inglês.
  // (Resultados em cache: formatar linha a linha numa lista grande é caro.)
  var _dtCache = {};
  function fmtDate(iso) {
    if (_dtCache[iso] !== undefined) return _dtCache[iso];
    var p = String(iso == null ? "" : iso).split("-");
    var out = (p.length === 3 && p[0].length === 4) ? (p[2].slice(0,2) + "/" + p[1] + "/" + p[0]) : String(iso);
    _dtCache[iso] = out;
    return out;
  }

  // ---------- Estado ----------
  var DEFAULT_STATE = {
    version: 1,
    settings: { locale: "pt-PT", currency: "EUR" },
    accounts: [],
    groups: [],
    categories: [],
    assignments: {},   // "idCategoria|AAAA-MM": valor
    transactions: [],
    recurring: [],     // regras recorrentes
    backup: { at:null, sig:null, autoDay:null },  // controlo da cópia de segurança em ficheiro
    collapsed: {},     // idGrupo: true
    ui: { view: "budget", month: nowMonthKey() }
  };

  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        s.settings = s.settings || { locale: "pt-PT", currency: "EUR" };
        s.collapsed = s.collapsed || {};
        s.ui = s.ui || { view: "budget", month: nowMonthKey() };
        s.assignments = s.assignments || {};
        s.recurring = s.recurring || [];
        s.backup = s.backup || { at:null, sig:null, autoDay:null };
        delete s._tmpAccType;   // lixo de versões anteriores: era guardado por engano
        return s;
      }
    } catch (e) { console.warn("Falha ao ler dados", e); }
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
  // Se o armazenamento encher, o estado fica só em memória — perde-se ao fechar o separador.
  // Por isso isto não pode ser um aviso que desaparece em dois segundos.
  var _semEspaco = false;
  function save() {
    _idx = null; _payees = null;
    var guardou = true;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { guardou = false; }
    if (guardou) _semEspaco = false;
    else if (!_semEspaco) { _semEspaco = true; try { storageFullModal(); } catch(e2){ toast("Não foi possível guardar — armazenamento cheio."); } }
    scheduleAutoSync();
    return guardou;
  }
  // Quanto ocupa cada coisa no armazenamento deste navegador (aproximado: 2 bytes por caractere).
  function espacoApp(){
    try {
      var dados=0, hist=0, outros=0;
      for (var k in localStorage) {
        if (!localStorage.hasOwnProperty(k)) continue;
        var n = (((localStorage.getItem(k)||"").length) + k.length) * 2;
        if (k===STORAGE_KEY) dados+=n; else if (k===SNAP_KEY) hist+=n; else outros+=n;
      }
      return { dados:dados, hist:hist, outros:outros, total:dados+hist+outros };
    } catch(e){ return null; }
  }

  // ---------- Cálculos do orçamento ----------
  function accountById(id) { for (var i=0;i<state.accounts.length;i++) if (state.accounts[i].id===id) return state.accounts[i]; return null; }
  function categoryById(id) { for (var i=0;i<state.categories.length;i++) if (state.categories[i].id===id) return state.categories[i]; return null; }
  function groupById(id) { for (var i=0;i<state.groups.length;i++) if (state.groups[i].id===id) return state.groups[i]; return null; }
  function categoriesOfGroup(gid) { return state.categories.filter(function (c) { return c.groupId===gid && !c.hidden; }); }

  // Reserva/pagamento automático da categoria de pagamento de um cartão.
  // Compra categorizada no cartão -> reserva (+). Pagamento (transferência para o cartão) -> usa a reserva (-).
  function cardPaymentActivity(cardId, m, upto){
    var s=0;
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i];
      if(t.accountId!==cardId) continue;
      var mm=monthOf(t.date);
      if(upto ? (mm>m) : (mm!==m)) continue;
      if(t.transfer){ s -= (t.inflow||0)-(t.outflow||0); }
      else if(t.categoryId && t.categoryId!==INCOME){ s += (t.outflow||0)-(t.inflow||0); }
    }
    return round2(s);
  }
  function ensurePaymentCategory(card){
    if(card.paymentCatId && categoryById(card.paymentCatId)){ categoryById(card.paymentCatId).name="💳 "+card.name; return; }
    var grp=null; for(var g=0;g<state.groups.length;g++) if(state.groups[g].system) grp=state.groups[g];
    if(!grp){ grp={id:uid(), name:"Pagamentos de cartão de crédito", system:true}; state.groups.push(grp); }
    var cat={id:uid(), groupId:grp.id, name:"💳 "+card.name, cardId:card.id, target:null};
    state.categories.push(cat); card.paymentCatId=cat.id;
  }
  function removePaymentCategory(card){
    if(!card.paymentCatId) return;
    var pid=card.paymentCatId;
    state.categories=state.categories.filter(function(c){return c.id!==pid;});
    for(var k in state.assignments) if(state.assignments.hasOwnProperty(k) && k.split("|")[0]===pid) delete state.assignments[k];
    card.paymentCatId=null;
  }

  function assignedFor(catId, m) { return round2(state.assignments[catId + "|" + m] || 0); }

  // Índice de UM varrimento das transações para o mês apresentado — evita O(categorias × transações) por render.
  var _idx = null;
  var _split = null; // estado de trabalho da transação dividida (não é guardado)
  var _rec = null;   // estado de trabalho da regra recorrente (não é guardado)
  var _undo = [], _undoTimer = null, UNDO_MAX = 5; // histórico de anulação (até 5 passos)
  var _csv = null;   // pré-visualização da importação de CSV
  var _drag = null;  // arrastar para reordenar
  var _searchTimer = null;  // atraso da caixa de procura (não é guardado)
  var _tmpAccType = null;   // tipo escolhido no modal de conta (não é guardado)
  function buildIndex(m){
    var cm={}, cc={}, km={}, kc={}, sumAll=0;
    var bal={}, balCl={}, balUp={};   // saldo por conta: total, só confirmado, e até ao mês m
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i], mm=monthOf(t.date), net=(t.inflow||0)-(t.outflow||0);
      sumAll += net;
      var inM=(mm===m), up=(mm<=m);
      bal[t.accountId]=(bal[t.accountId]||0)+net;
      if(t.cleared) balCl[t.accountId]=(balCl[t.accountId]||0)+net;
      if(up) balUp[t.accountId]=(balUp[t.accountId]||0)+net;
      if(t.categoryId){
        if(inM) cm[t.categoryId]=(cm[t.categoryId]||0)+net;
        if(up) cc[t.categoryId]=(cc[t.categoryId]||0)+net;
      }
      var pd=0;
      if(t.transfer) pd=-net;
      else if(t.categoryId && t.categoryId!==INCOME) pd=(t.outflow||0)-(t.inflow||0);
      if(pd){
        if(inM) km[t.accountId]=(km[t.accountId]||0)+pd;
        if(up) kc[t.accountId]=(kc[t.accountId]||0)+pd;
      }
    }
    // Índice das atribuições — uma passagem, em vez de percorrer o mapa inteiro por cada categoria.
    var ac={}, aTot=0;
    for(var k in state.assignments){
      if(!state.assignments.hasOwnProperty(k)) continue;
      var bar=k.indexOf("|"); if(bar<0) continue;
      if(k.slice(bar+1) > m) continue;                      // só conta até ao mês em vista
      var cid=k.slice(0,bar), v=state.assignments[k];
      ac[cid]=(ac[cid]||0)+v; aTot+=v;
    }
    _idx={month:m, cm:cm, cc:cc, km:km, kc:kc, sumAll:round2(sumAll),
          bal:bal, balCl:balCl, balUp:balUp, ac:ac, aTot:round2(aTot)};
    buildLookup();
  }
  // Tabelas de consulta directa — evitam percorrer listas para cada linha apresentada.
  var _lookup = null;
  function buildLookup(){
    var a={}, c={};
    for(var i=0;i<state.accounts.length;i++) a[state.accounts[i].id]=state.accounts[i];
    for(var j=0;j<state.categories.length;j++) c[state.categories[j].id]=state.categories[j];
    _lookup={acc:a, cat:c};
  }
  function lkAcc(id){ return _lookup ? (_lookup.acc[id]||null) : accountById(id); }
  function lkCat(id){ return _lookup ? (_lookup.cat[id]||null) : categoryById(id); }

  // ---------- Beneficiários já usados ----------
  // Construído a pedido (quando se abre um formulário), não a cada render.
  var _payees = null;
  function payeeKey(s){
    return String(s==null?"":s).toLowerCase().normalize("NFD")
      .replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
  }
  function buildPayees(){
    var m={};
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i];
      if(t.transfer) continue;                       // "↔ Conta" é gerado pela app, não interessa sugerir
      var p=(t.payee||"").trim(); if(!p) continue;
      var k=payeeKey(p); if(!k) continue;
      var e=m[k] || (m[k]={ name:p, count:0, lastDate:"", cat:null, grafias:{} });
      e.count++;
      e.grafias[p]=(e.grafias[p]||0)+1;
      if(t.date>=e.lastDate){ e.lastDate=t.date; e.cat=t.categoryId||null; }
    }
    // Entre «Continente», «continente» e «CONTINENTE», sugere a forma que mais escreveu
    // (e não a última) — senão bastava uma vez em maiúsculas para ficar assim para sempre.
    for(var k2 in m){ if(!m.hasOwnProperty(k2)) continue;
      var ee=m[k2], melhor=null, n=-1;
      for(var g in ee.grafias){ if(ee.grafias.hasOwnProperty(g) && ee.grafias[g]>n){ n=ee.grafias[g]; melhor=g; } }
      if(melhor) ee.name=melhor;
    }
    _payees=m;
  }
  function payeeIndex(){ if(!_payees) buildPayees(); return _payees; }
  // Lista para o <datalist>, dos mais usados para os menos usados.
  function payeeListHTML(){
    var m=payeeIndex(), arr=[];
    for(var k in m) if(m.hasOwnProperty(k)) arr.push(m[k]);
    arr.sort(function(a,b){ return b.count-a.count || (a.lastDate<b.lastDate?1:-1); });
    return arr.slice(0,300).map(function(e){ return '<option value="'+esc(e.name)+'">'; }).join("");
  }
  // Categoria que usou da última vez neste beneficiário — só se ainda existir.
  function payeeCategoria(nome){
    var e=payeeIndex()[payeeKey(nome)];
    if(!e || !e.cat) return null;
    if(e.cat===INCOME || lkCat(e.cat)) return e.cat;
    return null;
  }

  function activityFor(catId, m) {
    var cat = lkCat(catId);
    if (_idx && _idx.month === m) {
      if (cat && cat.cardId) return round2(_idx.km[cat.cardId] || 0);
      return round2(_idx.cm[catId] || 0);
    }
    if (cat && cat.cardId) return cardPaymentActivity(cat.cardId, m, false);
    var s = 0;
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i];
      if (t.categoryId === catId && monthOf(t.date) === m) s += (t.inflow||0) - (t.outflow||0);
    }
    return round2(s);
  }

  function availableFor(catId, m) {
    var cat = lkCat(catId);
    if (_idx && _idx.month === m) {
      var a = _idx.ac[catId] || 0;
      if (cat && cat.cardId) return round2(a + (_idx.kc[cat.cardId] || 0));
      return round2(a + (_idx.cc[catId] || 0));
    }
    var assigned = 0;
    for (var k in state.assignments) {
      if (!state.assignments.hasOwnProperty(k)) continue;
      var parts = k.split("|");
      if (parts[0] === catId && parts[1] <= m) assigned += state.assignments[k];
    }
    if (cat && cat.cardId) return round2(assigned + cardPaymentActivity(cat.cardId, m, true));
    var activity = 0;
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i];
      if (t.categoryId === catId && monthOf(t.date) <= m) activity += (t.inflow||0) - (t.outflow||0);
    }
    return round2(assigned + activity);
  }

  function totalIncomeUpto(m) {
    if (_idx && _idx.month === m) return round2(_idx.cc[INCOME] || 0);
    var s = 0;
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i];
      if (t.categoryId === INCOME && monthOf(t.date) <= m) s += (t.inflow||0) - (t.outflow||0);
    }
    return round2(s);
  }
  function totalAssignedUpto(m) {
    if (_idx && _idx.month === m) return _idx.aTot;
    var s = 0;
    for (var k in state.assignments) { if (state.assignments.hasOwnProperty(k) && k.split("|")[1] <= m) s += state.assignments[k]; }
    return round2(s);
  }
  function readyToAssign(m) { return round2(totalIncomeUpto(m) - totalAssignedUpto(m)); }

  // Saldos vêm do índice (não dependem do mês em vista); só percorrem as transações se ainda não houver índice.
  function accountBalance(accId, clearedOnly) {
    if (_idx) return round2((clearedOnly ? _idx.balCl : _idx.bal)[accId] || 0);
    var s = 0;
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i];
      if (t.accountId === accId && (!clearedOnly || t.cleared)) s += (t.inflow||0) - (t.outflow||0);
    }
    return round2(s);
  }
  // Saldo de uma conta contando só o que acontece até ao fim do mês m (usado na verificação do orçamento).
  function accountBalanceUpto(accId, m) {
    if (_idx && _idx.month === m) return round2(_idx.balUp[accId] || 0);
    var s = 0;
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i];
      if (t.accountId === accId && monthOf(t.date) <= m) s += (t.inflow||0) - (t.outflow||0);
    }
    return round2(s);
  }
  function netWorth() { var s=0; for (var i=0;i<state.accounts.length;i++) s += accountBalance(state.accounts[i].id); return round2(s); }

  // ---------- Integridade do orçamento ----------
  // Num orçamento base-zero tem de ser sempre verdade que:
  //     Pronto a atribuir + Σ Disponível (todas as categorias) === dinheiro nas contas de orçamento
  // Se não bater, é porque entrou ou saiu dinheiro do orçamento sem passar por uma categoria.
  // Os cartões de crédito ficam de fora desta soma: o que se gasta neles já está reservado
  // na respetiva categoria de pagamento, e a dívida não é dinheiro em caixa.
  function budgetCashUpto(m){
    var s=0;
    for(var i=0;i<state.accounts.length;i++){ var a=state.accounts[i]; if(a.type==="budget") s+=accountBalanceUpto(a.id, m); }
    return round2(s);
  }
  function budgetedTotal(m){
    var s=readyToAssign(m);
    for(var i=0;i<state.categories.length;i++) s+=availableFor(state.categories[i].id, m);
    return round2(s);
  }
  // Positivo: há dinheiro nas contas que o orçamento não conhece.
  // Negativo: o orçamento conta com dinheiro que já não existe nas contas.
  function integrityDelta(m){ return round2(budgetCashUpto(m) - budgetedTotal(m)); }

  // Lista as transações responsáveis pela diferença. A soma dos "delta" dá o integrityDelta.
  // Contribuição de UMA transação para cada lado da invariante.
  // Somando isto sobre todas as transações obtém-se exatamente o integrityDelta — por
  // construção, não por enumeração de casos. É isso que garante que nenhum tipo de
  // movimento, por invulgar que seja, escapa à explicação do painel.
  function contribuicao(t){
    var acc = lkAcc(t.accountId);
    if (!acc) return null;
    var net = (t.inflow||0) - (t.outflow||0);
    var real = acc.type==="budget" ? net : 0;            // lado do dinheiro nas contas
    var esperado = 0;                                     // lado do orçamento
    if (t.categoryId === INCOME) esperado += net;         // entra no «Pronto a atribuir»
    else if (t.categoryId) {
      var c = lkCat(t.categoryId);
      if (c && !c.cardId) esperado += net;                // categoria normal
    }
    // Reserva para a fatura do cartão, quando a conta é um cartão com categoria de pagamento viva.
    if (acc.type==="credit" && acc.paymentCatId) {
      var pc = lkCat(acc.paymentCatId);
      if (pc && pc.cardId === acc.id) {
        esperado += t.transfer ? -net : ((t.categoryId && t.categoryId!==INCOME) ? -net : 0);
      }
    }
    return { acc:acc, net:net, delta: round2(real - esperado) };
  }

  // Lista os movimentos que desequilibram o orçamento, já com o motivo identificado.
  // A soma dos "delta" é, por construção, igual ao integrityDelta.
  function integrityIssues(m){
    var itens=[], cartaoSemCat=0;
    var pares={}, deltaPar={};
    for(var i=0;i<state.transactions.length;i++){ var tp=state.transactions[i]; if(tp.transfer){ (pares[tp.transfer]=pares[tp.transfer]||[]).push(tp); } }
    // Uma transferência tem de ser julgada pelo PAR: cada metade sozinha parece desequilibrar
    // (sai de um lado, entra no outro), mas juntas normalmente fecham.
    for(var q=0;q<state.transactions.length;q++){
      var tq=state.transactions[q];
      if(!tq.transfer || monthOf(tq.date) > m) continue;
      var cq=contribuicao(tq); if(!cq) continue;
      deltaPar[tq.transfer]=round2((deltaPar[tq.transfer]||0)+cq.delta);
    }
    var parJaVisto={};
    for(var j=0;j<state.transactions.length;j++){
      var t=state.transactions[j];
      if(monthOf(t.date) > m) continue;
      var cb = contribuicao(t);
      if(!cb) continue;
      var acc = cb.acc;
      // Compras no cartão sem categoria não desequilibram nada, mas também não reservam
      // dinheiro para a fatura — vale a pena contá-las à parte.
      if(!t.transfer && !t.categoryId && acc.type==="credit") cartaoSemCat++;
      if(t.transfer){
        if(parJaVisto[t.transfer]) continue;
        if(Math.abs(deltaPar[t.transfer]||0) < 0.005) continue;
        // representa-se o par pela metade do lado do orçamento, que é onde se corrige
        var hs0=pares[t.transfer]||[], repr=t;
        for(var z=0;z<hs0.length;z++){ var az=lkAcc(hs0[z].accountId); if(az && az.type==="budget"){ repr=hs0[z]; break; } }
        if(repr!==t) continue;
        parJaVisto[t.transfer]=true;
        cb = { acc:lkAcc(t.accountId), net:0, delta:deltaPar[t.transfer] };
        acc = cb.acc;
      }
      else if(Math.abs(cb.delta) < 0.005) continue;

      var motivo, outra=null, oa=null;
      if(t.transfer){
        var hs=pares[t.transfer]||[];
        for(var h=0;h<hs.length;h++) if(hs[h].id!==t.id) outra=hs[h];
        oa = outra ? lkAcc(outra.accountId) : null;
        if(!oa) motivo="meia";
        else if(t.categoryId) motivo="transfCat";
        else if(acc.type==="budget" || oa.type==="budget") motivo="paraFora";
        else motivo="transfCartao";
      }
      else if(t.categoryId === INCOME) motivo="rendFora";
      else if(t.categoryId && !lkCat(t.categoryId)) motivo="orfa";
      else if(t.categoryId) motivo="categFora";
      else motivo="semCat";
      itens.push({ t:t, acc:acc, outra:oa, delta:cb.delta, motivo:motivo });
    }
    itens.sort(function(a,b){ return a.t.date<b.t.date?1:(a.t.date>b.t.date?-1:0); });
    return { itens:itens, cartaoSemCat:cartaoSemCat };
  }

  // Transferência entre contas: cria duas metades ligadas pelo mesmo id 'transfer'. Sem categoria (não afeta o orçamento).
  // Uma transferência entre uma conta de orçamento e uma de acompanhamento faz o dinheiro
  // sair (ou entrar) do orçamento — nesse caso a metade que está do lado do orçamento
  // precisa de categoria, senão as contas deixam de bater certo com o orçamento.
  function crossesBudget(from, to){
    return (from.type==="budget" && to.type==="tracking") || (from.type==="tracking" && to.type==="budget");
  }
  function createTransfer(fromId, toId, amount, date, cleared, budgetCat, memo){
    var from=accountById(fromId), to=accountById(toId);
    if(!from||!to||fromId===toId||!(amount>0)) return false;
    var cat = (budgetCat && crossesBudget(from,to)) ? budgetCat : null;
    var pair=uid();
    state.transactions.push({id:uid(), date:date, accountId:fromId, payee:"↔ "+to.name, categoryId:(cat && from.type==="budget")?cat:null, memo:memo||"", outflow:round2(amount), inflow:0, cleared:!!cleared, transfer:pair});
    state.transactions.push({id:uid(), date:date, accountId:toId, payee:"↔ "+from.name, categoryId:(cat && to.type==="budget")?cat:null, memo:memo||"", outflow:0, inflow:round2(amount), cleared:!!cleared, transfer:pair});
    return true;
  }
  // Reescreve as DUAS metades de uma transferência já existente, sempre como espelho
  // uma da outra. É por isto que editar uma transferência é seguro.
  function updateTransfer(pair, fromId, toId, amount, date, cleared, budgetCat, memo){
    var from=accountById(fromId), to=accountById(toId);
    if(!from||!to||fromId===toId||!(amount>0)) return false;
    var metades=state.transactions.filter(function(x){ return x.transfer===pair; });
    if(metades.length!==2) return false;
    var hSaida   = (metades[0].outflow||0)>0.005 ? metades[0] : metades[1];
    var hEntrada = hSaida===metades[0] ? metades[1] : metades[0];
    var cat = (budgetCat && crossesBudget(from,to)) ? budgetCat : null;
    var v = round2(amount);
    hSaida.accountId=fromId; hSaida.payee="↔ "+to.name;   hSaida.categoryId=(cat && from.type==="budget")?cat:null;
    hSaida.outflow=v; hSaida.inflow=0;  hSaida.date=date; hSaida.memo=memo||""; hSaida.cleared=!!cleared;
    hEntrada.accountId=toId; hEntrada.payee="↔ "+from.name; hEntrada.categoryId=(cat && to.type==="budget")?cat:null;
    hEntrada.outflow=0; hEntrada.inflow=v; hEntrada.date=date; hEntrada.memo=memo||""; hEntrada.cleared=!!cleared;
    return true;
  }

  function monthsBetween(fromKey, toKey) {
    var f=fromKey.split("-"), t=toKey.split("-");
    return (parseInt(t[0],10)-parseInt(f[0],10))*12 + (parseInt(t[1],10)-parseInt(f[1],10));
  }
  // Quantas vezes um dia da semana (0=Dom .. 6=Sáb) acontece num mês → 4 ou 5
  function weekdayCount(monthKey, weekday) {
    var p=monthKey.split("-"), year=parseInt(p[0],10), month=parseInt(p[1],10)-1;
    var days=new Date(year, month+1, 0).getDate(), count=0;
    for (var d=1; d<=days; d++) if (new Date(year, month, d).getDay()===weekday) count++;
    return count;
  }
  function isoOf(dt){ return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate()); }
  var FREQ_LABEL = { weekly:"Semanal", biweekly:"Quinzenal", monthly:"Mensal", semiannual:"Semestral", yearly:"Anual" };
  function advanceDate(iso, freq){
    var p=iso.split("-"), y=+p[0], mo=+p[1]-1, d=+p[2];
    if(freq==="weekly") return isoOf(new Date(y,mo,d+7));
    if(freq==="biweekly") return isoOf(new Date(y,mo,d+14));
    if(freq==="yearly"){ var lastY=new Date(y+1,mo+1,0).getDate(); return (y+1)+"-"+pad(mo+1)+"-"+pad(Math.min(d,lastY)); }
    if(freq==="semiannual"){ var sm=mo+6, sy=y; if(sm>11){ sm-=12; sy++; } var lastS=new Date(sy,sm+1,0).getDate(); return sy+"-"+pad(sm+1)+"-"+pad(Math.min(d,lastS)); }
    var nm=mo+1, ny=y; if(nm>11){nm-=12;ny++;}
    var lastM=new Date(ny,nm+1,0).getDate();
    return ny+"-"+pad(nm+1)+"-"+pad(Math.min(d,lastM));
  }
  // Uma regra com conta de destino lança uma TRANSFERÊNCIA (as duas metades de uma vez);
  // sem destino, lança uma transação normal. É o mesmo caminho em ambos os casos.
  function lancarRecorrente(r, data){
    if (r.toAccountId) {
      var v = round2((r.outflow||0) || (r.inflow||0));
      return createTransfer(r.accountId, r.toAccountId, v, data, false, r.categoryId||null, r.memo||"");
    }
    state.transactions.push({id:uid(), date:data, accountId:r.accountId, payee:r.payee||"",
      categoryId:r.categoryId||null, memo:r.memo||"", outflow:r.outflow||0, inflow:r.inflow||0, cleared:false});
    return true;
  }
  // Uma regra só é lançável se as contas envolvidas ainda existirem e forem diferentes.
  function recValida(r){
    if (!accountById(r.accountId)) return false;
    if (r.toAccountId && (!accountById(r.toAccountId) || r.toAccountId===r.accountId)) return false;
    return true;
  }
  function processRecurring(){
    var today=todayISO(), created=0, list=state.recurring||[];
    for(var i=0;i<list.length;i++){
      var r=list[i]; if(!r.active) continue;
      if(!recValida(r)) continue;
      var guard=0;
      while(r.nextDate && r.nextDate<=today && guard<120){
        lancarRecorrente(r, r.nextDate);
        r.nextDate=advanceDate(r.nextDate, r.freq);
        created++; guard++;
      }
    }
    if(created>0) save();
    return created;
  }
  function recById(id){ for(var i=0;i<(state.recurring||[]).length;i++) if(state.recurring[i].id===id) return state.recurring[i]; return null; }

  // O que as regras recorrentes ainda vão lançar dentro do mês m (de hoje em diante).
  // O processRecurring() já lançou tudo o que estava em atraso, por isso parte-se do nextDate.
  function upcomingRecurring(m){
    if (m < nowMonthKey()) return [];                       // meses passados não têm futuro
    var hoje=todayISO(), out=[], list=state.recurring||[];
    for(var i=0;i<list.length;i++){
      var r=list[i];
      if(!r.active || !accountById(r.accountId)) continue;
      var d=r.nextDate, guarda=0;
      while(d && d.slice(0,7)<=m && guarda++<600){
        if(d.slice(0,7)===m && d>=hoje) out.push({r:r, date:d});
        d=advanceDate(d, r.freq);
      }
    }
    out.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
    return out;
  }
  function upcomingTotals(m){
    var l=upcomingRecurring(m), sai=0, entra=0, porCat={};
    for(var i=0;i<l.length;i++){
      var r=l[i].r;
      if(r.toAccountId && !r.categoryId) continue;      // transferência interna: não mexe no orçamento
      sai+=(r.outflow||0); entra+=(r.inflow||0);
      if(r.categoryId && r.categoryId!==INCOME && r.outflow) porCat[r.categoryId]=(porCat[r.categoryId]||0)+r.outflow;
    }
    return { lista:l, sai:round2(sai), entra:round2(entra), porCat:porCat };
  }
  // Fixa os grupos de sistema (pagamentos de cartão) no topo, preservando a ordem dos restantes.
  function pinSystemGroups(){ var sys=[],norm=[]; for(var i=0;i<state.groups.length;i++){ (state.groups[i].system?sys:norm).push(state.groups[i]); } state.groups=sys.concat(norm); }
  function moveGroup(id, dir){
    var idx=-1; for(var i=0;i<state.groups.length;i++) if(state.groups[i].id===id) idx=i;
    if(idx<0 || state.groups[idx].system) return;           // grupos de sistema não se movem
    var j=idx+dir; if(j<0||j>=state.groups.length || state.groups[j].system) return; // nem passam à frente de um grupo de sistema
    var t=state.groups[idx]; state.groups[idx]=state.groups[j]; state.groups[j]=t;
  }
  // Arrastar: move a categoria de origem para a posição da categoria de destino (e para o grupo dela).
  function dropCategory(srcId, dstId){
    if(srcId===dstId) return false;
    var src=categoryById(srcId), dst=categoryById(dstId);
    if(!src||!dst||src.cardId||dst.cardId) return false;
    var si=-1, di=-1;
    for(var i=0;i<state.categories.length;i++){ if(state.categories[i].id===srcId) si=i; if(state.categories[i].id===dstId) di=i; }
    if(si<0||di<0) return false;
    state.categories.splice(si,1);          // di (posição original do destino) é o ponto de inserção correto
    src.groupId=dst.groupId;
    state.categories.splice(di,0,src);
    return true;
  }
  function dropGroup(srcId, dstId){
    if(srcId===dstId) return false;
    var src=groupById(srcId), dst=groupById(dstId);
    if(!src||!dst||src.system||dst.system) return false;
    var si=-1, di=-1;
    for(var i=0;i<state.groups.length;i++){ if(state.groups[i].id===srcId) si=i; if(state.groups[i].id===dstId) di=i; }
    if(si<0||di<0) return false;
    state.groups.splice(si,1);
    state.groups.splice(di,0,src);
    return true;
  }
  function moveCategory(id, dir){
    var cat=categoryById(id); if(!cat) return;
    var sib=categoriesOfGroup(cat.groupId), pos=-1; for(var i=0;i<sib.length;i++) if(sib[i].id===id) pos=i;
    var target=sib[pos+dir]; if(!target) return;
    var gi=-1,gj=-1; for(var k=0;k<state.categories.length;k++){ if(state.categories[k].id===id) gi=k; if(state.categories[k].id===target.id) gj=k; }
    if(gi<0||gj<0) return;
    var t=state.categories[gi]; state.categories[gi]=state.categories[gj]; state.categories[gj]=t;
  }
  // Cadências de alvo: mensal | semanal | trimestral | anual | até uma data.
  // Devolve {need, met, progress, label} ou null quando a categoria não tem alvo.
  function targetInfo(cat, m) {
    if (!cat.target || !(cat.target.amount>0)) return null;
    var tg = cat.target, type = tg.type || "monthly", amt = tg.amount;
    var avail = availableFor(cat.id, m);
    var assignedThis = assignedFor(cat.id, m);
    if (type==="monthly") {
      var fund = tg.fund || "refill";
      if (fund==="setAside") {
        var needS = Math.max(0, round2(amt - assignedThis));
        return { need:needS, met: assignedThis>=amt-0.005, progress: Math.max(0,Math.min(1, amt>0?assignedThis/amt:0)),
          label: needS>0 ? ("Reservar "+fmt(needS)+" este mês — "+fmt(amt)+"/mês (sempre)") : ("✅ Reservado "+fmt(amt)+" este mês") };
      }
      var needM = Math.max(0, round2(amt - avail));
      return { need:needM, met: avail>=amt-0.005, progress: Math.max(0,Math.min(1, avail/amt)),
        label: needM>0 ? ("Faltam "+fmt(needM)+" para ter "+fmt(amt)+" disponível") : ("🎯 Alvo cumprido — "+fmt(amt)+" disponível") };
    }
    if (type==="weekly") {
      var wd = (tg.weekday==null?1:tg.weekday);
      var weeks = weekdayCount(m, wd);
      var monthTarget = round2(amt*weeks);
      var needW = Math.max(0, round2(monthTarget - avail));
      return { need:needW, met: avail>=monthTarget-0.005, progress: Math.max(0,Math.min(1, monthTarget>0?avail/monthTarget:0)),
        label: needW>0 ? ("Faltam "+fmt(needW)+" — "+fmt(amt)+"/semana × "+weeks+" semanas = "+fmt(monthTarget))
                       : ("🎯 Alvo semanal cumprido ("+fmt(amt)+"/semana × "+weeks+" = "+fmt(monthTarget)+")") };
    }
    if (type==="quarterly" || type==="yearly") {
      var per = type==="quarterly"?3:12, cad = type==="quarterly"?"trimestre":"ano";
      // Mês da despesa (opcional). Quando já passou, avança sozinho para o período seguinte,
      // para o alvo continuar a funcionar ano após ano sem ser preciso mexer nele.
      var dueEff = tg.due || null, gd = 0;
      while (dueEff && monthsBetween(m, dueEff) < 0 && gd++ < 240) dueEff = shiftMonth(dueEff, per);

      var falta = round2(amt - avail);
      if (falta <= 0.005) {
        return { need:0, met:true, progress:1,
          label: "🎯 Já tem "+fmt(amt)+" juntos"+(dueEff?(" para "+monthLabel(dueEff)):"")+" — nada a reservar este mês" };
      }
      var fatia, restantes = per;
      if (dueEff) { var dm = monthsBetween(m, dueEff); restantes = dm>=0 ? dm+1 : 1; fatia = round2(falta/restantes); }
      else fatia = round2(amt/per);
      // Nunca pedir mais do que falta para o total — é isto que faz o alvo "acabar".
      var needQ = Math.max(0, round2(Math.min(fatia - assignedThis, falta)));
      var lbl;
      if (needQ > 0.005) {
        lbl = dueEff ? ("Juntar "+fmt(needQ)+" este mês até "+monthLabel(dueEff)+" — faltam "+fmt(falta)+" de "+fmt(amt))
                     : ("Reservar "+fmt(needQ)+" este mês — "+fmt(fatia)+"/mês para "+fmt(amt)+"/"+cad);
      } else {
        lbl = "✅ Reservado o deste mês — faltam "+fmt(falta)+" de "+fmt(amt)+(dueEff?(" até "+monthLabel(dueEff)):"");
      }
      return { need:needQ, met: needQ<=0.005, progress: Math.max(0,Math.min(1, amt>0?avail/amt:0)), label: lbl };
    }
    if (type==="byDate") {
      var target = tg.date || m;
      var diff = monthsBetween(m, target), left = diff>=0 ? diff+1 : 1;
      var need3 = Math.max(0, round2((amt - avail) / left)), remain = round2(amt - avail);
      return { need:need3, met: avail>=amt-0.005, progress: Math.max(0,Math.min(1, avail/amt)),
        label: avail>=amt-0.005 ? ("🎯 Objetivo atingido ("+fmt(amt)+")")
              : ("Juntar "+fmt(need3)+"/mês até "+monthLabel(target)+" — faltam "+fmt(remain)+" de "+fmt(amt)) };
    }
    return null;
  }

  function orderedCategories() {
    var out=[];
    for (var g=0; g<state.groups.length; g++){ var cs=categoriesOfGroup(state.groups[g].id); for(var c=0;c<cs.length;c++) out.push(cs[c]); }
    return out;
  }
  var PRIO_RANK = { alta:0, normal:1, baixa:2 };
  var PRIO_LABEL = { alta:"Alta", normal:"Normal", baixa:"Baixa" };
  var PRIO_ICON  = { alta:"▲", normal:"●", baixa:"▼" };
  var PRIO_CICLO = ["alta","normal","baixa"];        // cada clique desce um nível; do fundo volta ao topo
  // mode "full" = cobre a totalidade dos alvos em falta.
  // mode "cap"  = financia só até esgotar o Pronto a atribuir, segundo a estratégia:
  //   "order"    – pela ordem do orçamento (enche cada uma até acabar o dinheiro)
  //   "priority" – primeiro as de prioridade Alta, depois Normal, depois Baixa
  //   "prop"     – reparte proporcionalmente ao que falta em cada categoria
  function fundingPlan(mode, m, strategy) {
    strategy = strategy || "priority";        // predefinição num sítio só, não em cada chamada
    var list = orderedCategories();
    var rta = readyToAssign(m);
    var needs = [];
    for (var i=0;i<list.length;i++){
      var c=list[i], ti=targetInfo(c,m);
      if (!ti || !(ti.need>0)) continue;
      needs.push({ catId:c.id, name:c.name, need:round2(ti.need), prio:(c.priority||"normal") });
    }
    var entries = [];
    if (mode !== "cap") {
      entries = needs.map(function(n){ return {catId:n.catId, name:n.name, add:n.need, prio:n.prio}; });
    } else if (rta > 0.005) {
      if (strategy === "prop") {
        var totalNeed = 0; needs.forEach(function(n){ totalNeed += n.need; });
        if (totalNeed <= rta + 0.005) {
          entries = needs.map(function(n){ return {catId:n.catId, name:n.name, add:n.need, prio:n.prio}; });
        } else {
          entries = needs.map(function(n){ return {catId:n.catId, name:n.name, add:round2(rta*(n.need/totalNeed)), prio:n.prio}; });
          var sum=0; entries.forEach(function(e){ sum+=e.add; });
          var diff = round2(rta - sum);
          if (entries.length && Math.abs(diff) >= 0.005) entries[entries.length-1].add = round2(entries[entries.length-1].add + diff);
          entries = entries.filter(function(e){ return e.add > 0.005; });
        }
      } else {
        var order = needs.slice();
        if (strategy === "priority") order.sort(function(a,b){ return (PRIO_RANK[a.prio]==null?1:PRIO_RANK[a.prio]) - (PRIO_RANK[b.prio]==null?1:PRIO_RANK[b.prio]); });
        var remaining = rta;
        for (var j=0;j<order.length;j++){
          if (remaining <= 0.005) break;
          var add = Math.min(order[j].need, round2(remaining));
          if (add <= 0.005) continue;
          entries.push({catId:order[j].catId, name:order[j].name, add:round2(add), prio:order[j].prio});
          remaining = round2(remaining - add);
        }
      }
    }
    var total=0; for (var k=0;k<entries.length;k++) total += entries[k].add;
    total = round2(total);
    return { entries:entries, total:total, rtaBefore:round2(rta), rtaAfter:round2(rta-total) };
  }

  // Operação simétrica do financiamento: quando se atribuiu mais do que havia, retira
  // das categorias até o «Pronto a atribuir» voltar a zero.
  // A diferença de fundo é o limite de cada categoria — aqui é o que ela TEM, não o que lhe falta.
  // E por prioridade tira-se primeiro das BAIXAS, para proteger as Altas: ao contrário do
  // financiamento, onde as Altas são as primeiras a ser servidas.
  function recoverPlan(m, strategy) {
    strategy = strategy || "priority";
    var rta = readyToAssign(m), falta = round2(-rta);
    if (falta <= 0.005) return { entries:[], total:0, rtaBefore:rta, rtaAfter:rta, disponivel:0 };

    var list = orderedCategories(), podem = [], totalTem = 0;
    for (var i=0;i<list.length;i++){
      var c = list[i];
      if (c.cardId) continue;                        // a do cartão é automática, não se mexe
      var tem = availableFor(c.id, m);
      if (tem > 0.005) { podem.push({ catId:c.id, name:c.name, tem:round2(tem), prio:(c.priority||"normal") }); totalTem += tem; }
    }
    totalTem = round2(totalTem);
    var entries = [];
    if (strategy === "prop") {
      if (totalTem <= falta + 0.005) entries = podem.map(function(p){ return {catId:p.catId, name:p.name, add:round2(-p.tem), prio:p.prio}; });
      else {
        entries = podem.map(function(p){ return {catId:p.catId, name:p.name, add:round2(-falta*(p.tem/totalTem)), prio:p.prio}; });
        var soma=0; entries.forEach(function(e){ soma+=e.add; });
        var dif = round2(-falta - soma);
        if (entries.length && Math.abs(dif) >= 0.005) entries[entries.length-1].add = round2(entries[entries.length-1].add + dif);
        entries = entries.filter(function(e){ return e.add < -0.005; });
      }
    } else {
      var ordem = podem.slice();
      if (strategy === "priority") ordem.sort(function(a,b){ return (PRIO_RANK[b.prio]==null?1:PRIO_RANK[b.prio]) - (PRIO_RANK[a.prio]==null?1:PRIO_RANK[a.prio]); });
      else ordem.reverse();                          // pela ordem da lista, mas de baixo para cima
      var resta = falta;
      for (var j=0;j<ordem.length;j++){
        if (resta <= 0.005) break;
        var tira = Math.min(ordem[j].tem, round2(resta));
        if (tira <= 0.005) continue;
        entries.push({catId:ordem[j].catId, name:ordem[j].name, add:round2(-tira), prio:ordem[j].prio});
        resta = round2(resta - tira);
      }
    }
    var total=0; entries.forEach(function(e){ total += e.add; });
    total = round2(total);
    return { entries:entries, total:total, rtaBefore:rta, rtaAfter:round2(rta - total), disponivel:totalTem };
  }

  // ---------- Desenho do ecrã ----------
  function applyTheme(){ if (document.body) document.body.classList.toggle("theme-rose", !!(state.settings && state.settings.theme==="rose")); }

  // Estado de uma categoria no mês: "neg" (excesso), "warn" (abaixo do alvo), "ok" (cumprido), "none" (sem alvo)
  function catStatus(cat, m){
    var avail = availableFor(cat.id, m);
    if (avail < -0.005) return "neg";
    if (cat.cardId){
      var debt = round2(-accountBalance(cat.cardId));
      if (debt <= 0.005) return "ok";
      return avail >= debt-0.005 ? "ok" : "warn";
    }
    var ti = targetInfo(cat, m);
    if (!ti) return "none";
    return ti.met ? "ok" : "warn";
  }

  // Filtros da barra do orçamento. Dentro de cada grupo é "ou"; entre os dois grupos é "e"
  // (por exemplo «Abaixo do alvo» E «Alta»). Sem nada escolhido num grupo, esse grupo não filtra.
  function passaFiltros(c, m, bf, bp){
    bf = bf || {}; bp = bp || {};
    var fEstado = !!(bf.warn || bf.neg || bf.ok);
    var fPrio   = !!(bp.alta || bp.normal || bp.baixa);
    if (fEstado && !bf[catStatus(c, m)]) return false;
    if (fPrio && (c.cardId || !bp[c.priority||"normal"])) return false;   // as do cartão não têm prioridade
    return true;
  }

  function renderBudget() {
    var m = state.ui.month;
    if (!state.groups.length) {
      el("content").innerHTML = emptyState("📊", "Comece o seu orçamento",
        "Crie grupos e categorias para dar uma função a cada euro. Para experimentar com dados de exemplo, use «Dados e cópias».",
        '<button class="btn primary" data-action="add-group">+ Novo grupo</button>');
      return;
    }
    var upc = upcomingTotals(m).porCat;   // o que cada categoria ainda tem por sair este mês
    var bf = state.ui.budgetFilters || {};
    var bp = state.ui.prioFilters || {};
    var filtering = !!(bf.warn || bf.neg || bf.ok || bp.alta || bp.normal || bp.baixa);
    var nShown=0, nTotal=0;
    var rows = "";
    for (var g=0; g<state.groups.length; g++) {
      var grp = state.groups[g];
      var allCats = categoriesOfGroup(grp.id);
      nTotal += allCats.length;
      var cats = filtering ? allCats.filter(function(c){ return passaFiltros(c, m, bf, bp); }) : allCats;
      nShown += cats.length;
      if (filtering && !cats.length) continue;
      var gAssigned=0, gActivity=0, gAvail=0;
      for (var c=0;c<cats.length;c++){ gAssigned+=assignedFor(cats[c].id,m); gActivity+=activityFor(cats[c].id,m); gAvail+=availableFor(cats[c].id,m); }
      var collapsed = !!state.collapsed[grp.id];
      rows += '<tr class="grp-row"'+(grp.system?'':' draggable="true" data-drag="grp" data-drag-id="'+grp.id+'"')+'><td>' +
        '<div class="grp-name"><button class="grp-toggle" data-action="toggle-group" data-id="'+grp.id+'">' +
        '<span class="caret" style="transform:rotate('+(collapsed?"-90":"0")+'deg)">▾</span>' + esc(grp.name) + '</button>' +
        (grp.system ? '' :
          '<button class="grp-add" data-action="add-category" data-id="'+grp.id+'">+ categoria</button>' +
          '<button class="grp-add" data-action="edit-group" data-id="'+grp.id+'">✎</button>') + '</div></td>' +
        '<td class="grp-total">'+fmt(gAssigned)+'</td>' +
        '<td class="grp-total">'+fmt(gActivity)+'</td>' +
        '<td class="grp-total">'+fmt(gAvail)+'</td></tr>';
      if (collapsed) continue;
      if (!cats.length && !grp.system && !filtering) {
        rows += '<tr class="cat-row"><td colspan="4" style="padding:9px 18px;"><button class="btn ghost sm" data-action="add-category" data-id="'+grp.id+'">+ Adicionar categoria a este grupo</button></td></tr>';
      }
      for (var c2=0;c2<cats.length;c2++) {
        var cat = cats[c2];
        var assigned = assignedFor(cat.id, m);
        var activity = activityFor(cat.id, m);
        var avail = availableFor(cat.id, m);
        var pillCls = avail > 0.005 ? "pos" : (avail < -0.005 ? "neg" : "zero");
        if (cat.cardId) {
          var debt = round2(-accountBalance(cat.cardId));
          var pnote = debt<=0.005 ? "Sem dívida a pagar" : (avail>=debt-0.005 ? ("✅ Dívida coberta ("+fmt(debt)+")") : ("Falta "+fmt(round2(debt-avail))+" para cobrir a dívida de "+fmt(debt)));
          if (debt>0.005 && avail<debt-0.005 && pillCls==="pos") pillCls="warn";
          var cstatP = catStatus(cat, m);
          var barP = debt>0.005 ? (cstatP==="neg" ? 100 : Math.max(0,Math.min(1, avail/debt))*100) : 100;
          var barClsP = cstatP==="neg" ? "neg" : (cstatP==="ok" ? "full" : "warn");
          rows += '<tr class="cat-row" data-id="'+cat.id+'"><td>' +
            '<div class="cat-name-cell"><span class="cat-name">'+esc(cat.name)+'</span>' +
            (debt>0.005 ? ' <button class="btn ghost sm" data-action="pay-card" data-id="'+cat.cardId+'" title="Pagar / abater o cartão">💳 Pagar</button>' : '') +
            '</div>' +
            '<div class="target-bar"><span class="'+barClsP+'" style="width:'+barP+'%"></span></div>' +
            '<div class="target-note">'+pnote+'</div></td>' +
            '<td class="num"><input class="assign-input money" data-neg="1" maxlength="13" type="text" inputmode="decimal" data-assign="'+cat.id+'" value="'+amtStr(assigned)+'" placeholder="0,00"></td>' +
            '<td class="num activity-cell">'+fmt(activity)+'</td>' +
            '<td class="num"><span class="avail-pill '+pillCls+'">'+fmt(avail)+'</span></td></tr>';
          continue;
        }
        var targetHtml = "";
        var ti = targetInfo(cat, m);
        var cstat = catStatus(cat, m);
        if (ti) {
          if (!ti.met && pillCls === "pos") pillCls = "warn";
          var barCls = cstat==="neg" ? "neg" : (ti.met ? "full" : "warn");
          var barW = cstat==="neg" ? 100 : ti.progress*100;
          targetHtml = '<div class="target-bar"><span class="'+barCls+'" style="width:'+barW+'%"></span></div>' +
            '<div class="target-note">' + ti.label + '</div>';
        } else if (cstat==="neg") {
          targetHtml = '<div class="target-bar"><span class="neg" style="width:100%"></span></div>' +
            '<div class="target-note">Excesso de '+fmt(Math.abs(avail))+' — atribua mais a esta categoria</div>';
        }
        var prio = cat.priority||"normal";
        var prioBtn = '<button class="prio-btn p-'+prio+'" data-action="cycle-prio" data-id="'+cat.id+'"'+
          ' title="Prioridade '+PRIO_LABEL[prio].toLowerCase()+' — clique para mudar"'+
          ' aria-label="Prioridade de '+esc(cat.name)+': '+PRIO_LABEL[prio]+'. Clique para mudar.">'+PRIO_ICON[prio]+'</button>';
        rows += '<tr class="cat-row" data-id="'+cat.id+'" draggable="true" data-drag="cat" data-drag-id="'+cat.id+'"><td>' +
          '<div class="cat-name-cell">' + prioBtn + '<span class="cat-name">'+esc(cat.name)+'</span>' +
          '<span class="cat-actions">' +
            '<button data-action="move-money" data-id="'+cat.id+'" title="Mover dinheiro">↔</button>' +
            '<button data-action="edit-category" data-id="'+cat.id+'" title="Editar / alvo">✎</button>' +
            (ti && ti.need>0 ? '<button data-action="fund-one" data-id="'+cat.id+'" title="Financiar alvo">🎯</button>' : '') +
            (avail < -0.005 ? '<button data-action="cover-overspend" data-id="'+cat.id+'" title="Cobrir excesso">⚠️</button>' : '') +
          '</span></div>' + (cat.note?'<div class="tag" style="margin-top:3px;">📝 '+esc(cat.note)+'</div>':'') + targetHtml +
          (upc[cat.id] ? '<div class="target-note">📅 Ainda por sair este mês: '+fmt(upc[cat.id])+
            (avail < upc[cat.id]-0.005 ? ' <b style="color:var(--warning)">— faltam '+fmt(round2(upc[cat.id]-avail))+'</b>' : '')+'</div>' : '') + '</td>' +
          '<td class="num"><input class="assign-input money" data-neg="1" maxlength="13" type="text" inputmode="decimal" data-assign="'+cat.id+'" value="'+amtStr(assigned)+'" placeholder="0,00"></td>' +
          '<td class="num activity-cell"><button class="btn ghost sm" data-action="cat-activity" data-id="'+cat.id+'" style="font-variant-numeric:tabular-nums;">'+fmt(activity)+'</button></td>' +
          '<td class="num"><span class="avail-pill '+pillCls+'">'+fmt(avail)+'</span></td></tr>';
      }
    }
    // Com dois grupos de filtros combinados é fácil chegar a zero resultados — dizê-lo.
    if (filtering && !nShown) rows =
      '<tr><td colspan="4" class="empty" style="padding:34px 20px;">'+
        '<div class="big" style="font-size:30px;">🔍</div>'+
        '<h3>Nada corresponde aos filtros</h3>'+

      '</td></tr>';

    // No telemóvel o rótulo esconde-se e fica só o símbolo, para os seis filtros

    function fBtn(cls, accao, id, ativo, icone, rotulo, dica){

    el("content").innerHTML =
      '<div class="toolbar">' +
