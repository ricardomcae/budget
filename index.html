uma <b>compra</b>, é a categoria que faz o orçamento guardar o dinheiro para pagar o cartão; numa <b>devolução</b>, é ela que devolve o dinheiro à categoria onde tinha gasto. "+"Abra a conta do cartão e escolha a categoria de cada um.</div>";openModal('<div class="modal-head"><h2>\uD83D\uDD0D Orçamento vs. contas — '+monthLabel(m)+'</h2><button class="x" data-action="close" aria-label="Fechar">×</button></div>'+'<div class="modal-body">'+'<p class="muted" style="margin-top:0;">Num orçamento base-zero, o dinheiro nas contas de orçamento tem de ser exatamente igual ao que está por atribuir mais o disponível de todas as categorias. Quando não bate, é porque houve movimentos que o orçamento não conseguiu acompanhar.</p>'+corpo+'</div><div class="modal-foot"><span></span><button class="btn primary" data-action="close">Fechar</button></div>')}function upcomingModal(){var m=state.ui.month,up=upcomingTotals(m),linhas=up.lista.length?up.lista.map(function(x){var r=x.r,acc=lkAcc(r.accountId),cat=r.categoryId===INCOME?"Rendimento":r.categoryId?esc((lkCat(r.categoryId)||{name:"(apagada)"}).name):"sem categoria",ld=ladoRecorrente(r),amt=ld.sai?'<span class="tx-amt out">'+fmt(-ld.sai)+"</span>":'<span class="tx-amt in">'+fmt(ld.entra)+"</span>";return'<div class="int-row"><span class="who"><b>'+esc(r.payee||"(sem beneficiário)")+'</b><span class="tag">'+fmtDate(x.date)+" · "+esc(acc?acc.name:"—")+" · "+cat+'</span></span><span class="amt">'+amt+'</span><button class="btn sm" data-action="post-recurring-now" data-id="'+r.id+'" title="Lançar já esta transação">▶ Lançar</button></div>'}).join(""):'<div class="muted" style="text-align:center;padding:18px 0;">Não falta lançar nada até ao fim do mês.</div>',resumo="";if(up.lista.length){var rta=readyToAssign(m);resumo='<div class="field" style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;"><div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Por sair</span><b class="tx-amt out" style="font-variant-numeric:tabular-nums;">'+fmt(up.sai)+'</b></div><div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Por entrar</span><b class="tx-amt in" style="font-variant-numeric:tabular-nums;">'+fmt(up.entra)+"</b></div>"+'<div style="display:flex;justify-content:space-between;padding:7px 0 0;margin-top:5px;border-top:1px solid var(--border);font-weight:700;"><span>Pronto a atribuir depois de tudo lançado</span>'+'<b style="font-variant-numeric:tabular-nums;">'+fmt(round2(rta+up.entraRTA))+"</b></div>"+'<div class="hint" style="margin-top:6px;">As saídas já lançadas descontam na categoria respetiva, não no «Pronto a atribuir». As entradas de «Rendimento» é que vão aumentá-lo.</div>'+"</div>"}openModal('<div class="modal-head"><h2>\uD83D\uDCC5 Ainda por lançar — '+monthLabel(m)+'</h2><button class="x" data-action="close" aria-label="Fechar">×</button></div>'+'<div class="modal-body">'+'<p class="muted" style="margin-top:0;">Regras recorrentes ativas que ainda vão ser lançadas automaticamente até ao fim do mês. Serve para saber o que já está comprometido antes de atribuir dinheiro.</p>'+resumo+'<div style="max-height:260px;overflow:auto;">'+linhas+'</div></div><div class="modal-foot"><span></span><button class="btn primary" data-action="close">Fechar</button></div>')}function fixTransferModal(id){var t=txById(id);if(!t){toast("Transação não encontrada.");return}var saida=(t.outflow||0)>0.005,outra=null,hs=state.transactions.filter(function(x){return x.transfer===t.transfer});for(var i=0;i<hs.length;i++)if(hs[i].id!==t.id)outra=hs[i];var oa=outra?lkAcc(outra.accountId):null;openModal('<div class="modal-head"><h2>Categorizar transferência</h2><button class="x" data-action="close" aria-label="Fechar">×</button></div>'+'<div class="modal-body"><p class="muted" style="margin-top:0;">'+(saida?"Saíram <b>"+fmt(t.outflow)+"</b> do orçamento para «"+esc(oa?oa.name:"outra conta")+"». Escolha de que categoria deve sair esse dinheiro.":"Entraram <b>"+fmt(t.inflow)+"</b> no orçamento vindos de «"+esc(oa?oa.name:"outra conta")+"». Escolha «Rendimento» para ficarem prontos a atribuir.")+'</p><div class="field"><label>Categoria</label><select id="ftCat">'+catOptionsHTML(saida?"":INCOME)+"</select>"+'<div class="hint">O movimento continua a ser uma transferência — a categoria serve só para o orçamento saber por onde o dinheiro passou.</div></div>'+'</div><div class="modal-foot"><span></span><span><button class="btn" data-action="close">Cancelar</button> <button class="btn primary" data-action="save-fix-transfer" data-id="'+t.id+'">Guardar</button></span></div>')}function helpModal(){var _aberta=!1;function sec(t,jaAberta){var fecho=_aberta?"</details>":"";return _aberta=!0,fecho+'<details class="ajuda-sec"'+(jaAberta?" open":"")+"><summary>"+t+"</summary>"}openModal('<div class="modal-head"><h2>❓ Como funciona?</h2><button class="x" data-action="close" aria-label="Fechar">×</button></div>'+'<div class="modal-body"><div class="help-list">'+sec("O essencial",!0)+'<ul style="margin:0;padding-inline-start:18px;">'+"<li><b>Dê uma função a cada euro.</b> O <b>Pronto a atribuir</b> é o dinheiro por distribuir — o objetivo é chegar a 0 €.</li>"+"<li>Os <b>rendimentos</b> entram como transações de <b>Entrada</b> com a categoria «Rendimento».</li>"+"<li>O que atribui fica em <b>Disponível</b> e transita de mês para mês.</li>"+"<li><b>Excesso</b> (a vermelho): gastou mais do que tinha atribuído. Atribua mais para o cobrir, ou use o <b>\uD83E\uDE79</b> na linha da categoria para ir buscar o dinheiro a outra.</li>"+"<li><b>O excesso transita com a categoria.</b> Se acabar o mês a vermelho, a categoria <b>começa o mês seguinte com esse valor negativo</b> — e continua vermelha até o cobrir. O dinheiro que atribuir em primeiro lugar tapa o buraco: só depois de chegar a zero é que fica disponível para gastar. Assim a dívida fica onde foi criada, à vista, em vez de desaparecer para uma conta geral.</li>"+"</ul>"+sec("Alvos")+'<ul style="margin:0;padding-inline-start:18px;">'+"<li>Definem-se no <b>✎</b> de cada categoria: mensal, semanal, trimestral, semestral, anual, ou até uma data.</li>"+"<li>No mensal, «<b>Repor até X</b>» acrescenta só o que falta para ter X disponível; «<b>Reservar X</b>» acrescenta sempre X, mesmo que já o tenha.</li>"+"<li>Trimestral, <b>semestral</b> e anual <b>param de pedir</b> quando já tiver o total. Indicando o mês da despesa, repartem o que falta até lá. O <b>mês da despesa</b> é quando o dinheiro <b>sai da conta</b>, não a data do acontecimento — se costuma comprar no mês anterior, ponha esse. Passado o mês, o alvo <b>roda sozinho</b> para o período seguinte.</li>"+"<li><b>Até uma data</b> é uma meta de <b>uma vez só</b>, não uma cadência: uma viagem, uma obra, um móvel. Passada a data, <b>deixa de pedir</b> e a linha passa a dizer <b>«prazo terminado»</b> — mesmo que já tenha gasto o dinheiro. O alvo <b>não se apaga sozinho</b>: fica lá, calado, e é quem o criou que decide se o remove, se arquiva a categoria, ou se estica a data para uma meta nova.</li>"+"<li><b>Despesa feita antes do prazo.</b> Num alvo <b>Repor</b> com prazo (até uma data, ou periódico com mês da despesa), gastar a meio quer normalmente dizer «reponha-me isto» — e o alvo repõe. Se esse gasto foi <b>a própria despesa</b>, feita mais cedo (a prenda comprada em outubro para fevereiro), carregue em <b>«✔ Dar por cumprida em <i>mês</i>»</b>, por baixo da categoria: até ao prazo, o alvo só pede o que deixar a categoria a zero. A ligação aparece quando houve gasto na categoria este mês ou no anterior, antes do mês do prazo. No próprio mês do prazo não é preciso — aí a aplicação já percebe sozinha. Há um <b>«anular»</b> ao lado. Num alvo <b>«até uma data»</b>, o que sobrar depois de dado por cumprido aparece no <b>\uD83E\uDDF9 Libertar excedente</b>; nos que se repetem, fica para o ciclo seguinte.</li>"+"<li><b>Nos alvos com prazo, o método decide quem manda.</b> Em <b>Repor</b>, a data é que manda: a mensalidade é refeita todos os meses com o que falta e o tempo que resta, por isso <b>falhar um mês ou gastar a meio faz subir os seguintes</b> — e chega lá. Em <b>Reservar</b>, manda a mensalidade: é congelada quando grava e nunca muda, por isso é previsível mas <b>pode chegar ao prazo curto, sem avisar</b>. Na dúvida, Repor.</li>"+"<li><b>\uD83D\uDE34 Adiar este mês:</b> num alvo que ainda pede dinheiro, o <b>\uD83D\uDE34</b> na linha da categoria diz para <b>não chatear só este mês</b> — deixa de aparecer a amarelo e sai do «Financiar alvos». No mês seguinte volta ao normal, ou reative antes com o <b>☀️</b>. Para ver de uma vez tudo o que adiou, use o filtro <b>\uD83D\uDE34 Adiadas</b> na barra do orçamento — adiadas não são nem «abaixo do alvo» nem «cumpridas», por isso não aparecem nesses.</li>"+"</ul>"+sec("Distribuir o dinheiro")+'<ul style="margin:0;padding-inline-start:18px;">'+"<li><b>\uD83C\uDFAF Financiar alvos</b> — <i>Pronto a atribuir → categorias.</i> Está sempre disponível. Dá a cada categoria o que lhe falta para cumprir o alvo do mês. Pode <b>financiar tudo</b>, ou <b>repartir só o que está por atribuir</b> — esta nunca o deixa negativo, e reparte de três maneiras: <b>por prioridade</b> (serve as Altas primeiro), <b>proporcional</b> (todas ficam igualmente perto do alvo — quem precisa de mais leva mais) ou <b>escolhendo à mão</b> as categorias e grupos. Nas duas primeiras pode pôr um teto em <b>«Até quanto distribuir»</b> — com 1.000 € por atribuir, repartir só 800 € e deixar 200 € livres.</li>"+"<li><b>↩ Repor a zero</b> — <i>categorias → Pronto a atribuir.</i> Aparece quando atribuiu mais do que tinha e o «Pronto a atribuir» ficou <b>negativo</b>. Retira às categorias com dinheiro parado até voltar a zero, de duas maneiras: <b>por prioridade</b> — tira primeiro das <b>Baixas</b>, para proteger as Altas (entre iguais, das que estão mais abaixo na lista) — ou <b>proporcional</b>. Nenhuma categoria fica negativa.</li>"+"<li><b>\uD83E\uDDF9 Libertar excedente</b> — <i>categorias → Pronto a atribuir.</i> Aparece quando alguma categoria tem <b>mais do que o alvo dela pede</b> — por exemplo «repor até 200 €» com 500 € lá dentro. No <b>cartão de crédito</b>, o teto é o que falta liquidar: se atribuiu 500 € e só deve 200 €, liberta os 300 € de folga. Estar <b>adiantado</b> num objetivo com data não conta como excedente: se quer 3.000 € e já juntou 2.000 €, o dinheiro é seu e fica onde está — esticar o prazo apenas <b>baixa a mensalidade</b>. As de «reservar todos os meses» nunca entram, porque aí o dinheiro é mesmo para acumular.</li>"+"<li><b>\uD83E\uDE79 Cobrir</b> — <i>outras categorias → uma categoria.</i> Aparece na linha de uma categoria que ficou <b>negativa</b>, por ter gasto nela mais do que lá tinha. O objetivo é <b>trazê-la a zero</b>. Mostra o que falta e quem tem dinheiro parado, cada um com um cursor. Escolha de onde tirar: <b>primeiro das prioridades mais baixas</b> (sai de onde é menos importante), <b>primeiro de quem tem mais folga</b> (mexe em menos categorias), <b>primeiro de quem precisa do dinheiro mais tarde</b> (dá mais tempo para repor — tira antes das férias do próximo verão do que do seguro que vence para o mês), ou <b>manual</b>. O que ainda não está atribuído é sempre gasto primeiro. Ao cartão de crédito só se tira a folga, nunca o que é preciso para o liquidar.</li>"+"<li><b>\uD83C\uDFAF na linha de uma categoria</b> — <i>Pronto a atribuir → essa categoria.</i> Faz num toque o que a janela acima faz para todas: junta-lhe de uma vez o que falta para o <b>alvo do mês</b>. Se o «Pronto a atribuir» não chegar, <b>avisa antes</b> de o deixar negativo.</li>"+"<li><b>\uD83E\uDE79 e \uD83C\uDFAF são coisas diferentes</b> — e podem aparecer os dois na mesma categoria. O <b>\uD83E\uDE79 traz a zero</b> (tapa o que gastou a mais) e vai buscar o dinheiro a <b>outras categorias</b>; o <b>\uD83C\uDFAF leva ao alvo</b> (o que planeou ter) e vai buscá-lo ao <b>Pronto a atribuir</b>. Por isso o \uD83E\uDE79 fica à esquerda: primeiro tapa-se o buraco, depois volta-se ao plano.</li>"+"<li><b>\uD83E\uDDFD Limpar atribuições</b> — <i>categorias → Pronto a atribuir.</i> Devolve <b>tudo</b> o que atribuiu neste mês, para recomeçar do zero. Só mexe no mês que está a ver: o que transitou de meses anteriores fica onde está, e as transações não são tocadas. Se já gastou numa categoria mais do que o que transitou, ela fica negativa — a janela avisa quantas, antes de confirmar.</li>"+"<li>As cinco <b>mostram o que ia acontecer antes de mexer em alguma coisa</b>, nenhuma tira dinheiro das contas — só muda a função que ele tem — e todas se desfazem com o <b>↩ Anular</b> que fica no topo.</li>"+"<li><b>Prioridade</b> ▲ ● ▼ à frente de cada categoria, muda com um clique. É ela que comanda o «por prioridade» das operações acima; entre iguais, manda a <b>ordem da lista</b>.</li>"+"<li><b>↔ Mover</b> passa dinheiro <b>do orçamento</b> entre categorias (ou de/para o «Pronto a atribuir»), sem tocar no rendimento — é diferente do <b>↔ Transferir</b> das contas, que move dinheiro <b>real</b> de uma conta para outra.</li>"+"</ul>"+sec("No ecrã e no teclado")+'<ul style="margin:0;padding-inline-start:18px;">'+"<li><b>O pontinho ao lado de cada conta:</b> <b>verde</b> quer dizer que não há nada por confirmar — a conta está a par do banco. <b>Âmbar</b> quer dizer que há lançamentos que o banco ainda não processou; é o estado normal de quem regista as despesas no próprio dia, não um aviso. No computador, o rato por cima diz quantas são e quanto valem.</li>"+"<li><b>Na lista de contas</b>, à esquerda, o número é o <b>Confirmado</b> — o que o banco já processou. É esse que se compara com a aplicação do banco. A <b>bolinha</b> ao lado diz se bate certo com o <b>Saldo</b>: verde quando são iguais, âmbar quando há coisas por confirmar. O Saldo completo vê-se ao abrir a conta.</li>"+"<li><b>O ✓ e o «Por confirmar»:</b> o ✓ marca que o banco já processou a transação. Mexe no <b>Confirmado</b>, não no <b>Saldo</b> — um café pago ontem está pago, tenha o banco lançado ou não, e o orçamento tem de contar com isso. A diferença entre os dois é o <b>Por confirmar</b>, que aparece no cabeçalho da conta e no ecrã das transações: quando chega a zero, a app bate certo com o extrato.</li>"+"<li><b>Total do mês:</b> por cima das colunas, a soma do <b>Atribuído</b>, da <b>Atividade</b> e do <b>Disponível</b>. As categorias de <b>pagamento de cartão</b> ficam de fora das três: a atividade delas é o espelho positivo do que se gastou — 50 € de mercearia no cartão dão −50 na Mercearia e +50 no cartão — e somá-las daria zero, como se não se tivesse gasto nada. Os valores do cartão continuam na linha do grupo dele.</li>"+"<li><b>Vários orçamentos</b> (na barra lateral, ou no botão com o nome do orçamento no cabeçalho, no telemóvel): pode ter um <b>Pessoal</b> e um <b>Família</b>, por exemplo. Cada um é <b>completamente separado</b> — contas, categorias e transações próprias — e troca-se com um toque. Se sincroniza, vão <b>todos no mesmo gist</b>; só há uma coisa a saber: se editar orçamentos <b>diferentes</b> em aparelhos diferentes antes de sincronizar, a aplicação pergunta qual manter, como faria com qualquer conflito.</li>"+"<li><b>A barra de filtros do Orçamento encolhe com a janela.</b> À medida que o espaço aperta, os nomes dos botões vão desaparecendo pela ordem em que fazem menos falta — fica o símbolo, e o rato por cima diz sempre o que é. Se estreitar mesmo muito, a aplicação passa à vista de telemóvel, com o menu em baixo. É de propósito: assim a barra nunca se parte em duas linhas.</li>"+"<li><b>Todos os ecrãs têm o mesmo desenho: uma faixa em cima que não se mexe, e um cartão que desliza.</b> Na faixa ficam os <b>botões</b>, os <b>filtros</b>, o <b>resumo</b> do que se está a ver e o <b>cabeçalho</b> da lista — Data, Beneficiário, Categoria… nas Transações; <b>Categoria · Atribuído · Atividade · Disponível</b> no Orçamento, onde fica também o <b>Pronto a atribuir</b>. Daí para baixo é que se desliza.</li>"+"<li><b>O que corre é o conteúdo do cartão, e não a página.</b> O contorno arredondado fica parado; as linhas é que passam lá dentro. No telemóvel isso quer dizer que o cartão se puxa também <b>para o lado</b>, onde a tabela é mais larga do que o ecrã — é assim que se chega ao <b>✓</b>, ao <b>⧉</b> e ao <b>\uD83D\uDDD1</b> de cada linha.</li>"+"<li><b>Os valores mostram-se sempre por extenso</b> — <b>8,50</b> e não <b>8,5</b>, <b>1.234,50</b> e não <b>1234,5</b> — em todos os campos, alinhados à direita. Ao escrever pode usar o formato que lhe der jeito: <b>8,5</b>, <b>8.50</b> ou <b>1234,50</b>.</li>"+"<li><b>Contas nos campos de dinheiro:</b> em qualquer campo de valor pode escrever a conta em vez do total — <b>23,45+11,90+7,15</b>. O resultado aparece por baixo enquanto escreve e substitui a conta assim que sai do campo. No <b>telemóvel</b> aparece um <b>teclado próprio</b> com <b>+</b> e <b>−</b>, sem letras nem risco de enganos. No <b>computador</b> escreve-se no próprio campo, também no <b>Atribuído</b> do orçamento: <b>Enter</b> aplica, <b>Esc</b> desiste e <b>Tab</b> aplica e passa à categoria seguinte. Num par <b>Saída/Entrada</b>, um <b>−</b> escrito no princípio do campo continua a passar o valor para o outro lado; depois de números, é uma subtração.</li>"+"<li><b>Datas e teclado:</b> as datas escrevem-se sempre em <b>dd/mm/aaaa</b>, mesmo que tenha o browser noutro idioma — pode escrever só os números, que as barras aparecem sozinhas, ou usar o \uD83D\uDCC5 para as escolher no calendário. Dentro de qualquer janela, o <b>Enter</b> vale por carregar no botão principal.</li>"+"<li><b>Cor da aplicação:</b> oito à escolha, em <b>Dados e cópias → Definições</b> — basta tocar numa bolinha. Vão do petróleo ao rosa pelo lado do roxo, mais um cinzento e um castanho, e nenhuma é verde nem laranja de propósito: uma cor de marca nessas zonas confunde-se, a um relance, com as barras que dizem se há dinheiro. No computador, o círculo no canto superior direito percorre-as uma a uma. A cor <b>é de cada orçamento</b>, e não do aparelho: fica guardada com ele e vai na sincronização, como as outras definições. Dê uma cor a cada um — verde-azulado ao <b>Pessoal</b>, framboesa ao <b>Família</b>, por exemplo — e passa a saber num relance qual está aberto, no telemóvel e no computador, sem ler o nome. Os verdes e vermelhos dos valores nunca mudam — são eles que dizem se há ou não dinheiro.</li>"+"<li><b>Esc</b> dentro de um campo desfaz o que estava a escrever e larga o campo, sem gravar. Dentro de uma janela, é preciso carregar duas vezes: a primeira sai do campo, a segunda fecha a janela. Na <b>caixa de procura</b> das Transações o Esc <b>apaga</b> o texto (e o cursor fica lá) — o mesmo que o <b>✕</b> dentro da caixa.</li>"+"</ul>"+sec("Relatórios")+"<ul>"+"<li><b>O período escolhe-se em cima</b> e vale para o ecrã todo: <b>1, 3, 6, 12 ou 24 meses</b> a contar do mês em vista, ou um intervalo à medida (<b>de</b> / <b>até</b>, só no computador).</li>"+"<li><b>Os quatro números de topo</b> — Rendimento, Despesa, Resultado e Património no fim — são do período escolhido, mas não têm todos o mesmo alcance. O <b>Rendimento</b>, a <b>Despesa</b> e o <b>Resultado</b> são do <b>orçamento</b>: o que se passa nas contas de <b>acompanhamento</b> não entra, porque essas contas estão fora dele — uma comissão da corretora não é uma despesa sua, é o seu património a mudar. O <b>Património no fim</b> é o contrário: tudo o que tem menos tudo o que deve, contas de acompanhamento incluídas.</li>"+"<li><b>Contas nos campos de dinheiro:</b> pode escrever <b>12,50+3,20</b> ou <b>100-25,75</b> em qualquer campo de valor, e o resultado aparece por baixo enquanto escreve. Só <b>somar e subtrair</b> — não há multiplicação nem divisão. Se escrever algo que a aplicação não perceba, o campo fica por preencher em vez de guardar um valor a adivinhar.</li>"+"<li><b>Saída e Entrada são dois lados</b>, não dois números soltos: se uma conta der negativo, o valor muda de campo e fica positivo. Escrever <b>«4−6»</b> na Entrada guarda uma <b>Saída de 2</b> — é o mesmo dinheiro, dito do lado certo.</li>"+"<li><b>Um reembolso abate à despesa</b>, em vez de contar como rendimento. Devolveu metade de uma compra? A categoria mostra só o que ficou por gastar. Rendimento é apenas o que entra pela categoria «Rendimento»; transferências entre contas suas não são nem uma coisa nem outra.</li>"+"<li><b>A despesa por categoria</b> conta só o que <b>saiu a mais do que entrou</b>: uma categoria onde devolveu mais do que gastou, ou uma entrada sem categoria, não aparecem — não são despesa. Mostra as <b>15 maiores</b> do período; as restantes somam-se numa linha <b>«Outras N categorias»</b>, sempre no fim — mesmo quando a soma delas dá uma barra maior do que alguma acima, porque é um total e não uma categoria. No computador, o rato por cima dela diz quais são e quanto vale cada uma.</li>"+"<li><b>A evolução por categoria</b>, no fim, põe lado a lado as categorias que escolher, ao longo dos meses: escolhem-se nas <b>bolinhas</b> por baixo do gráfico, que aparecem pela mesma ordem do ecrã <b>Orçamento</b>, e a cor de cada uma acompanha-a. Se nunca escolheu nenhuma, a aplicação propõe as de maior despesa.</li>"+"<li><b>Gasto ou Atribuído:</b> o mesmo gráfico lê-se de duas maneiras — o que <b>saiu de facto</b> em cada mês, ou o que <b>pôs lá</b> em cada mês. Ver os dois é a maneira mais rápida de perceber se um alvo está bem calibrado.</li>"+"<li><b>As categorias escolhidas acompanham o orçamento</b> e chegam aos outros aparelhos — tal como o <b>período</b> e o modo <b>Gasto/Atribuído</b>. O mês em vista é que fica em cada aparelho.</li>"+"</ul>"+sec("Organizar")+'<ul style="margin:0;padding-inline-start:18px;">'+"<li><b>Filtros</b> no topo do orçamento, para mostrar só as categorias que interessam. Pelo <b>alvo</b>, do mais folgado ao mais apertado: <b>\uD83D\uDD35 com excedente</b> (têm <b>mais</b> do que o alvo pede — as candidatas a «\uD83E\uDDF9 Libertar excedente»), <b>\uD83D\uDFE2 alvo cumprido</b>, <b>\uD83D\uDFE1 abaixo do alvo</b> e <b>\uD83D\uDD34 excedido</b>. Há ainda <b>\uD83D\uDCB0 com saldo</b> (têm dinheiro disponível) e a <b>prioridade</b> (▲ ● ▼).</li>"+"<li>Dentro do mesmo grupo os filtros somam-se («<b>ou</b>»: \uD83D\uDFE1 <i>ou</i> \uD83D\uDD34); entre grupos cruzam-se («<b>e</b>»: \uD83D\uDFE1 abaixo do alvo <b>e</b> ▲ alta). O \uD83D\uDD35 é um refinamento do \uD83D\uDFE2 — uma categoria cumprida pode ter excedente por cima. O botão <b>Limpar</b> tira todos de uma vez (no telemóvel não aparece, para a barra caber numa linha: desligue cada filtro tocando-lhe outra vez).</li>"+"<li><b>Reordenar</b> categorias, grupos e <b>contas</b>: arraste no computador; no telemóvel use <b>▲▼</b> dentro do ✎. As contas reordenam-se dentro do mesmo tipo (orçamento com orçamento, cartões entre si) e a ordem vale na barra lateral e no ecrã Contas.</li>"+"<li><b>\uD83D\uDDC4 Arquivar</b> esconde uma conta ou categoria sem perder o histórico. Se a categoria ainda tiver dinheiro, a aplicação pergunta se o quer devolver ao <b>Pronto a atribuir</b> — assim não fica preso numa categoria que deixou de ver.</li>"+"</ul>"+sec("Contas e cartões")+'<ul style="margin:0;padding-inline-start:18px;">'+"<li>Contas de <b>orçamento</b> (à ordem, poupança) entram no orçamento. De <b>acompanhamento</b> (investimentos, empréstimos) não.</li>"+"<li><b>Abrir uma conta</b> (na barra lateral ou no ecrã Contas) leva às <b>Transações</b> dessa conta, com o nome e os saldos por cima. Como é a lista normal, pode juntar-lhe um período, uma categoria ou uma procura. A coluna <b>Saldo</b> — o acumulado linha a linha — só aparece enquanto estiver a ver <b>só</b> aquela conta: com outro filtro ligado faltariam movimentos pelo meio e o saldo mentiria. Para sair, use o <b>‹ Contas</b> ou escolha «Todas as contas».</li>"+"<li><b>A categoria é obrigatória</b> em tudo o que entra ou sai de uma conta de orçamento ou de um cartão — é ela que liga o movimento ao orçamento. Não a levam: as contas de <b>acompanhamento</b> (estão fora do orçamento), o <b>saldo inicial</b> e as <b>transferências</b> entre contas suas (que só pedem categoria quando o dinheiro sai do orçamento ou entra nele). Ao <b>importar do banco</b> não se pede, por serem muitas de uma vez — a aplicação diz quantas ficaram por classificar.</li>"+"<li><b>Cartão de crédito:</b> ao gastar, a aplicação retira o valor à categoria da compra e guarda-o na categoria do cartão, para o ter quando pagar. O <b>\uD83D\uDCB3 Pagar</b> usa esse dinheiro. Por isso a <b>categoria é obrigatória</b> nos movimentos do cartão — também nas <b>devoluções e cashbacks</b>, onde deve indicar a categoria em que tinha feito a despesa, para o dinheiro voltar para lá. (O saldo inicial e o pagamento do cartão são à parte e não levam categoria.)</li>"+"<li><b>↔ Transferir</b> move entre contas — está no ecrã <b>Contas</b>, dentro de uma conta aberta e na janela de nova transação. Se o dinheiro sair do orçamento para uma conta de acompanhamento, leva categoria.</li>"+"</ul>"+sec("Transações")+"<ul>"+"<li><b>➗ Dividir</b> reparte uma compra por várias categorias.</li>"+"<li><b>\uD83D\uDCC5 Recorrentes</b> lançam-se sozinhas na data — diária, semanal, quinzenal, mensal, semestral ou anual. Podem ser uma <b>despesa/receita</b> ou uma <b>↔ transferência</b> entre contas, útil para pôr dinheiro de lado na poupança todos os meses.</li>"+"<li>Clique numa transação para a editar. Transferências e divididas tratam-se <b>por inteiro</b>, nunca metade: editar muda os dois lados, apagar leva os dois, e o <b>⧉</b> duplica o conjunto todo — a cópia fica independente da original.</li>"+"<li><b>No telemóvel, o cabeçalho</b> tem, por esta ordem: o <b>nome do orçamento</b> (toque para trocar ou gerir), <b>➕</b> nova transação, <b>\uD83C\uDFF7️</b> beneficiários, <b>\uD83D\uDCBE</b> dados e cópias, <b>↩ ↪</b> anular e refazer, <b>\uD83D\uDD51</b> movimentos recentes e <b>❓</b> esta ajuda. O título do ecrã não aparece — é a barra de baixo, com o separador aceso, que diz onde está.</li>"+"<li><b>Datas por chegar:</b> uma transação com data futura já conta no <b>Saldo</b> — é dinheiro que sabe que vai sair — mas ainda não aconteceu. Na lista a data fica <b>esbatida com um ◷</b>, com filtros ou sem eles.</li>"+"<li><b>\uD83D\uDD51 Movimentos recentes</b> (ao lado do ↩ ↪, no topo) — o registo de como tem repartido o dinheiro <b>pelas categorias</b>: mover entre categorias, \uD83E\uDE79 cobrir, \uD83C\uDFAF financiar, \uD83E\uDDF9 libertar excedente, atribuir à mão, adiar, e também o que anulou. Cada linha diz <b>o que fez</b> e, por baixo, <b>de onde veio o dinheiro</b> — «Cobriu «Roupa»» e, em pequeno, «de Férias 50,00 €». Quando as origens são muitas, mostra as duas maiores e conta as restantes. Guarda os <b>últimos 40</b> e acompanha o orçamento: sobrevive a fechar a aplicação e <b>vai na sincronização</b> — incluindo quando o <b>limpa</b>, que o deixa vazio em todos os aparelhos. As <b>transações não entram</b> — essas têm a sua própria lista —, com uma excepção: quando <b>⧉ duplica</b> uma transação e lhe <b>muda o valor</b>, fica «⧉ Duplicou «…» com outro valor (era …)». Duplicar sem mudar o valor não ocupa linha. É só para ler: para andar para trás use o <b>↩</b>.</li>"+"<li><b>Somar à pressa:</b> as caixas à esquerda da data selecionam transações e mostram o total em baixo. A caixa no <b>cabeçalho</b> marca todas as que estão à vista. É só uma conta rápida — não altera nada, e a seleção desaparece ao mudar de página.</li>"+"<li><b>Separadores de mês</b> nas listas de transações e de recorrentes: «Agosto 2026», «Julho 2026»… Só aparecem quando a lista atravessa mais do que um mês — num filtro de «este mês» não separariam nada.</li>"+"<li><b>Uma coluna «Valor»</b> nas listas de transações e de recorrentes: as saídas aparecem a <b>vermelho com −</b> e as entradas a <b>verde com +</b>. Ao registar ou editar continua a haver dois campos, <b>Saída</b> e <b>Entrada</b>, que é o que evita enganos ao escrever.</li>"+"<li><b>Campos de valor:</b> algarismos e um separador decimal. Em <b>Saída/Entrada</b>, o «-» troca de lado.</li>"+"<li><b>Notas nas transações:</b> têm coluna própria em qualquer ecrã — no telemóvel, estreita e cortada com «…», o suficiente para saber do que se trata. A nota completa vê-se ao passar o rato por cima ou abrindo a transação.</li>"+"<li><b>Procurar:</b> o campo no topo das Transações procura <b>apenas</b> no <b>beneficiário</b> e na <b>nota</b> — não procura em categorias, valores nem datas, que têm filtros próprios ao lado. Basta parte da palavra, e maiúsculas ou minúsculas é igual. Cruza-se com os filtros de conta, categoria e período («Confeitaria» + <i>este ano</i> + conta X).</li>"+"<li><b>\uD83C\uDFF7️ Beneficiários:</b> mudar um nome altera todas as transações; dar-lhe um nome que já existe <b>junta</b> os dois. O <b>\uD83D\uDCCA Ver</b> mostra tudo o que gastou nesse beneficiário — total, número de vezes, média e em que categorias entrou. Como é a lista de transações normal, pode juntar-lhe um <b>período</b> para ver só um ano, e editar as transações a partir dali. No computador, o <b>⬇ Exportar</b> ao lado da contagem guarda a lista toda num <b>.csv</b>, com a ordem e o filtro que tiver.</li>"+"</ul>"+sec("Trazer e levar")+"<ul>"+"<li><b>Trazer e levar</b>, em <b>Dados e cópias</b>, tem duas gavetas simétricas: <b>⬇ Importar</b> e <b>⬆ Exportar</b>, cada uma com as mesmas coisas pela mesma ordem — primeiro a <b>configuração dos alvos</b> (a «planta»), depois as <b>transações</b>. O que sai de um lado é o que entra do outro.</li>"+"<li><b>Importar transações</b> do banco: as linhas que já existem são detetadas e saltadas.</li>"+"<li><b>Importar a configuração dos alvos</b> (em <b>Dados e cópias → Trazer e levar</b>) lê o mesmo ficheiro que sai em <b>Exportar → Configuração dos alvos</b> e reconstrói grupos, categorias, alvos, prioridades e notas — de outro orçamento seu, ou do mesmo noutra altura. <b>Não apaga nada:</b> as categorias que já tem <b>mantêm as transações e o dinheiro</b> e só lhes muda o alvo; as que faltam são criadas; as suas que não venham no ficheiro ficam como estão. Uma categoria é reconhecida pelo <b>grupo mais o nome</b>, por isso «Luz» em «Casa» e «Luz» em «Escritório» são duas coisas diferentes, como sempre foram. Mostra tudo o que vai fazer <b>antes</b> de mexer, e o <b>↩ Anular</b> desfaz a importação inteira num passo.</li>"+"<li><b>Exportar para folha de cálculo</b> (no computador): o <b>⬇ Exportar o que vejo</b>, nas Transações, guarda exatamente as linhas que estão à vista — com os filtros e a conta que tiver ligados. O <b>⬇ Exportar</b> dos <b>\uD83C\uDFF7 Beneficiários</b> faz o mesmo com a lista de nomes: um por linha, com as transações, o total, a média, a primeira e a última vez e as categorias em que entrou — pela ordem que escolheu e só os que o filtro deixa ver. Para o orçamento inteiro, sem filtros, é em <b>Dados e cópias</b>. Nenhum deles sai do orçamento aberto, e um <b>.csv não é cópia de segurança</b> — não repõe nada. Os ficheiros saem no formato normal (<b>RFC 4180</b>): aguentam nomes com aspas, ponto-e-vírgula ou mudanças de linha, e o que sai volta a entrar igual.</li>"+"</ul>"+sec("Se algo não bater certo")+'<ul style="margin:0;padding-inline-start:18px;">'+"<li>Um <b>⚠️</b> por baixo do «Pronto a atribuir» quer dizer que o dinheiro nas contas não bate com o orçamento. Carregue em <b>Ver porquê</b> — mostra os movimentos em causa e corrige-os.</li>"+"<li>Um <b>ℹ️</b> no mesmo sítio avisa que há movimentos do <b>cartão de crédito sem categoria</b> — de antes de a categoria passar a ser obrigatória, ou vindos de uma importação. Não desequilibram as contas, mas ficam de fora do orçamento; <b>Ver quais</b> leva-o até eles.</li>"+"<li><b>↩ Anular</b> e <b>↪ Refazer</b>, no topo, repõem as últimas <b>5</b> alterações: operações em bloco, um valor mudado à mão, transações e transferências, confirmar/desconfirmar, prioridades, arquivar, reordenar e regras recorrentes. <b>Navegar não conta</b> — mudar de mês, de ecrã ou de filtro não gasta nem apaga estes passos. O histórico é de cada orçamento e começa vazio de cada vez que abre a aplicação; para guardar mais do que isso, são as cópias em <b>Dados e cópias</b>.</li>"+"</ul>"+sec("Os seus dados")+'<ul style="margin:0;padding-inline-start:18px;">'+"<li><b>Onde vivem os seus dados.</b> Não há servidor nenhum: o orçamento está dentro do navegador deste aparelho. Em <b>Dados e cópias</b> há três lugares possíveis — <b>1 no navegador</b>: o histórico dos 5 últimos dias, mais os 3 últimos pontos \uD83D\uDEDF guardados antes de cada ação que não se pode anular, para corrigir enganos (desaparecem com o aparelho); <b>2 em ficheiro</b>: a única cópia que sobrevive a perdê-lo; <b>3 na nuvem</b>: uma cópia cifrada que mantém os seus aparelhos iguais.</li>"+"<li><b>Folha de cálculo não é cópia de segurança.</b> Os <b>.csv</b> de <b>Trazer e levar</b> servem para abrir no Excel ou no Sheets e olhar para os dados de outra maneira — exportam <b>só o orçamento aberto</b> e <b>não repõem</b> nada. Quem repõe é sempre o <b>.json</b> do <b>2</b>.</li>"+"<li><b>Os dois ficheiros .json não são a mesma coisa.</b> O <b>⬇</b> de um ponto do histórico (<code>historico-…</code>) traz <b>um</b> orçamento tal como estava <b>nesse dia</b>. O botão <b>Guardar cópia de segurança</b> (<code>orcamentos-…</code>) traz <b>todos</b> os orçamentos no estado <b>atual</b>. Ambos se voltam a abrir pelo mesmo sítio — <b>Importar cópia</b> —, e o do histórico substitui só o orçamento a que pertence.</li>"+"<li><b>O navegador pode apagar-lhe os dados.</b> Para não servirem de rasto, os navegadores — o do iPhone em particular — limpam sozinhos o que guardam de um site que passe uns dias sem ser usado. A aplicação <b>pede</b> para ser poupada, e o pedido costuma ser aceite em quem a tem instalada no ecrã principal. No fim de <b>Dados e cópias</b> vê se está <b>\uD83D\uDD12 Protegido</b> — e, se estiver, é mais uma razão para ter também a cópia em ficheiro: essa não depende de navegador nenhum.</li>"+"<li><b>O que viaja na sincronização e o que fica no aparelho.</b> Viaja o <b>orçamento</b> — contas, categorias, alvos, transações, recorrentes, beneficiários, prioridades, as <b>categorias escolhidas nos Relatórios</b>, a <b>cor</b> (que é de cada orçamento) e a <b>vista</b>: grupos fechados, período e modo dos Relatórios, ordem dos beneficiários e os modos do \uD83C\uDFAF Financiar, ↩ Repor e \uD83E\uDE79 Cobrir. Não viajam o <b>ecrã</b>, o <b>mês</b> e os <b>filtros</b> — esses voltam ao início sempre que se abre a aplicação, em qualquer aparelho. É de propósito — senão abrir a aplicação no telemóvel atirava-o para onde estava no computador.</li>"+"<li>Nesse mesmo sítio vê <b>quantas transações</b> tem e <b>quanto espaço está a ocupar</b>. O espaço são dois números: o do orçamento em si, que tem um limite apertado (~5 MB), e o do histórico, que vive numa zona à parte com espaço de sobra. A partir de umas <b>6000 transações</b> aparece um aviso: a aplicação começa a ficar mais lenta a cada toque, e vale a pena <b>recomeçar</b> — guardar uma cópia em ficheiro (que fica com o histórico todo), exportar a <b>configuração dos alvos</b>, criar um orçamento novo com as contas no saldo de hoje e importar lá essa configuração. Fica com as mesmas categorias, alvos e prioridades, e sem o peso do que já passou. Para um uso normal, isso são vários anos.</li>"+"<li>A <b>cópia em ficheiro guarda todos os orçamentos</b> de uma vez — por isso o aviso de «alterações por guardar» também é de todos, mesmo os que não tem abertos.</li>"+'</ul></details></div></div><div class="modal-foot"><span></span><button class="btn primary" data-action="close">Entendido</button></div>'),numeraSeccoes()}function numeraSeccoes(){try{var ds=el("modal").querySelectorAll("details.ajuda-sec");for(var i=0;i<ds.length;i++){var n=ds[i].querySelectorAll("li").length,sm=ds[i].querySelector("summary");if(sm&&n)sm.insertAdjacentHTML("beforeend",'<span class="n">'+n+"</span>")}}catch(e){}}function changelogModal(){var _primeira=!0;function ver(v,data,itens){var abre=_primeira;return _primeira=!1,'<details class="ajuda-sec"'+(abre?" open":"")+"><summary>Versão "+v+' <span class="muted" style="font-weight:400;">· '+data+"</span></summary><ul>"+itens.map(function(i){return"<li>"+i+"</li>"}).join("")+"</ul></details>"}openModal('<div class="modal-head"><h2>\uD83D\uDCCB Novidades</h2><button class="x" data-action="close" aria-label="Fechar">×</button></div>'+'<div class="modal-body"><div class="help-list">'+'<p class="muted" style="margin-top:0;">O que mudou ao longo do tempo, da versão mais recente para a mais antiga.</p>'+ver("1.92","novembro 2026",["Metas <b>«até uma data»</b> com o <b>prazo terminado</b> e dinheiro parado: aparecem no <b>\uD83E\uDDF9 Libertar excedente</b>, numa secção à parte, <b>desmarcadas</b> — só sai o que marcar, e não entram no total do botão. A linha da categoria passa a dizer quanto sobra e o que fazer («se é para manter, mude o alvo para Mensal»)."])+ver("1.91","novembro 2026",["Num alvo <b>«até uma data»</b> dado por <b>cumprido</b>, o que sobra na categoria passa a aparecer no <b>\uD83E\uDDF9 Libertar excedente</b> — a meta era de uma vez só, e esse dinheiro já não tem função. Nos alvos que se repetem (anual, semestral, trimestral) não: o que sobra conta para o ciclo seguinte."])+ver("1.90","novembro 2026",["O «já paguei» passou a <b>«✔ Dar por cumprida em <i>mês</i>»</b>, com o mês do último gasto na categoria — para se ver a que gasto se refere. Depois de marcada, a categoria diz <b>«✅ Cumprida em <i>mês</i>»</b>, com o mês em que gastou (e não o mês em que carregou no botão)."])+ver("1.89","novembro 2026",["Alvos <b>«Repor» com prazo</b> (até uma data; trimestral, semestral ou anual com mês da despesa): se <b>pagar a despesa antes do prazo</b>, aparece <b>«já paguei»</b> (desde a 1.90, <b>«✔ Dar por cumprida»</b>) por baixo da categoria. Marcando-o, o alvo deixa de pedir o total outra vez — até ao prazo, só pede o que deixar a categoria a zero. Há um <b>«anular»</b> ao lado, e o ↩ também desfaz.","Numa categoria com alvo que ficou negativa, o texto já não diz «faltam 1.250,00 € de 1.200,00 €»: diz quanto é do objetivo e quanto é do que se gastou a mais.","Sincronização: se um aparelho tiver uma <b>palavra-passe diferente</b>, a aplicação diz isso mesmo e não envia nada. Antes podia aparecer como um conflito, e escolher «Manter este aparelho» deixava o outro aparelho sem conseguir abrir a cópia."])+ver("1.88","novembro 2026",["<b>«Pela ordem da lista»</b> saiu também do <b>↩ Repor a zero</b>, como já tinha saído do Financiar. Quem a tinha escolhida passa a <b>«Por prioridade»</b> — que, entre categorias da mesma prioridade, continua a tirar primeiro das que estão mais abaixo."])+ver("1.87","novembro 2026",["<b>\uD83C\uDFAF Financiar alvos → Repartir</b>: novo campo <b>«Até quanto distribuir»</b>. Com 1.000 € por atribuir, pode repartir só 800 € por prioridades (ou proporcionalmente) — os outros 200 € ficam por atribuir. Vazio, reparte tudo, como sempre.","Saiu a forma de repartir <b>«Pela ordem da lista»</b>. Quem a tinha escolhida passa a <b>«Por prioridade»</b>."])+ver("1.86","novembro 2026",["No <b>computador</b>, o <b>Atribuído</b> escreve-se no próprio campo, sem o teclado de ecrã — como a Saída/Entrada das transações. Aceita contas (<b>120+35</b>, com «= 155,00» por baixo); <b>Enter</b> aplica, <b>Esc</b> desiste, <b>Tab</b> aplica e passa à categoria seguinte. No telemóvel fica igual.","<b>\uD83C\uDFAF Financiar alvos → Repartir → «Escolher à mão»</b>: marque categoria a categoria, ou grupos inteiros, e veja em tempo real quanto vai atribuir e quanto fica por atribuir. Cada categoria marcada recebe o que o seu alvo pede."])+ver("1.85","novembro 2026",["Alvos <b>«Repor» com prazo</b> (até uma data; trimestral, semestral ou anual com mês da despesa): <b>pagar a despesa no próprio mês</b> já não faz o alvo pedir o total outra vez. Exemplo: IMI de 271,24 € com 232,36 € juntos, pago a 1 de novembro por 271,27 € — pedia 310,15 €, agora pede os 38,91 € que deixam a categoria a zero."])+ver("1.84","outubro 2026",["A sincronização passou a distinguir um <b>token que já não vale</b> de uma <b>pausa pedida pelo GitHub</b> (demasiados pedidos seguidos) — antes, os dois davam «o GitHub recusou o token». Numa pausa, a aplicação espera sozinha até à hora indicada e retoma; em «Sincronização» fica escrito o último problema, com a mensagem do próprio GitHub."])+ver("1.83","outubro 2026",["<b>Protecção contra orçamentos esvaziados.</b> Se a aplicação não conseguir ler um orçamento, já não o substitui por um vazio: mostra o que lá está e diz porquê. Nunca grava um orçamento vazio por cima de um com dados (só «Apagar todos os dados» o faz), não envia um vazio para a nuvem, e se a nuvem trouxer um orçamento vazio que neste aparelho tem dados, <b>pergunta</b> antes — com a opção de manter os daqui e os enviar."])+ver("1.82","outubro 2026",["Os <b>\uD83D\uDD51 Movimentos recentes</b> guardam agora os <b>últimos 40</b> (eram 30)."])+ver("1.81","outubro 2026",["A <b>vista</b> passa a ser do orçamento e vai na sincronização: <b>grupos fechados</b>, período e modo dos <b>Relatórios</b>, ordem dos <b>beneficiários</b> e os modos do \uD83C\uDFAF Financiar, ↩ Repor e \uD83E\uDE79 Cobrir. Fechar um grupo no computador fecha-o também no telemóvel. O ecrã, o mês e os filtros continuam a recomeçar sempre que abre a aplicação.","Os <b>saldos iniciais</b> de contas antigas deixam de depender do nome «Saldo inicial»: ficam marcados (sem nada mudar no que vê) e mudar esse nome em Beneficiários já não os transforma em rendimento."])+ver("1.80","outubro 2026",["Um valor que não se consegue ler (por exemplo <b>1.200.00</b>) já não é gravado como zero. A gravação pára, o campo fica a vermelho e a mensagem diz qual é o valor. Antes aparecia «Indique um valor» na transação — e, pior, no alvo da categoria o alvo era apagado, no saldo inicial a conta ficava sem ele, uma linha da divisão desaparecia e no Atribuído a atribuição passava a zero.","<b>⧉ Duplicar</b> deixou de ocupar uma linha nos <b>Movimentos recentes</b>. Fica registado só quando muda o <b>valor</b> da cópia: «⧉ Duplicou «Continente» com outro valor (era 23,40 €)», com o valor novo.","Cobrir, financiar, libertar e repor já não deixam <b>atribuições a zero</b> guardadas. As antigas desaparecem da próxima vez que mexer em atribuições."])+ver("1.79","outubro 2026",["<b>Alvos «Repor» com prazo</b> (até uma data, e trimestrais/semestrais/anuais com mês da despesa): o dinheiro que já tinha atribuído este mês contava duas vezes. Um alvo de 1.200 € em 4 meses pedia 300 € — mas, com 150 € postos à mão, pedia só mais 112,50 € e dava o mês por cumprido com 262,50 €. Agora pede os 300 €.","O <b>Pronto a atribuir</b> de um mês já desconta o que atribuiu nos <b>meses seguintes</b>. Com 500 € atribuídos em novembro, outubro deixava gastar esses mesmos 500 € outra vez, sem aviso. Quando isto acontece, o cartão diz-lhe quanto já está reservado para a frente.","Escrever <b>1.500</b> num valor dá <b>1.500 €</b> (antes gravava 1,50 €), e <b>1.234.567</b> dá o que parece. Um valor em euros nunca tem três casas decimais, por isso um ponto seguido de três algarismos é milhar. <b>1,5</b> e <b>12.5</b> continuam decimais.","Numa conta dentro de um valor, uma parcela pode começar pela vírgula: <b>3+,3</b> vale 3,30 (como 3+0,3).","«<b>Ainda este mês</b>»: uma recorrente que traz dinheiro de uma conta de acompanhamento para o orçamento (um resgate, como Rendimento) contava como <b>saída</b>. Passa a contar como entrada.","O gráfico <b>Evolução por categoria</b> abate as devoluções, como a <b>Despesa por categoria</b>. A mesma categoria no mesmo período dava valores diferentes nos dois.","No CSV do orçamento do mês, o <b>Pronto a atribuir</b> estava na coluna da Atividade. Passou para a do Disponível.","Mais protecção dos dados: um ponto \uD83D\uDEDF de um <b>orçamento eliminado</b> volta a criá-lo à parte, em vez de substituir o que está aberto; a sincronização deixa de abrir avisos por cima de uma <b>transação a meio</b> (espera que feche a janela); depois de adotar a versão da nuvem, o ↩ já não volta à versão antiga deste aparelho; importar uma cópia limpa os orçamentos que deixaram de existir; e, sem o armazém grande do navegador (navegação privada), o histórico já não fica com pontos que não abrem.","Um ficheiro importado (ou a nuvem) já não consegue meter código na aplicação através de identificadores, datas ou moeda com conteúdo estranho. Os seus dados não mudam: já têm a forma certa.","As cópias na nuvem passam a dizer com que força estão cifradas. Quando os dois aparelhos já tiverem esta versão, passam sozinhos a usar a força recomendada hoje (600.000 iterações em vez de 150.000).","Recorrentes, divisões e transferências novas já não vêm com uma <b>conta arquivada</b> escolhida (faltava aqui o que se corrigiu na 1.78 para a Nova transação).","Mudar o <b>tipo</b> de uma conta com movimentos pergunta antes, e explica o aviso de integridade que vai aparecer.","O ↩ ficou igual em todo o lado: as setas ▲▼ no topo ou no fundo já não gastam um passo, arrastar para reordenar passou a anular-se, e uma transferência que não se consegue alterar já não estraga o ↪.","Abrir os Relatórios já não conta como alteração (não acende o «por guardar» nem sincroniza). As cores das prioridades no \uD83E\uDE79 Cobrir passaram a ser as do Orçamento. No modo escuro, o petróleo usa o tom pensado para fundo escuro. A barra do sistema acompanha a cor escolhida."])+ver("1.78","setembro 2026",["O <b>➕ Nova transação</b> deixou de poder vir com uma <b>conta arquivada</b> escolhida. Estando a primeira conta da lista arquivada, era ela a predefinida — e, por vir escolhida, aparecia mesmo na caixa, que normalmente as esconde.","No filtro de <b>conta</b> das Transações, as <b>arquivadas</b> passaram para o fim, debaixo do seu próprio título, como já acontecia no filtro de categorias. Continuam escolhíveis: guardam transações antigas."])+ver("1.77","setembro 2026",["Uma conta <b>mal escrita</b> num campo de dinheiro passou a ser <b>recusada</b> em vez de adivinhada. O <b>8,99*2</b> guardava <b>8,99 €</b> e o <b>1,2,3</b> guardava <b>12,30 €</b> — sem aviso nenhum, porque os símbolos a mais eram deitados fora e sobrava um número credível. A multiplicação continua a não existir; o que mudou é a aplicação dizer que não percebeu em vez de inventar um valor.","Os campos de dinheiro passaram a aceitar <b>24 caracteres</b> em vez de 13: cabe agora uma conta com várias parcelas, como <b>12,50+3,20-1,10</b>, que antes era cortada a meio.","Na lista de contas à esquerda passa a ver-se o <b>Confirmado</b> — o que o banco já processou — em vez do Saldo. É o número que se compara com a aplicação do banco, e é aquele de que a <b>bolinha</b> ao lado sempre falou. A bolinha não mudou, e o rato por cima mostra os dois.","O <b>➕ Nova transação</b> passou a trazer sempre a <b>conta que está aberta</b>, venha de onde vier o botão. Só o botão de dentro da conta é que a trazia; os outros caíam na primeira da lista."])+ver("1.76","setembro 2026",["Nos <b>Relatórios</b>, o que se passa nas <b>contas de acompanhamento</b> deixou de contar como despesa ou rendimento seus. Uma comissão da corretora ou um cashback creditado numa conta de investimento inflacionavam a <b>Despesa</b> com dinheiro que nunca passou pelo orçamento — e, por estas contas não levarem categoria, iam todos parar a «Sem categoria». Continuam a contar no <b>Património</b>, que é onde pertencem.","Assim, o <b>«Sem categoria»</b> volta a querer dizer uma coisa só: uma transação numa conta de orçamento a que falta a categoria — que é um engano, e continua bem à vista."])+ver("1.75","setembro 2026",["Uma conta que dê <b>negativo</b> passa para o outro lado, em positivo: escrever «4−6» na <b>Entrada</b> grava uma <b>Saída de 2</b>. Antes ficava lá uma entrada de −2 e a lista mostrava «+−2,00 €» a verde, como se tivesse entrado dinheiro. O saldo estava certo — o sentido é que não estava.","O <b>diário de movimentos</b> passou a contar para a sincronização. <b>Limpar o diário</b> não mexia em mais nada, e por isso não era detectado como alteração: ficava só neste aparelho. Agora chega aos outros — se o limpar num, fica limpo em todos.","No gráfico <b>Despesa por categoria</b> deixaram de aparecer categorias que não gastaram nada. Uma entrada sem categoria — um cashback pago a uma conta de acompanhamento, por exemplo — desenhava uma barra com valor <b>negativo</b>. As devoluções continuam a abater à despesa, como sempre.","As transações com <b>data que ainda não chegou</b> distinguem-se na lista: a data fica esbatida e ganha um <b>◷</b>. Funciona com filtros ligados ou sem eles.","Os campos de <b>texto livre</b> — beneficiário, nota, nome — ganharam um <b>✕</b> para apagar de uma vez, que só aparece quando há texto.","Os ficheiros <b>.csv</b> exportados deixaram de poder executar fórmulas ao abrir no Excel, e passaram a aguentar nomes com aspas, ponto-e-vírgula ou mudanças de linha lá dentro — sai e volta a entrar igual.","No <b>Método</b> do alvo (Repor / Reservar), os textos passaram a caber numa linha no computador; a explicação ficou na nota por baixo, onde se lê inteira."])+ver("1.74","agosto 2026",["Uma categoria cujo <b>grupo tenha desaparecido</b> deixou de se sumir da caixa «Todas as categorias» das Transações. Se estivesse a filtrar por ela, a caixa passava a dizer «Todas as categorias» com o filtro ligado.","O <b>❓ Como funciona?</b> passou a explicar as <b>15 maiores</b> da despesa por categoria e o <b>⬇ Exportar</b> dos beneficiários."])+ver("1.73","agosto 2026",["No telemóvel, os botões de período dos <b>Relatórios</b> diziam <b>«1 mês m»</b> em vez de <b>«1m»</b> — a forma longa e a curta ao mesmo tempo. Ficou só a curta, como era."])+ver("1.72","agosto 2026",["Os <b>\uD83C\uDFF7 Beneficiários</b> ganharam um <b>⬇ Exportar</b>, ao lado da contagem: um por linha, com as transações, o total, a média, a primeira e a última vez e as categorias em que entrou. Sai pela ordem que escolheu e só os que o filtro deixa ver. No computador, como as outras exportações.","Nos <b>Relatórios</b>, trocar o período — de 6 para 12 meses, por exemplo — deixou de atirar a página para cima. Quem está a olhar para o gráfico de baixo é justamente quem quer comparar os dois."])+ver("1.71","agosto 2026",["No gráfico <b>Despesa por categoria</b>, ficam as <b>15 maiores</b> e as restantes juntam-se numa linha «Outras», sempre a última — mesmo quando a soma delas dá uma barra maior. Passar por cima dela mostra o que lá está dentro.","Nesse gráfico, os <b>nomes das categorias</b> ganharam espaço e truncam mais tarde.","No ecrã <b>Dados e cópias</b>, a nota do espaço ocupado e os textos por baixo dos títulos das secções ficaram do tamanho das outras notas — estavam do tamanho do corpo do texto e pareciam mais importantes do que os botões a que se referem.","No computador, os botões de período dos <b>Relatórios</b> partem todos da mesma maneira: o número em cima e «mês»/«meses» por baixo."])+ver("1.70","agosto 2026",["No <b>Orçamento</b>, mudar de mês deixou de atirar a lista para cima: fica-se nas mesmas categorias, que é o que se quer comparar de um mês para o outro. Com filtros ligados continua a começar do princípio — aí a lista muda mesmo de um mês para o outro."])+ver("1.69","agosto 2026",["A caixa <b>«Todas as categorias»</b> das Transações passou a listar as categorias pela <b>ordem do ecrã Orçamento</b>, grupo a grupo, em vez da ordem por que foram criadas. As arquivadas ficam no fim, à parte."])+ver("1.68","agosto 2026",["As <b>categorias escolhidas nos Relatórios</b> gravavam e iam no pacote, mas a sincronização nunca chegava a enviá-lo: escolhê-las não era contado como uma alteração, e a aplicação concluía que não havia nada de novo. Agora conta — e chegam aos outros aparelhos.","<b>Da primeira vez que sincronizar depois desta atualização</b>, o segundo aparelho pode mostrar o ecrã de <b>conflito</b> sem diferenças nenhumas em transações. É esperado e acontece uma só vez: escolha o lado que tiver as categorias certas nos Relatórios."])+ver("1.67","agosto 2026",["Nos <b>Relatórios</b>, escolher uma categoria no gráfico deixou de atirar a página para cima. Acontecia só à <b>primeira</b> escolha: ligar uma categoria muda a altura do gráfico, e a posição só era guardada quando o conteúdo ficava do mesmo tamanho.","E as categorias do gráfico passaram a aparecer pela <b>ordem do ecrã Orçamento</b> — grupo a grupo — em vez da ordem por que foram criadas. Uma categoria nova ia para o fim da fila, longe das do seu grupo."])+ver("1.60 – 1.66","agosto 2026",["Todos os ecrãs passaram a ter o <b>mesmo desenho</b>: uma <b>faixa</b> em cima, que não se mexe — botões, filtros e o resumo do que se está a ver — e um <b>cartão</b> por baixo, que é a única coisa que desliza. O contorno arredondado fica parado e só o conteúdo corre lá dentro. A página em si deixou de deslizar, no telemóvel e no computador.","No <b>Orçamento</b>, as categorias correm dentro do cartão com a linha <b>Categoria · Atribuído · Atividade · Disponível</b> sempre à vista. No ecrã <b>Contas</b>, cada um dos dois cartões trata do seu deslize para o lado, e o de cima e baixo é do ecrã — para se chegar ao segundo quando o primeiro é comprido.","O <b>«Pronto a atribuir»</b> passou a gastar <b>uma linha em vez de duas</b>: no computador a frase fica ao lado do valor, e no telemóvel sai — o número e a cor já dizem em que pé se está. Toda a altura ganha vai para a lista.","Os <b>cartões</b> chegam mais abaixo, e o «Pronto a atribuir» e as barras de aviso — como o «Ainda este mês» — <b>começam e acabam onde os cartões começam e acabam</b>, nos cinco ecrãs. Antes atravessavam a página de lado a lado.","No computador, a <b>barra de cima</b> deixou de mudar ao trocar de ecrã: tem sempre a mesma altura, e o <b>↩ ↪ \uD83D\uDD51</b>, o selector de mês e as setas ficam sempre no mesmo sítio — independentemente do tamanho do título.","As <b>categorias escolhidas nos Relatórios</b> passaram a fazer parte do orçamento, e não do aparelho. O <b>período</b> e o modo <b>Gasto/Atribuído</b> continuam a ser de cada aparelho.","O <b>❓ Como funciona?</b> ganhou uma secção sobre os <b>Relatórios</b>, que não tinha, e outra sobre <b>o que viaja</b> na sincronização."])+ver("1.54 – 1.58","agosto 2026",["Com o telemóvel <b>deitado</b>, a aplicação vestia a disposição do <b>computador</b> — e por isso a tabela não deslizava para o lado. A culpa era do <b>zoom da página</b> do Safari, que aumenta as medidas com que a aplicação decide onde está.","Nas <b>Recorrentes</b>, quem desliza passou a ser a lista, e não a página — como já acontecia nas Transações. O <b>cabeçalho</b> da lista fica agora fixo nos dois ecrãs.","A <b>barra de cima</b> deixou de fugir para cima ao puxar a página para além do fim. Acontecia no Orçamento, Contas, Recorrentes e Relatórios.","A <b>altura da lista</b> no telemóvel passou a ser medida pelo espaço que existe de facto. Deitado, sobrava-lhe altura a mais e as últimas linhas escondiam-se.","O <b>❓ Como funciona?</b> e as <b>\uD83D\uDCCB Novidades</b> passaram a secções que abrem e fecham, com o número de pontos ao lado do título. Eram quarenta mil caracteres de uma vez."])+ver("1.53","agosto 2026",["Os <b>alvos «até uma data»</b> deixam de pedir dinheiro depois do prazo: a linha diz <b>«prazo terminado»</b> e cala-se, distinguindo quem cumpriu a meta de quem ficou pelo caminho. No método <b>Repor</b>, gastar o dinheiro depois da data fazia o alvo pedir o valor inteiro <b>outra vez</b>, todos os meses.","Todos os <b>campos de dinheiro</b> mostram o valor por extenso — <b>8,50</b> e <b>1.234,50</b>, nunca 8,5 — e alinhados à direita. Continua a poder escrever como lhe der jeito, contas incluídas.","As <b>três colunas do orçamento</b> no telemóvel foram reequilibradas: tamanhos por ordem de importância, símbolo da moeda nas três, números alinhados e zeros da Atividade mais apagados.","No telemóvel, a <b>tabela deixou de fugir para a esquerda</b> ao tocar no ✓, no ⧉ ou no \uD83D\uDDD1 das Transações.","Os <b>botões do cabeçalho</b> do telemóvel seguem a ordem do computador, e o <b>\uD83D\uDD51</b> passou a dizer <b>Movimentos</b> em ecrã largo.","Doze botões que são só um símbolo passaram a anunciar-se a quem usa <b>leitor de ecrã</b>, e três mensagens deixaram de escrever <b>«1 categorias»</b>."])+ver("1.52","agosto 2026",["<b>\uD83D\uDD51 Movimentos recentes</b>, ao lado do ↩ ↪: o registo de como tem repartido o dinheiro pelas categorias, com os últimos 40. Diz também <b>de onde</b> veio o dinheiro de cada operação.","O <b>↩ Anular</b> e o <b>↪ Refazer</b> ficaram de confiança: o Refazer deixou de desaparecer sozinho, e o Anular passou a cobrir mais nove coisas que não tinham volta.","Duas <b>correcções no dinheiro</b>: eliminar um grupo deixava para trás, invisível, o dinheiro das categorias dele; e a linha do cartão de crédito discordava do «Libertar excedente» sobre o que contar.","<b>Abrir uma conta</b> deixou de ser um ecrã à parte: leva às Transações já filtradas, com os saldos numa linha por cima da lista.","As listas passaram a ter uma coluna <b>Valor</b> em vez de Saída e Entrada, <b>separadores de mês</b>, e a <b>nota</b> visível também no telemóvel.","O <b>⬇ Exportar o que vejo</b> respeita os filtros do ecrã. E o <b>Trazer e levar</b> ganhou duas gavetas simétricas, com a <b>configuração dos alvos</b> a poder ser importada e não só exportada.","As perguntas <b>«tem a certeza?»</b> passaram a janelas da aplicação, e todos os botões ganharam nome para <b>leitores de ecrã</b>.","<b>Oito cores</b> à escolha, <b>ícone novo</b> em duas versões, cabeçalho do telemóvel com botões do tamanho de um dedo, e <b>Dados e cópias</b> a dizer quantas transações tem e quanto espaço ocupam.","Mais rápida a cada toque, dados de exemplo refeitos, e uma revisão de ponta a ponta — arquivar uma categoria com dinheiro, nomes com números na importação, cor por omissão que já não existia."])+ver("1.33 – 1.51","agosto 2026",["<b>«Dados e cópias» reorganizado</b> à volta de onde os dados vivem (navegador, ficheiro, nuvem), do que se traz e leva, e das definições. <b>Importar um ficheiro passou a perguntar antes</b> — substituía tudo em silêncio — e guarda um ponto \uD83D\uDEDF primeiro.","<b>O histórico de cópias deixou de ter limite prático:</b> passou para uma zona do navegador com espaço de sobra. Antes, num orçamento grande, iam-se perdendo até sobrar uma.","<b>Dados protegidos:</b> o Safari limpa sozinho o que não é usado durante uns dias — a aplicação passou a pedir para ser poupada, e diz-lhe se está protegida.","<b>Novo filtro \uD83D\uDE34 Adiadas</b> e barra de filtros do orçamento repensada; <b>separadores de mês</b> na lista de recorrentes; <b>cabeçalho fixo</b> nas listas de transações."])+ver("1.13 – 1.32","agosto 2026",["<b>Contas em qualquer campo de dinheiro:</b> escreva <b>23,45+11,90</b> em vez de somar de cabeça. No telemóvel, o teclado com <b>+</b> e <b>−</b> passou a abrir em todos esses campos, e só aceita pelo <b>✓</b>.","<b>A categoria passou a ser obrigatória</b> em contas de orçamento e cartões — sem ela o movimento ficava de fora do orçamento. Continuam sem categoria o saldo inicial, as transferências entre contas suas e as contas de acompanhamento.","<b>Resumo por beneficiário</b> (\uD83D\uDCCA em \uD83C\uDFF7 Beneficiários): quanto gastou nesse sítio, quantas vezes, média e categorias — e pode cruzar com um período.","<b>Cada ecrã novo começa no princípio</b>, e tocar num separador onde já está serve de «voltar ao topo». <b>Pontinho de estado</b> em cada conta: verde = a par do banco, âmbar = há lançamentos por processar.","<b>Sincronização mais calma:</b> ac
