    function A(cid,v){ s.assignments[cid+"|"+m]=v; }
    A(cRenda.id,650); A(cLuz.id,120); A(cNet.id,45); A(cSuper.id,400); A(cTransp.id,90);
    A(cRest.id,120); A(cLazer.id,40); A(cEmerg.id,150); A(cSeguro.id,50); A(cRoupa.id,50);

    function T(day,acc,payee,cid,out,inf,cl){ s.transactions.push({id:uid(),date:m+"-"+pad(day),accountId:acc,payee:payee,categoryId:cid,memo:"",outflow:out||0,inflow:inf||0,cleared:cl!==false}); }
    T(1, accCO.id, "Salário", INCOME, 0, 1850, true);
    T(2, accCO.id, "Senhorio", cRenda.id, 650, 0, true);
    T(4, accCO.id, "EDP", cLuz.id, 98.40, 0, true);
    T(5, accCO.id, "MEO", cNet.id, 44.99, 0, true);
    T(6, accCO.id, "Continente", cSuper.id, 86.75, 0, true);
    T(8, accCC.id, "Restaurante O Prego", cRest.id, 34.50, 0, false);
    T(10, accCO.id, "Passe Navegante", cTransp.id, 40, 0, true);
    T(12, accCO.id, "Pingo Doce", cSuper.id, 62.30, 0, true);
    T(14, accCC.id, "Netflix", cLazer.id, 13.99, 0, false);
    // A Poupança é uma conta de orçamento: pôr lá dinheiro é uma TRANSFERÊNCIA, não uma despesa.
    // O «Fundo de emergência» mantém o que lhe foi atribuído, e as contas continuam a bater certo.
    var pTr=uid();
    s.transactions.push({id:uid(), date:m+"-15", accountId:accCO.id,   payee:"↔ Poupança",       categoryId:null, memo:"", outflow:150, inflow:0,   cleared:true, transfer:pTr});
    s.transactions.push({id:uid(), date:m+"-15", accountId:accPoup.id, payee:"↔ Conta à ordem",  categoryId:null, memo:"", outflow:0,   inflow:150, cleared:true, transfer:pTr});
    T(18, accCO.id, "Galp combustível", cTransp.id, 55, 0, true);
    T(20, accCC.id, "Zara", cRoupa.id, 49.90, 0, false);
    T(22, accCO.id, "Continente", cSuper.id, 74.20, 0, true);

    var nextM = shiftMonth(m, 1);
    s.recurring = [
      {id:uid(), nextDate: nextM+"-01", freq:"monthly", accountId:accCO.id, payee:"Salário", categoryId:INCOME, memo:"", outflow:0, inflow:1850, active:true},
      {id:uid(), nextDate: nextM+"-02", freq:"monthly", accountId:accCO.id, payee:"Senhorio", categoryId:cRenda.id, memo:"", outflow:650, inflow:0, active:true},
      {id:uid(), nextDate: nextM+"-14", freq:"monthly", accountId:accCC.id, payee:"Netflix", categoryId:cLazer.id, memo:"", outflow:13.99, inflow:0, active:true}
    ];
    state = s; save(); render(); toast("Dados de exemplo carregados.");
  }

  // ---------- Avisos ----------
  var toastTimer;
  function toast(msg){ var t=el("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove("show");},2200); }
  function pushUndo(desc){ _undo.push({ desc:desc, json:JSON.stringify(state) }); if(_undo.length>UNDO_MAX) _undo.shift(); }
  function hideUndo(){ var b=el("undoBar"); if(b) b.classList.remove("show"); clearTimeout(_undoTimer); }
  function showUndo(){
    if(!_undo.length) return; var b=el("undoBar"); if(!b) return;
    var last=_undo[_undo.length-1];
    hideBackupBar();
    el("undoText").textContent = last.desc + (_undo.length>1 ? "  ·  "+_undo.length+" passos por anular" : "");
    b.classList.add("show"); clearTimeout(_undoTimer); _undoTimer=setTimeout(function(){ b.classList.remove("show"); },8000);
  }

  // ---------- Global event wiring (delegation, no inline handlers) ----------
  document.addEventListener("click", function(e){
    var nav = e.target.closest("[data-view]");
    if (nav) { state.ui.view = nav.getAttribute("data-view"); if(state.ui.view!=="accounts") state.ui.openAccount=null; if(state.ui.view!=="transactions") state.ui.txFilter=null; render(); return; }
    var a = e.target.closest("[data-action]");
    if (!a) return;
    var action = a.getAttribute("data-action");
    if (!actions[action]) return;
    var id = a.getAttribute("data-id");
    var ds = { account: a.getAttribute("data-account") };
    // Evita que o clique na linha dispare quando se carrega num botão lá dentro
    if (a.hasAttribute("data-id") || action==="toggle-clear" || action==="delete-tx") e.stopPropagation();
    actions[action](id, ds);
  });

  // Clicar no fundo escurecido fecha a janela
  el("modalOverlay").addEventListener("click", function(e){ if(e.target===el("modalOverlay")) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeModal(); });
  // Prende o Tab dentro do modal aberto, para não se andar às cegas por trás do fundo escurecido.
  document.addEventListener("keydown", function(e){
    if (e.key!=="Tab" || !el("modalOverlay").classList.contains("open")) return;
    var f=focusaveis(); if(!f.length) return;
    var primeiro=f[0], ultimo=f[f.length-1];
    if (el("modal").contains(document.activeElement)===false) { e.preventDefault(); primeiro.focus(); return; }
    if (e.shiftKey && document.activeElement===primeiro) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && document.activeElement===ultimo) { e.preventDefault(); primeiro.focus(); }
  });

  // Edição do valor atribuído na própria linha
  document.addEventListener("change", function(e){
    var inp = e.target.closest("[data-assign]");
    if (inp) {
      var cid = inp.getAttribute("data-assign");
      var v = parseAmount(inp.value); v = isNaN(v)?0:round2(v);
      var key = cid + "|" + state.ui.month;
      if (v===0) delete state.assignments[key]; else state.assignments[key]=v;
      state.ui.lastFunding=null;
      save(); render(); return;
    }
    if (e.target.id==="txFilterAcc"){ state.ui.txFilter=state.ui.txFilter||{}; state.ui.txFilter.account=e.target.value||null; render(); }
    if (e.target.id==="txFilterCat"){ state.ui.txFilter=state.ui.txFilter||{}; state.ui.txFilter.category=e.target.value||null; render(); }
    if (e.target.id==="txFilterFrom"){ state.ui.txFilter=state.ui.txFilter||{}; state.ui.txFilter.from=e.target.value||null; render(); }
    if (e.target.id==="txFilterTo"){ state.ui.txFilter=state.ui.txFilter||{}; state.ui.txFilter.to=e.target.value||null; render(); }
    if (e.target.id==="txFilterPer"){ state.ui.txFilter=state.ui.txFilter||{}; var pv=e.target.value; state.ui.txFilter.per=pv||null; if(pv!=="custom"){ state.ui.txFilter.from=null; state.ui.txFilter.to=null; } render(); }
    if (e.target.id==="repFrom"){ state.ui.reportFrom=e.target.value||null; if(state.ui.reportFrom&&!state.ui.reportTo) state.ui.reportTo=state.ui.month; render(); }
    if (e.target.id==="repTo"){ state.ui.reportTo=e.target.value||null; if(state.ui.reportTo&&!state.ui.reportFrom) state.ui.reportFrom=shiftMonth(state.ui.reportTo,-5); render(); }
  });
  document.addEventListener("keydown", function(e){
    if (e.key==="Enter" && e.target.closest("[data-assign]")) { e.target.blur(); }
  });
  document.addEventListener("input", function(e){
    var _id=e.target.id;

    // ---- Campos de valor: só dígitos e um separador decimal ----
    var alvo = e.target;
    if (alvo.classList && alvo.classList.contains("money")) {
      var par = alvo.getAttribute("data-par");
      var bruto = alvo.value;
      // Num par Saída/Entrada o "-" não é um sinal: passa o valor para o outro lado.
      if (par && bruto.indexOf("-") >= 0) {
        var outro = el(par), limpo = limpaValor(bruto.replace(/-/g, ""), false);
        alvo.value = "";
        if (outro) { outro.value = limpo; try { outro.focus(); outro.setSelectionRange(limpo.length, limpo.length); } catch(err){} }
        toast(/In$/.test(par) ? "Passou para Entrada." : "Passou para Saída.");
        return;
      }
      var limpo2 = limpaValor(bruto, alvo.hasAttribute("data-neg"));
      if (limpo2 !== bruto) {
        var pos = alvo.selectionStart, delta = bruto.length - limpo2.length;
        alvo.value = limpo2;
        try { var np = Math.max(0, Math.min(limpo2.length, (pos==null?limpo2.length:pos) - delta)); alvo.setSelectionRange(np, np); } catch(err){}
      }
      if (par && alvo.value) { var op = el(par); if (op) op.value = ""; }   // só um dos dois lados
    }

    if (_id && _id.indexOf("spAmt")===0){ var _els=document.querySelectorAll("[id^='spAmt']"), _tot=0; for(var _qi=0;_qi<_els.length;_qi++){ var _vv=parseAmount(_els[_qi].value); if(!isNaN(_vv)) _tot+=_vv; } var _h=el("splitTotal"); if(_h) _h.textContent=fmt(_tot); }
    if (e.target.id==="txSearch"){
      state.ui.txFilter=state.ui.txFilter||{}; state.ui.txFilter.q=e.target.value;
      var v=e.target.value;
      clearTimeout(_searchTimer);   // temporizador próprio — antes limpava o do toast, que ficava preso no ecrã
      _searchTimer=setTimeout(function(){
        if(el("txSearch")&&el("txSearch").value===v){ renderTransactions(); var s=el("txSearch"); if(s){ s.focus(); s.setSelectionRange(v.length,v.length); } }
      },250);
    }
  });

  // ---------- Arrastar para reordenar (categorias e grupos) ----------
  var _dragOver=null;
  function clearDragOver(){ if(_dragOver && _dragOver.classList) _dragOver.classList.remove("drag-over"); _dragOver=null; }
  document.addEventListener("dragstart", function(e){
    var r=e.target.closest && e.target.closest("[data-drag]"); if(!r) return;
    _drag={ type:r.getAttribute("data-drag"), id:r.getAttribute("data-drag-id") };
    if(e.dataTransfer){ e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",_drag.id); }catch(err){} }
  });
  document.addEventListener("dragover", function(e){
    if(!_drag) return;
    var r=e.target.closest && e.target.closest("[data-drag]"); if(!r) return;
    if(r.getAttribute("data-drag")!==_drag.type) return;
    e.preventDefault();
    if(_dragOver!==r){ clearDragOver(); _dragOver=r; if(r.classList) r.classList.add("drag-over"); }
  });
  document.addEventListener("drop", function(e){
    if(!_drag) return;
    var r=e.target.closest && e.target.closest("[data-drag]");
    clearDragOver();
    if(r && r.getAttribute("data-drag")===_drag.type){
      e.preventDefault();
      var dstId=r.getAttribute("data-drag-id"), moved=false;
      if(_drag.type==="cat") moved=dropCategory(_drag.id,dstId); else moved=dropGroup(_drag.id,dstId);
      if(moved){ save(); render(); }
    }
    _drag=null;
  });
  document.addEventListener("dragend", function(){ clearDragOver(); _drag=null; });

  // ---------- Tooltips do gráfico (rato) + valor ao tocar (telemóvel) + redimensionar ----------
  function positionTip(x, y){
    var tip=el("chartTip"); if(!tip) return;
    var w=tip.offsetWidth||140, h=tip.offsetHeight||30, m=8;
    var vw=window.innerWidth||document.documentElement.clientWidth||360;
    var vh=window.innerHeight||document.documentElement.clientHeight||640;
    var left=x+14; if(left+w+m>vw) left=x-14-w; if(left<m) left=m;
    var top=y-h-12; if(top<m) top=y+18; if(top+h+m>vh) top=vh-h-m;
    tip.style.left=left+"px"; tip.style.top=top+"px";
  }
  document.addEventListener("mouseover", function(e){ var pt=e.target.closest && e.target.closest(".evo-pt"); if(pt){ var tip=el("chartTip"); tip.textContent=pt.getAttribute("data-tip"); tip.classList.add("show"); positionTip(e.clientX, e.clientY); } });
  document.addEventListener("mousemove", function(e){ var tip=el("chartTip"); if(tip && tip.classList.contains("show")) positionTip(e.clientX, e.clientY); });
  document.addEventListener("mouseout", function(e){ if(e.target.closest && e.target.closest(".evo-pt")) el("chartTip").classList.remove("show"); });
  document.addEventListener("click", function(e){ var pt=e.target.closest && e.target.closest(".evo-pt"); if(pt) toast(pt.getAttribute("data-tip")); });
  var _rzT; window.addEventListener("resize", function(){ clearTimeout(_rzT); _rzT=setTimeout(function(){ if(state.ui.view==="reports") render(); }, 200); });

  // ---------- Arranque ----------
  if (!state.ui.month) state.ui.month = nowMonthKey();
  state.recurring = state.recurring || [];
  state.backup = state.backup || { at:null, sig:null, autoDay:null };
  var _posted = processRecurring();
  render();
  if (_posted > 0) toast("Foram lançadas " + _posted + " transações recorrentes.");

  // Instantâneo diário DENTRO da aplicação (últimos 5 dias) — sem transferir ficheiros,
  // por isso funciona igual no iPhone e no PC. A exportação para ficheiro é manual.
  (function(){
    if (state.settings.autoBackup !== false) { try { takeDailySnapshot(); } catch(e){} }
    setTimeout(maybeShowBackupReminder, 1200);
  })();

  // ...e também ao SAIR (mudar de separador, fechar, ir para outra app no telemóvel).
  // Só com a abertura, o trabalho da última sessão de cada dia ficava por guardar até
  // à abertura seguinte — que podia nunca chegar, se o navegador limpasse o armazenamento.
  // O takeDailySnapshot() substitui a entrada do próprio dia, por isso continua a ser
  // um ponto por dia; o que muda é ser o estado mais recente desse dia, e não o inicial.
  function snapshotAoSair(){
    if (!state || state.settings.autoBackup === false) return;
    try { takeDailySnapshot(); } catch(e){}
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden") snapshotAoSair();   // o que funciona no iOS
  });
  window.addEventListener("pagehide", snapshotAoSair);

  // Sincronização na nuvem ao abrir (se estiver ligada e automática).
  if (_sync.auto && syncReady()) setTimeout(function(){ syncNow({silent:true}); }, 1500);
})();
</script>
