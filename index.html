        fBtn('f-warn','budget-filter','warn',bf.warn,'🟡','Abaixo do alvo','Só as categorias com o alvo por cumprir') +
        fBtn('f-neg','budget-filter','neg',bf.neg,'🔴','Excedido','Só as categorias que gastaram mais do que tinham') +
        '<span class="sep"></span>' +
        fBtn('f-alta','prio-filter','alta',bp.alta,'▲','Alta','Só as de prioridade alta') +
        fBtn('f-normal','prio-filter','normal',bp.normal,'●','Normal','Só as de prioridade normal') +
        fBtn('f-baixa','prio-filter','baixa',bp.baixa,'▼','Baixa','Só as de prioridade baixa') +
        (filtering ? '<button class="btn sm" data-action="budget-filter-clear">Limpar</button>' : '') +
        '<div class="spacer"></div>' +

          '<button class="btn ghost sm" data-action="collapse-all" title="Fechar todos os grupos" aria-label="Fechar todos os grupos" style="padding:1px 5px;">⊖</button>'+
        '</th><th>Atribuído</th><th>Atividade</th><th>Disponível</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';

  function renderAccounts() {

    if (state.ui.openAccount) { renderRegister(state.ui.openAccount); return; }

          '<button data-action="edit-account" data-id="'+a.id+'" title="Editar">✎</button>'+

  function renderRegister(accId) {
    var acc = accountById(accId);
    if (!acc) { state.ui.openAccount = null; renderAccounts(); return; }
    // Ordem cronológica (estável) para acumular o saldo; a apresentação é exatamente o seu inverso,

    var ascAll = state.transactions.filter(function(t){return t.accountId===accId;})

    var LIMR = state.ui.txLimit || PAGINA;

    el("content").innerHTML =

        '<button class="btn" data-action="back-accounts">‹ Contas</button>'+

        '<button class="btn" data-action="transfer">↔ Transferir</button>'+

        '<div class="spacer"></div>'+
        '<span class="muted" style="font-size:12.5px;">Confirmado: <b>'+fmt(cl)+'</b> &nbsp;·&nbsp; Saldo: <b style="'+(bal<0?"color:var(--negative)":"")+'">'+fmt(bal)+'</b></span>'+
      '</div>'+
      '<h3 style="margin:4px 2px 12px;">'+esc(acc.name)+' <span class="pill '+(acc.type==="budget"?"budget":(acc.type==="credit"?"credit":"tracking"))+'">'+(acc.type==="budget"?"Orçamento":(acc.type==="credit"?"Cartão de crédito":"Acompanhamento"))+'</span></h3>'+

  function txRow(t, runBal, withAccount) {

                    (t.categoryId ? ' <span class="tag">'+esc((lkCat(t.categoryId)||{name:"(apagada)"}).name)+'</span>' : '')) :

      '<td class="muted" style="white-space:nowrap;">'+fmtDate(t.date)+'</td>'+
      accCell +
      '<td style="font-weight:600;">'+esc(t.payee||"")+(t.split?' <span class="tag" title="Transação dividida">🔗</span>':'')+'</td>'+
      '<td>'+catName+'</td>'+
      '<td class="tag col-nota">'+esc(t.memo||"")+'</td>'+
      '<td class="num">'+(t.outflow?'<span class="tx-amt out">'+fmt(t.outflow)+'</span>':'')+'</td>'+
      '<td class="num">'+(t.inflow?'<span class="tx-amt in">'+fmt(t.inflow)+'</span>':'')+'</td>'+
      balCell +
      '<td style="text-align:center;"><span class="cleared-dot '+(t.cleared?"on":"")+'" data-action="toggle-clear" data-id="'+t.id+'">✓</span></td>'+

        '<button data-action="duplicate-tx" data-id="'+t.id+'" title="Duplicar">⧉</button>'+
        '<button data-action="delete-tx" data-id="'+t.id+'" title="Eliminar">🗑</button></td></tr>';

  // Períodos prontos, para não ser preciso andar a escolher datas à mão no dia a dia.
  var PERIODOS = [["","Sempre"],["mes","Este mês"],["mesant","Mês passado"],["m3","Últimos 3 meses"],
                  ["m12","Últimos 12 meses"],["ano","Este ano"],["custom","Intervalo à escolha…"]];
  function periodoDatas(per){
    var hoje=todayISO(), mAtual=nowMonthKey();
    if (per==="mes")    return { from:mAtual+"-01", to:hoje };
    if (per==="mesant") { var a=shiftMonth(mAtual,-1), p=a.split("-"); return { from:a+"-01", to:a+"-"+pad(new Date(+p[0], +p[1], 0).getDate()) }; }
    if (per==="m3")     return { from:shiftMonth(mAtual,-2)+"-01", to:hoje };
    if (per==="m12")    return { from:shiftMonth(mAtual,-11)+"-01", to:hoje };
    if (per==="ano")    return { from:mAtual.slice(0,4)+"-01-01", to:hoje };
    return null;
  }
  function renderTransactions() {
    var f = state.ui.txFilter || {};
    var list = state.transactions.slice().sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    var jan = (f.per && f.per!=="custom") ? periodoDatas(f.per) : null;
    var de = jan ? jan.from : f.from, ate = jan ? jan.to : f.to;
    if (f.account) list = list.filter(function(t){return t.accountId===f.account;});
    if (f.category) list = list.filter(function(t){return t.categoryId===f.category;});
    if (de) list = list.filter(function(t){return t.date>=de;});
    if (ate) list = list.filter(function(t){return t.date<=ate;});
    if (f.q) { var q=f.q.toLowerCase(); list = list.filter(function(t){ return (t.payee||"").toLowerCase().indexOf(q)>=0 || (t.memo||"").toLowerCase().indexOf(q)>=0; }); }

    var perOpts = PERIODOS.map(function(p){ return '<option value="'+p[0]+'"'+((f.per||"")===p[0]?" selected":"")+'>'+p[1]+'</option>'; }).join("");
    var accOpts = '<option value="">Todas as contas</option>' + state.accounts.map(function(a){return '<option value="'+a.id+'"'+(f.account===a.id?" selected":"")+'>'+esc(a.name)+'</option>';}).join("");
    var catOpts = '<option value="">Todas as categorias</option><option value="'+INCOME+'"'+(f.category===INCOME?" selected":"")+'>Rendimento</option>' +
      state.categories.filter(function(c){return !c.cardId;}).map(function(c){return '<option value="'+c.id+'"'+(f.category===c.id?" selected":"")+'>'+esc(c.name)+'</option>';}).join("");

    // Chega-se aqui filtrado a partir da atividade de uma categoria — sem isto não há
    // forma óbvia de voltar a ver tudo.
    var temFiltro = !!(f.account || f.category || f.per || f.from || f.to || (f.q||"").trim());
    var soConta = !!(f.account && !f.category && !f.per && !f.from && !f.to && !(f.q||"").trim());
    var head = '<div class="toolbar">'+
      // O «Dividir» e o «Beneficiários» saíram daqui: o primeiro está dentro da nova
      // transação, o segundo na barra lateral (e no 🏷️ do topo, no telemóvel).
      '<button class="btn primary hide-phone" data-action="add-tx">➕ Nova transação</button>'+
      '<input class="search" id="txSearch" placeholder="Procurar beneficiário ou nota…" value="'+esc(f.q||"")+'">'+
      '<select class="filter" id="txFilterAcc">'+accOpts+'</select>'+
      '<select class="filter" id="txFilterCat">'+catOpts+'</select>'+
      '<select class="filter" id="txFilterPer">'+perOpts+'</select>'+
      (f.per==="custom" ? '<input class="filter" id="txFilterFrom" type="date" title="De" value="'+esc(f.from||"")+'">'+
                          '<input class="filter" id="txFilterTo" type="date" title="Até" value="'+esc(f.to||"")+'">' : '')+
      (temFiltro ? '<button class="btn sm" data-action="tx-filter-clear" title="Ver todas as transações">✕ Limpar filtros</button>' : '')+
      '<div class="spacer"></div>'+
      '<button class="btn sm" data-action="export-csv">⬇ CSV</button>'+
      '<span class="muted" style="font-size:12.5px;">'+list.length+(temFiltro?' de '+state.transactions.length:'')+' transações</span></div>';

    if (!state.transactions.length) {
      el("content").innerHTML = head + emptyState("🧾","Sem transações","Registe as suas entradas e saídas para ver a atividade no orçamento.",
        '<button class="btn primary" data-action="add-tx">➕ Nova transação</button>');
      return;
    }
    var LIM = state.ui.txLimit || PAGINA;
    var visiveis = list.slice(0, LIM);
    // Só faz sentido mostrar saldo acumulado quando se está a ver UMA conta e nada mais:
    // com outros filtros faltariam movimentos pelo meio e o saldo mentiria.
    var balOf = null;
    if (soConta) {
      var asc = state.transactions.filter(function(t){ return t.accountId===f.account; })
        .sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
      balOf = {}; var run = 0;
      for (var bi=0; bi<asc.length; bi++){ run = round2(run + (asc[bi].inflow||0) - (asc[bi].outflow||0)); balOf[asc[bi].id] = run; }
    }
    var body = list.length ? visiveis.map(function(t){ return txRow(t, balOf?balOf[t.id]:undefined, !soConta); }).join("")
                           : '<tr><td colspan="9" class="empty">Nada corresponde ao filtro.</td></tr>';
    if (list.length > LIM) body += '<tr><td colspan="9" style="text-align:center;padding:14px;">'+
      '<button class="btn" data-action="show-more-tx">Mostrar mais '+PAGINA+' (a ver '+LIM+' de '+list.length+')</button></td></tr>';

    el("content").innerHTML = head +
      '<div class="data-card"><table class="data"><thead><tr>'+
      '<th>Data</th>'+(soConta?'':'<th>Conta</th>')+'<th>Beneficiário</th><th>Categoria</th><th class="col-nota">Nota</th>'+
      '<th class="num">Saída</th><th class="num">Entrada</th>'+(soConta?'<th class="num">Saldo</th>':'')+
      '<th style="text-align:center;">✓</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
  }

  function niceMax(v){ if(!(v>0)) return 1; var pow=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)); var f=v/pow; var nf=f<=1?1:(f<=2?2:(f<=2.5?2.5:(f<=5?5:10))); return nf*pow; }

  // Gráfico de linhas em SVG (autónomo). W = largura em píxeis medida, para o texto ficar fixo (não amplia).
  function lineChartSVG(series, months, W){
    W = Math.max(320, W||720);
    var H=300, pl=54, pr=16, pTop=16, pb=30, fs=12;
    var iw=W-pl-pr, ih=H-pTop-pb, n=months.length;
    // Aceita valores negativos (o património líquido pode sê-lo): a escala arranca
    // no mínimo em vez de arrancar sempre em zero.
    var maxRaw=0, minRaw=0;
    series.forEach(function(s){ s.values.forEach(function(v){ if(v>maxRaw) maxRaw=v; if(v<minRaw) minRaw=v; }); });
    var maxV = maxRaw>0 ? niceMax(maxRaw) : 0;
    var minV = minRaw<0 ? -niceMax(-minRaw) : 0;
    if (maxV===minV) maxV = minV + 1;
    function xat(i){ return n<=1 ? pl+iw/2 : pl + iw*(i/(n-1)); }
    function yat(v){ return pTop + ih*(1 - (v-minV)/(maxV-minV)); }
    function sfmt(v){ v=Math.round(Math.abs(v)); return v>=1000 ? (Math.round(v/100)/10)+"k" : ""+v; }
    function etiqueta(v){ return (v<-0.5?"-":"") + currencySym() + sfmt(v); }   // «-€1,2k», não «€-1,2k»
    var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Gráfico de evolução">';
    for(var g=0; g<=4; g++){ var gy=pTop+ih*(g/4), gv=maxV-(maxV-minV)*(g/4);
      s+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" style="stroke:var(--border)" stroke-width="1"/>';
      s+='<text x="'+(pl-8)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="'+fs+'" style="fill:var(--text-muted)">'+etiqueta(gv)+'</text>'; }
    if (minV<0) { var zy=yat(0).toFixed(1);   // linha do zero, para se ver onde começa a dívida
      s+='<line x1="'+pl+'" y1="'+zy+'" x2="'+(W-pr)+'" y2="'+zy+'" style="stroke:var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>'; }
    var step = n>18?4:(n>12?3:(n>6?2:1));
    for(var i=0;i<n;i++){ if(i%step!==0 && i!==n-1) continue; var p=months[i].split("-"); var lab=MONTHS_PT[parseInt(p[1],10)-1].slice(0,3)+" "+p[0].slice(2);
      s+='<text x="'+xat(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="'+fs+'" style="fill:var(--text-muted)">'+lab+'</text>'; }
    series.forEach(function(se){
      var pts=se.values.map(function(v,i){ return xat(i).toFixed(1)+","+yat(v).toFixed(1); }).join(" ");
      s+='<polyline points="'+pts+'" fill="none" stroke="'+se.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
      se.values.forEach(function(v,i){ var cx=xat(i).toFixed(1), cy=yat(v).toFixed(1), p=months[i].split("-"), ml=MONTHS_PT[parseInt(p[1],10)-1].slice(0,3)+" "+p[0].slice(2);
        s+='<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="transparent" class="evo-pt" data-tip="'+esc(se.name+' · '+ml+': '+fmt(v))+'"/>';
        s+='<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="'+se.color+'" style="pointer-events:none"/>'; });
    });
    return s+'</svg>';
  }

  // Mede a largura disponível e desenha o gráfico com essa largura (texto de tamanho fixo, ocupa o ecrã todo).
  function drawInto(hostId, series, months, vazio){
    var host=el(hostId); if(!host) return;
    if(!series.length){ host.innerHTML='<div class="muted" style="padding:30px 0;text-align:center;">'+vazio+'</div>'; return; }
    host.innerHTML=lineChartSVG(series, months, Math.floor(host.clientWidth||720));
  }
  function drawEvo(series, months){
    drawInto("evoHost", series, months, "Escolha uma ou mais categorias abaixo para ver a evolução.");
  }
  // Património líquido no fim de cada mês: soma de tudo o que aconteceu até lá,
  // em todas as contas (incluindo as de acompanhamento e os cartões).
  function netWorthSeries(months){
    var porMes={};
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i], mm=monthOf(t.date);
      porMes[mm]=(porMes[mm]||0)+((t.inflow||0)-(t.outflow||0));
    }
    var chaves=Object.keys(porMes).sort();
    var vals=[], acumulado=0, ci=0;
    for(var j=0;j<months.length;j++){
      while(ci<chaves.length && chaves[ci]<=months[j]){ acumulado+=porMes[chaves[ci]]; ci++; }
      vals.push(round2(acumulado));
    }
    return vals;
  }

  function renderReports() {
    var m = state.ui.month;

    // ---------- Período: comanda TODOS os blocos deste ecrã ----------
    var nMonths = state.ui.reportMonths || 6;
    var customPer = !!(state.ui.reportFrom && state.ui.reportTo && state.ui.reportFrom<=state.ui.reportTo);
    var meses = [];
    if (customPer) { var cur=state.ui.reportFrom, g=0; while(cur<=state.ui.reportTo && g<60){ meses.push(cur); cur=shiftMonth(cur,1); g++; } }
    else { for (var em=nMonths-1; em>=0; em--) meses.push(shiftMonth(m,-em)); }
    if (!meses.length) meses = [m];
    var noPeriodo = {}; meses.forEach(function(k){ noPeriodo[k]=true; });
    var etiqueta = meses.length===1 ? monthLabel(meses[0]) : (monthLabel(meses[0])+" a "+monthLabel(meses[meses.length-1]));

    // ---------- Uma passagem pelas transações do período ----------
    var totalIn=0, totalOut=0, spend={}, porMes={};
    meses.forEach(function(k){ porMes[k]={inc:0,out:0}; });
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i], mm = monthOf(t.date);
      if (!noPeriodo[mm]) continue;
      if (t.transfer && !t.categoryId) continue;          // transferência interna não é despesa nem receita
      if (t.categoryId === INCOME) { totalIn += (t.inflow||0); porMes[mm].inc += (t.inflow||0); continue; }
      if (t.outflow) {
        var nome = t.categoryId ? ((lkCat(t.categoryId)||{name:"(apagada)"}).name) : "Sem categoria";
        spend[nome] = (spend[nome]||0) + t.outflow;
        totalOut += t.outflow; porMes[mm].out += t.outflow;
      }
    }
    var net = round2(totalIn - totalOut);

    var repPer = [1,3,6,12,24].map(function(nn){
      return '<button data-action="report-months" data-id="'+nn+'" class="'+((!customPer&&nMonths===nn)?'active':'')+'">'+nn+'<span class="rot"> '+(nn===1?'mês':'meses')+'</span><span class="so-fone">m</span></button>';
    }).join("");
    var blocoPeriodo = '<div class="report-block" style="padding:14px 18px;margin-bottom:18px;">'+
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">'+
        '<span style="font-weight:700;font-size:13px;">Período</span>'+
        '<div class="seg" style="flex:1;min-width:220px;max-width:340px;">'+repPer+'</div>'+
        '<span class="muted hide-phone" style="font-size:12.5px;">ou</span>'+
        '<input class="filter hide-phone" id="repFrom" type="month" value="'+esc(state.ui.reportFrom||"")+'">'+
        '<span class="muted hide-phone" style="font-size:12.5px;">até</span>'+
        '<input class="filter hide-phone" id="repTo" type="month" value="'+esc(state.ui.reportTo||"")+'">'+
        (customPer?'<button class="btn sm" data-action="report-clear-range">Limpar</button>':'')+
      '</div>'+
      // O período em texto fica em linha própria: na barra dos botões encavalitava-se neles.
      '<div class="hint" style="margin-top:10px;"><b style="color:var(--text);font-size:13px;">'+etiqueta+'</b>'+
        ' — é este o período usado nos totais, na despesa por categoria e nos gráficos.</div>'+
    '</div>';

    // ---------- Despesa por categoria ----------
    var arr = Object.keys(spend).map(function(k){return {name:k,val:spend[k]};}).sort(function(a,b){return b.val-a.val;});
    var maxV = arr.length ? arr[0].val : 1;
    var bars = arr.length ? arr.map(function(x){
      return '<div class="bar-row"><div class="b-name" title="'+esc(x.name)+'">'+esc(x.name)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(2,(x.val/maxV)*100)+'%"></div></div>'+
        '<div class="bar-val">'+fmt(x.val)+'</div></div>';
    }).join("") : '<div class="muted" style="padding:8px 0;">Sem despesas registadas neste período.</div>';

    // ---------- Rendimento vs Despesa, mês a mês, com os valores nas barras ----------
    var maxBar = 1;
    meses.forEach(function(k){ maxBar = Math.max(maxBar, porMes[k].inc, porMes[k].out); });
    var trend = meses.map(function(k){
      var d = porMes[k], p = k.split("-");
      var lab = MONTHS_PT[parseInt(p[1],10)-1].slice(0,3)+" "+p[0].slice(2);
      return '<div class="bar-row" style="grid-template-columns:74px 1fr 1fr;">'+
        '<div class="b-name">'+lab+'</div>'+
        '<div class="bar-track" title="Rendimento"><div class="bar-fill" style="width:'+(d.inc/maxBar*100)+'%;background:linear-gradient(90deg,var(--positive),#4ade80);"></div>'+
          (d.inc>0.005?'<span class="bar-num">'+fmt(d.inc)+'</span>':'')+'</div>'+
        '<div class="bar-track" title="Despesa"><div class="bar-fill" style="width:'+(d.out/maxBar*100)+'%;background:linear-gradient(90deg,#dc2626,#f87171);"></div>'+
          (d.out>0.005?'<span class="bar-num">'+fmt(d.out)+'</span>':'')+'</div>'+
        '</div>';
    }).join("");

    // ---------- Evolução por categoria ----------
    if (state.ui.reportCats === undefined) {
      var _tot={}; for (var _i=0;_i<state.transactions.length;_i++){ var _t=state.transactions[_i]; if(_t.outflow&&_t.categoryId){ _tot[_t.categoryId]=(_tot[_t.categoryId]||0)+_t.outflow; } }
      state.ui.reportCats = Object.keys(_tot).filter(function(id){var c=categoryById(id); return c&&!c.cardId;}).sort(function(a,b){return _tot[b]-_tot[a];}).slice(0,2);
    }
    var mode = state.ui.reportMode || "gasto";
    var monthIdx={}; meses.forEach(function(mm2,ix){ monthIdx[mm2]=ix; });
    var selCats = (state.ui.reportCats||[]).filter(function(id){ var c=categoryById(id); return c && !c.cardId; });
    var valById={}; selCats.forEach(function(id){ valById[id]=meses.map(function(mm2){ return mode==="atribuido" ? assignedFor(id, mm2) : 0; }); });
    if (mode !== "atribuido") {
      for (var si=0; si<state.transactions.length; si++){ var stx=state.transactions[si]; if(!stx.outflow||!stx.categoryId) continue; if(valById[stx.categoryId]===undefined) continue; var ix=monthIdx[monthOf(stx.date)]; if(ix===undefined) continue; valById[stx.categoryId][ix]+=stx.outflow; }
    }
    var evoSeries = selCats.map(function(id,ix){ return {catId:id, name:(categoryById(id)||{name:""}).name, color:REPORT_COLORS[ix%REPORT_COLORS.length], values:valById[id].map(function(v){return round2(v);})}; });
    var allRepCats = state.categories.filter(function(c){ return !c.cardId && !c.hidden; });
    var repChips = allRepCats.map(function(c){ var sIx=selCats.indexOf(c.id); var act=sIx>=0; var col=act?REPORT_COLORS[sIx%REPORT_COLORS.length]:null; return '<button class="rep-chip'+(act?' active':'')+'" data-action="report-toggle-cat" data-id="'+c.id+'"'+(act?' style="background:'+col+';border-color:'+col+';color:#fff"':'')+'>'+esc(c.name)+'</button>'; }).join("");
    var repMode = '<button data-action="report-mode" data-id="gasto" class="'+(mode!=="atribuido"?'active':'')+'">Gasto</button><button data-action="report-mode" data-id="atribuido" class="'+(mode==="atribuido"?'active':'')+'">Atribuído</button>';
    var evoBlock = '<div class="report-block"><h3>📈 Evolução por categoria</h3>'+
      '<div class="seg" style="max-width:260px;margin-bottom:12px;">'+repMode+'</div>'+
      '<div id="evoHost" class="evo-host"></div>'+
      (allRepCats.length ? '<div class="rep-chips" style="margin-top:16px;">'+repChips+'</div>' : '<div class="muted" style="margin-top:12px;">Ainda não há categorias.</div>')+
    '</div>';

    // ---------- Património líquido ----------
    var pnVals = netWorthSeries(meses);
    var pnDelta = round2(pnVals[pnVals.length-1] - pnVals[0]);
    var pnBlock = '<div class="report-block"><h3>💰 Evolução do património líquido</h3>'+
      '<div class="hint" style="margin:-8px 0 12px;">Tudo o que tem, menos tudo o que deve, no fim de cada mês.'+
      (meses.length>1 ? (' Variação no período: <b class="'+(pnDelta>=0?"tx-amt in":"tx-amt out")+'">'+(pnDelta>=0?"+":"")+fmt(pnDelta)+'</b>.') : '')+'</div>'+
      '<div id="pnHost" class="evo-host"></div></div>';

    el("content").innerHTML =
      blocoPeriodo +
      '<div class="kpi-grid">'+
        '<div class="kpi"><div class="k-label">Rendimento</div><div class="k-value pos">'+fmt(totalIn)+'</div></div>'+
        '<div class="kpi"><div class="k-label">Despesa</div><div class="k-value neg">'+fmt(totalOut)+'</div></div>'+
        '<div class="kpi"><div class="k-label">Resultado</div><div class="k-value '+(net>=0?"pos":"neg")+'">'+fmt(net)+'</div></div>'+
        '<div class="kpi"><div class="k-label">Património no fim</div><div class="k-value">'+fmt(pnVals[pnVals.length-1])+'</div></div>'+
      '</div>'+
      '<div class="report-block"><h3>Despesa por categoria</h3>'+bars+'</div>'+
      '<div class="report-block"><h3>Rendimento (verde) vs Despesa (vermelho)</h3>'+trend+'</div>'+
      evoBlock + pnBlock;
    drawEvo(evoSeries, meses);
    drawInto("pnHost", [{ name:"Património líquido", color:REPORT_COLORS[0], values:pnVals }], meses, "Sem dados no período escolhido.");
  }

  function renderRecurring(){

      el("content").innerHTML=head+emptyState("📅","Sem transações recorrentes",
        "Crie regras para lançar automaticamente o que se repete — renda, salário, subscrições. Aparecem sozinhas na data marcada.",
        '<button class="btn primary" data-action="add-recurring">➕ Nova recorrente</button>');

    var rows=list.map(function(r){

      var cat=ehTr

        : (r.categoryId===INCOME?'<span class="pill budget">Rendimento</span>':(r.categoryId?esc((categoryById(r.categoryId)||{name:"(apagada)"}).name):'<span class="muted">—</span>'));

        '<td style="white-space:nowrap;font-weight:600;">'+fmtDate(r.nextDate)+'</td>'+
        '<td><span class="pill tracking">'+(FREQ_LABEL[r.freq]||r.freq)+'</span></td>'+
        '<td style="font-weight:600;">'+(ehTr?('↔ '+esc(dest?dest.name:"—")):esc(r.payee||""))+'</td>'+
        '<td>'+cat+'</td>'+
        '<td class="tag">'+esc(acc?acc.name:"—")+'</td>'+
        '<td class="num">'+amt+'</td>'+
        '<td style="text-align:center;"><span class="cleared-dot '+(r.active?'on':'')+'" data-action="toggle-recurring" data-id="'+r.id+'" title="Ativar / desativar">✓</span></td>'+
        '<td class="row-actions">'+
          '<button data-action="post-recurring-now" data-id="'+r.id+'" title="Lançar já a próxima">▶</button>'+
          '<button data-action="delete-recurring" data-id="'+r.id+'" title="Eliminar">🗑</button></td></tr>';
    }).join("");
    el("content").innerHTML=head+'<div class="data-card"><table class="data"><thead><tr>'+
      '<th>Próxima data</th><th>Frequência</th><th>Beneficiário</th><th>Categoria</th><th>Conta</th><th class="num">Valor</th><th style="text-align:center;">Ativa</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  // Opções de categoria com o saldo disponível entre parênteses (referente ao mês em vista no orçamento).

  var STATUS_MARCA = { ok:"🟢", warn:"🟡", neg:"🔴", none:"⚪" };

  function optCat(cat, m, selId){
    var st = catStatus(cat, m);
    return '<option value="'+cat.id+'"'+(selId===cat.id?" selected":"")+' style="color:'+STATUS_COR[st]+'">'+
      STATUS_MARCA[st]+' '+esc(cat.name)+' ('+fmt(availableFor(cat.id, m))+')</option>';
  }
  function catOptionsHTML(selId){
    var m = state.ui.month;

            '<option value="'+INCOME+'"'+(selId===INCOME?" selected":"")+'>💵 Rendimento (Pronto a atribuir: '+fmt(readyToAssign(m))+')</option>';

      o += '<optgroup label="'+esc(state.groups[g].name)+'">';

    ["txAcc","txCat","txOut","txIn"].forEach(function(f){
      var n=el(f); if(!n) return;
      n.addEventListener("change", txWarn); n.addEventListener("input", txWarn);
    });
    // Sugere a categoria da última vez que usou este beneficiário — sem nunca

    function sugerirCategoria(){
      if (el("txCat").value) return;
      var c = payeeCategoria(el("txPayee").value);

    el("txPayee").addEventListener("blur", sugerirCategoria);
    el("txCat").addEventListener("change", function(){ el("txCatSug").classList.add("hidden"); });
    txWarn();
  }

        : "Ex.: o mês em que paga o IUC. Indicando-o, a aplicação reparte o que ainda falta pelos meses até lá e avança sozinha para o ano seguinte. Em branco, reserva 1/12 por mês.";

        monthly:"Quer ter este valor disponível todos os meses (ex.: renda, supermercado).",

        byDate:"Junta o valor total até ao mês indicado (ex.: férias, entrada de carro)." };
      el("catTargetHint").textContent = hints[v]||"";

    sel.addEventListener("change", syncTargetUI);
    syncTargetUI();

  function payeesModal(){

    for (var k in idx) if (idx.hasOwnProperty(k)) arr.push({ k:k, e:idx[k] });
    arr.sort(function(a,b){ return b.e.count-a.e.count || (a.e.name<b.e.name?-1:1); });

    var corpo;
    if (!arr.length) {

  function integrityModal(){
    var m=state.ui.month;
    var dv=integrityDelta(m), iss=integrityIssues(m);
    var caixa=budgetCashUpto(m), orc=budgetedTotal(m);

    var GRUPOS = [
      ["semCat",       "Movimentos sem categoria",
                       "Mexeram no saldo da conta mas não passaram por nenhuma categoria, por isso o orçamento não deu por eles."],
      ["orfa",         "Categoria apagada entretanto",
                       "A categoria destes movimentos já não existe, e o dinheiro deles ficou sem destino no orçamento."],
      ["paraFora",     "Transferências que entram ou saem do orçamento",
                       "Movem dinheiro entre uma conta de orçamento e uma de acompanhamento. Dê-lhes categoria para o orçamento acompanhar."],
      ["rendFora",     "Rendimento fora das contas de orçamento",
                       "Foram marcados como «Rendimento» numa conta que não entra no orçamento, por isso aumentaram o Pronto a atribuir sem haver dinheiro que lhe corresponda."],
      ["categFora",    "Categoria numa conta fora do orçamento",
                       "Contas de acompanhamento estão fora do orçamento. Dar-lhes categoria mexe no «Disponível» dessa categoria sem haver dinheiro do orçamento por trás."],
      ["transfCat",    "Transferências com categoria a mais",
                       "Só devem ter categoria as transferências que atravessam a fronteira do orçamento. Estas têm-na sem a atravessar, e por isso contam o movimento duas vezes."],
      ["transfCartao", "Transferências entre cartão e conta de acompanhamento",
                       "Mexem na reserva para a fatura do cartão sem que saia dinheiro do orçamento. Registe o pagamento do cartão a partir de uma conta de orçamento."],
      ["meia",         "Transferências a que falta a outra metade",
                       "Só existe um dos dois lados — normalmente de dados importados de um ficheiro alterado à mão."]
    ];

    function linha(x){
      var accao = (x.motivo==="paraFora" || x.motivo==="transfCat")
        ? '<button class="btn sm" data-action="fix-transfer" data-id="'+x.t.id+'">Categorizar</button>'
        : '<button class="btn sm" data-action="edit-tx" data-id="'+x.t.id+'">Corrigir</button>';
      var onde = x.outra ? ("para "+esc(x.outra.name)) : esc(x.acc.name);
      return '<div class="int-row"><span class="who"><b>'+esc(x.t.payee||"(sem beneficiário)")+'</b>'+
        '<span class="tag">'+fmtDate(x.t.date)+' · '+esc(x.acc.name)+(x.outra?(' → '+esc(x.outra.name)):'')+'</span></span>'+
        '<span class="amt '+(x.delta<0?"tx-amt out":"tx-amt in")+'">'+fmt(x.delta)+'</span>'+
        accao+'</div>';
    }

    var corpo =
      '<div class="field" style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;">'+
        '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Dinheiro nas contas de orçamento</span><b style="font-variant-numeric:tabular-nums;">'+fmt(caixa)+'</b></div>'+
        '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Pronto a atribuir + Disponível das categorias</span><b style="font-variant-numeric:tabular-nums;">'+fmt(orc)+'</b></div>'+
        '<div style="display:flex;justify-content:space-between;padding:7px 0 0;margin-top:5px;border-top:1px solid var(--border);font-weight:700;">'+
          '<span>Diferença</span><b class="'+(dv<0?"tx-amt out":"tx-amt in")+'" style="font-variant-numeric:tabular-nums;">'+fmt(dv)+'</b></div>'+
      '</div>';

    if (!iss.itens.length && Math.abs(dv) < 0.005) {
      corpo += '<div class="muted" style="text-align:center;padding:18px 0;">✅ Está tudo certo — cada euro nas contas de orçamento tem uma função.</div>';
    } else {
      GRUPOS.forEach(function(g){
        var lista = iss.itens.filter(function(x){ return x.motivo===g[0]; });
        if(!lista.length) return;
        var soma=0; lista.forEach(function(x){ soma+=x.delta; });
        corpo += '<div class="field"><label>'+g[1]+' ('+lista.length+' · '+fmt(round2(soma))+')</label>'+
          '<div class="hint" style="margin:-2px 0 8px;">'+g[2]+'</div>'+
          '<div style="max-height:210px;overflow:auto;">'+lista.map(linha).join("")+'</div></div>';
      });
      var explicado=0; iss.itens.forEach(function(x){ explicado+=x.delta; });
      var resto=round2(dv-explicado);
      if (Math.abs(resto) >= 0.005) {
        corpo += '<div class="hint" style="color:var(--negative);font-weight:600;">Faltam '+fmt(resto)+
          ' que os movimentos acima não explicam. Exporte uma cópia de segurança antes de mexer.</div>';
      }
    }

    if (iss.cartaoSemCat > 0) {
      corpo += '<div class="hint" style="border-top:1px solid var(--border);padding-top:10px;">ℹ️ Há ainda <b>'+iss.cartaoSemCat+
        '</b> movimento(s) no cartão de crédito sem categoria. Não desequilibram o orçamento, mas também não reservam dinheiro para a fatura.</div>';
    }

    openModal(
      '<div class="modal-head"><h2>🔍 Orçamento vs. contas — '+monthLabel(m)+'</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        '<p class="muted" style="margin-top:0;">Num orçamento base-zero, o dinheiro nas contas de orçamento tem de ser exatamente igual ao que está por atribuir mais o disponível de todas as categorias. Quando não bate, é porque houve movimentos que o orçamento não conseguiu acompanhar.</p>'+
        corpo+
      '</div>'+
      '<div class="modal-foot"><span></span><button class="btn primary" data-action="close">Fechar</button></div>');
  }

  function fundModal() {
    var m = state.ui.month;
    var mode = state.ui._fundMode || "full";
    var strat = state.ui.fundStrategy || "priority";   // só para marcar a opção escolhida no menu
    var plan = fundingPlan(mode, m, strat);
    var fullPlan = fundingPlan("full", m, strat);
    var anyNeed = fullPlan.entries.length>0;
    var after = plan.rtaAfter;
    var afterCls = after < -0.005 ? "neg" : (after>0.005 ? "pos" : "");
    var afterMsg = after < -0.005 ? ("⚠️ Ficaria negativo em "+fmt(after)+" — não tem dinheiro para cobrir todos os alvos.")
                 : (after>0.005 ? ("Sobrariam "+fmt(after)+" por atribuir.") : "Ficaria exatamente a zero. 🎯");
    var rows;
    if (plan.entries.length) rows = plan.entries.map(function(e){
      var pl = (e.prio && e.prio!=="normal") ? ' <span class="tag">('+PRIO_LABEL[e.prio]+')</span>' : '';
      return '<div style="display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--border);"><span>'+esc(e.name)+pl+'</span><b style="font-variant-numeric:tabular-nums;">+'+fmt(e.add)+'</b></div>';
    }).join("");
    else if (anyNeed && mode==="cap") rows = '<div class="muted" style="padding:14px 0;text-align:center;">Sem dinheiro disponível para financiar (o Pronto a atribuir está a zero ou negativo).</div>';
    else rows = '<div class="muted" style="padding:14px 0;text-align:center;">Não há alvos por financiar este mês. 🎉</div>';
    var undoBtn = (state.ui.lastFunding && state.ui.lastFunding.month===m) ? '<button class="btn" data-action="undo-funding">↩ Reverter último</button>' : '<span></span>';
    openModal(
      '<div class="modal-head"><h2>🎯 Financiar alvos — '+monthLabel(m)+'</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        '<div class="seg" id="fundMode" style="margin-bottom:10px;">'+
          '<button data-m="full" class="'+(mode==="full"?"active":"")+'">Financiar tudo</button>'+
          '<button data-m="cap" class="'+(mode==="cap"?"active":"")+'">Repartir o que está por atribuir</button>'+
        '</div>'+
        (mode==="cap" ?
          '<div class="field" style="margin-bottom:12px;"><label>Como repartir o dinheiro disponível</label>'+
          '<select id="fundStrat">'+
            '<option value="priority"'+(strat==="priority"?" selected":"")+'>Por prioridade — serve primeiro as Altas, depois as Normais, depois as Baixas</option>'+
            '<option value="prop"'+(strat==="prop"?" selected":"")+'>Proporcional — todas ficam igualmente perto do alvo (quem precisa mais, leva mais)</option>'+
            '<option value="order"'+(strat==="order"?" selected":"")+'>Pela ordem da lista — completa de cima para baixo até acabar o dinheiro</option>'+
          '</select><div class="hint">A prioridade define-se em cada categoria (lápis ✎).</div></div>' : '')+
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;text-align:center;">'+
          '<div class="kpi" style="padding:12px 8px;"><div class="k-label">Disponível</div><div class="k-value" style="font-size:17px;">'+fmt(plan.rtaBefore)+'</div></div>'+
          '<div class="kpi" style="padding:12px 8px;"><div class="k-label">A atribuir</div><div class="k-value" style="font-size:17px;">'+fmt(plan.total)+'</div></div>'+
          '<div class="kpi" style="padding:12px 8px;"><div class="k-label">Depois</div><div class="k-value '+afterCls+'" style="font-size:17px;">'+fmt(after)+'</div></div>'+
        '</div>'+
        '<div class="hint" style="margin-bottom:12px;">'+afterMsg+'</div>'+
        '<div style="max-height:220px;overflow:auto;">'+rows+'</div>'+
      '</div>'+
      '<div class="modal-foot">'+undoBtn+
        '<span><button class="btn" data-action="close">Cancelar</button> '+
        (plan.entries.length?'<button class="btn primary" data-action="apply-funding">Confirmar financiamento</button>':'')+'</span></div>');
    var seg=el("fundMode");

  // Serve para criar E para editar. Em edição trabalha sempre sobre o PAR: as duas metades
  // são reescritas ao mesmo tempo, por isso não há maneira de ficarem dessincronizadas.
  function transferModal(preset){
    preset=preset||{};
    if(state.accounts.length<2){ toast("Precisa de pelo menos duas contas para transferir."); return; }
    var editPair=preset.editPair||null, saida=null, entrada=null;
    if(editPair){
      var metades=state.transactions.filter(function(x){ return x.transfer===editPair; });
      if(metades.length!==2){ toast("Esta transferência está incompleta — elimine-a e crie outra."); return; }
      saida   = (metades[0].outflow||0)>0.005 ? metades[0] : metades[1];
      entrada = saida===metades[0] ? metades[1] : metades[0];
      if(!((saida.outflow||0)>0.005 && (entrada.inflow||0)>0.005)){ toast("Esta transferência tem valores estranhos — elimine-a e crie outra."); return; }
    }
    var payCard=!!preset.payCard;
    var fromId=editPair?saida.accountId:(preset.from||"");
    if(!fromId){ for(var i=0;i<state.accounts.length;i++){ if(state.accounts[i].type==="budget"){ fromId=state.accounts[i].id; break; } } if(!fromId) fromId=state.accounts[0].id; }
    var toId=editPair?entrada.accountId:(preset.to||"");
    if(!toId){ for(var j=0;j<state.accounts.length;j++){ var cj=state.accounts[j];
      if(cj.id===fromId || cj.hidden) continue;
      if(payCard && cj.type==="budget") continue;         // no pagamento, o destino é sempre uma dívida
      toId=cj.id; break; } }
    function opts(sel, filtro){
      return state.accounts.filter(function(a){
        if(a.id===sel) return true;                       // a escolhida aparece sempre
        if(a.hidden) return false;
        return !filtro || filtro(a);
      }).map(function(a){ return '<option value="'+a.id+'"'+(sel===a.id?" selected":"")+'>'+esc(a.name)+' ('+fmt(accountBalance(a.id))+')</option>'; }).join("");
    }
    // A pagar um cartão só faz sentido pagar A PARTIR de uma conta de orçamento e PARA uma dívida.
    var soOrcamento = payCard ? function(a){ return a.type==="budget"; } : null;
    var soDivida    = payCard ? function(a){ return a.type!=="budget"; } : null;
    var amtDefault = editPair ? round2(saida.outflow) : ((preset.amount!=null && preset.amount!=="")?round2(preset.amount):"");
    var dateDefault = editPair ? saida.date : todayISO();
    var clDefault = editPair ? (!!saida.cleared && !!entrada.cleared) : true;
    var memoDefault = editPair ? (saida.memo||entrada.memo||"") : "";
    var catDefault = editPair ? (saida.categoryId||entrada.categoryId||"") : "";
    var titulo = editPair ? "✎ Editar transferência" : (payCard?"💳 Pagar cartão / dívida":"↔ Transferir entre contas");
    openModal(
      '<div class="modal-head"><h2>'+titulo+'</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        '<div class="field"><label>'+(payCard?"Pagar a partir de":"De (sai desta conta)")+'</label><select id="tfFrom">'+opts(fromId, soOrcamento)+'</select></div>'+
        '<div class="field"><label>'+(payCard?"Cartão / dívida a pagar":"Para (entra nesta conta)")+'</label><select id="tfTo">'+opts(toId, soDivida)+'</select></div>'+
        '<div class="field hidden" id="tfCatField"><label id="tfCatLabel">Categoria</label><select id="tfCat">'+catOptionsHTML(catDefault)+'</select>'+
          '<div class="hint" id="tfCatHint"></div></div>'+
        '<div class="grid-2">'+
          '<div class="field"><label>Valor</label><input id="tfAmt" class="money" maxlength="13" type="text" inputmode="decimal" value="'+amtStr(amtDefault)+'" placeholder="0,00"></div>'+
          '<div class="field"><label>Data</label><input id="tfDate" type="date" value="'+esc(dateDefault)+'"></div>'+
        '</div>'+
        '<div class="field"><label>Nota (opcional)</label><input id="tfMemo" maxlength="300" value="'+esc(memoDefault)+'"></div>'+
        '<label style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer;"><input type="checkbox" id="tfClear" '+(clDefault?"checked":"")+' style="width:auto;"> Confirmada nas duas contas</label>'+
        '<div class="hint" style="margin-top:8px;">'+(editPair
          ? 'As duas metades são guardadas em conjunto — valor, data e contas ficam sempre a condizer. Na lista, o <b>✓</b> de cada linha continua a permitir confirmar um lado de cada vez.'
          : 'Uma transferência move dinheiro entre contas. Só leva categoria quando entra ou sai do orçamento (contas de acompanhamento).')+'</div>'+
      '</div>'+
      '<div class="modal-foot">'+
        (editPair?'<button class="btn danger" data-action="delete-tx" data-id="'+saida.id+'">Eliminar</button>':'<span></span>')+
        '<span><button class="btn" data-action="close">Cancelar</button> '+
        (editPair?'<button class="btn primary" data-action="save-transfer" data-id="'+editPair+'">Guardar</button>'
                 :'<button class="btn primary" data-action="do-transfer">'+(payCard?"Pagar":"Transferir")+'</button>')+
        '</span></div>');
    function tfSync(){
      var f=lkAcc(el("tfFrom").value), t=lkAcc(el("tfTo").value);
      var cruza = !!(f && t && crossesBudget(f,t));
      el("tfCatField").classList.toggle("hidden", !cruza);

      var sai = f.type==="budget";
      el("tfCatLabel").textContent = sai ? "Categoria de onde sai o dinheiro" : "Categoria onde entra o dinheiro";
      el("tfCatHint").textContent = sai

      if(!sai && !el("tfCat").value) el("tfCat").value = INCOME;
    }
    el("tfFrom").addEventListener("change", tfSync);
    el("tfTo").addEventListener("change", tfSync);
    tfSync();
  }

  // Reconstrói a repartição a partir das partes já gravadas, para se poder editar o conjunto.
  function splitFromParts(pairId){
    var partes=state.transactions.filter(function(t){ return t.split===pairId; });
    if(!partes.length) return null;
    var dir = partes.some(function(p){ return (p.inflow||0)>0.005; }) ? "in" : "out";
    return {
      editSplit: pairId,
      anyId: partes[0].id,
      date: partes[0].date,
      accountId: partes[0].accountId,
      payee: partes[0].payee||"",
      memo: partes[0].memo||"",
      cleared: partes.every(function(p){ return !!p.cleared; }),
      dir: dir,
      lines: partes.map(function(p){ return { categoryId:p.categoryId||"", amount: round2(dir==="out" ? (p.outflow||0) : (p.inflow||0)) }; })
    };
  }

  // ---------- Ações ----------
  // Aceita vírgula OU ponto como separador de cêntimos (sem separador de milhares).
  function parseAmount(s){
    if (typeof s === "number") return s;
    s = String(s==null?"":s).trim();
    if (!s) return NaN;
    var neg = s.indexOf("-") >= 0;
    s = s.replace(/[^0-9.,]/g, "");
    if (!s) return NaN;
    var di = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
    var intp, frac;
    if (di === -1) { intp = s; frac = ""; }
    else { intp = s.slice(0, di).replace(/[.,]/g, ""); frac = s.slice(di+1).replace(/[.,]/g, ""); }
    var v = parseFloat((intp || "0") + (frac ? ("." + frac) : ""));
    if (isNaN(v)) return NaN;
    // Fora de escala conta como inválido. Este é o único sítio por onde passam TODOS os
    // valores (formulários e importação de CSV) — sem isto, um número absurdo vindo de um
    // ficheiro tornava-se Infinity e envenenava todas as somas do orçamento.
    if (!isFinite(v) || v > MAX_VALOR) return NaN;
    return neg ? -v : v;
  }
  function amtStr(n){ if (n===""||n===null||n===undefined||n===0) return ""; return String(n).replace(".", ","); }

  // ---------- Limites do que pode entrar ----------
  // Tudo o que se escreve vai parar ao armazenamento do navegador (~5 MB), ao ficheiro de
  // cópia e ao gist. Sem tecto, um texto colado por engano ou um ficheiro enorme enchem tudo.
  var LIM_NOME = 60, LIM_PAYEE = 100, LIM_NOTA = 300, LIM_TOKEN = 255;
  var MAX_VALOR = 1e12;                    // chega para qualquer orçamento pessoal
  var MAX_FICH_JSON = 20*1024*1024;        // 20 MB
  var MAX_FICH_CSV  = 10*1024*1024;        // 10 MB
  var MAX_LINHAS_CSV = 20000;
  function corta(s, n){ s=String(s==null?"":s).trim(); return s.length>n ? s.slice(0,n) : s; }

  // ---------- Campos de valor ----------
  // Deixa passar apenas dígitos e UM separador decimal, com 9 inteiros e 2 decimais no máximo.
  // Havendo vários separadores, o último é o decimal e os anteriores eram de milhares — assim
  // colar «1.234,56» do banco dá 1234,56 em vez de estragar o número.
  var LIM_INT = 9, LIM_DEC = 2;
  function limpaValor(txt, permiteNegativo){
    var s = String(txt==null?"":txt);
    var neg = permiteNegativo && s.indexOf("-") >= 0;
    s = s.replace(/[^0-9.,]/g, "");
    var ult = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
    var intp, frac = null, sep = ",";
    if (ult < 0) { intp = s; }
    else { sep = s.charAt(ult); intp = s.slice(0, ult).replace(/[.,]/g, ""); frac = s.slice(ult+1).replace(/[.,]/g, ""); }
    intp = intp.slice(0, LIM_INT);
    if (frac !== null) frac = frac.slice(0, LIM_DEC);
    return (neg?"-":"") + intp + (frac===null ? "" : sep+frac);
  }
  function mb(bytes){ return (bytes/1048576).toFixed(1).replace(".", ",")+" MB"; }

  function num(id) {
    var bruto = el(id).value, v = parseAmount(bruto);
    if (isNaN(v)) {
      if (/\d/.test(bruto)) toast("Valor inválido ou demasiado grande — confirme o que escreveu.");
      return 0;
    }
    return round2(v);
  }
  function val(id) { return el(id).value.trim(); }
  function valLim(id, n) { return corta(el(id).value, n); }

    "delete-account": function(id){
      var a = accountById(id); if(!a) return;
      // Uma transferência tem uma metade em cada conta. Apagar só a metade desta conta
      // deixaria a outra órfã; apagar as duas mudaria o saldo de uma conta que fica.
      // A saída certa é a outra metade sobreviver como movimento normal.
      var paresTocados = {}, nOutras = 0, i, t;
      for (i=0;i<state.transactions.length;i++){ t=state.transactions[i]; if(t.transfer && t.accountId===id) paresTocados[t.transfer]=true; }
      for (i=0;i<state.transactions.length;i++){ t=state.transactions[i]; if(t.transfer && paresTocados[t.transfer] && t.accountId!==id) nOutras++; }
      var aviso = "Eliminar a conta «"+a.name+"» e todas as suas transações?";
      if (nOutras) aviso += "\n\n"+nOutras+" transferência"+(nOutras===1?"":"s")+" ligava"+(nOutras===1?"":"m")+
        " esta conta a outras. A outra metade fica onde está, como movimento normal — o saldo dessas contas não muda, mas pode precisar de lhe dar categoria.";
      if (!confirm(aviso)) return;
      pushUndo("Conta «"+a.name+"» eliminada.");
      if (a.paymentCatId) removePaymentCategory(a);
      state.accounts = state.accounts.filter(function(x){return x.id!==id;});
      state.transactions = state.transactions.filter(function(x){return x.accountId!==id;});
      for (i=0;i<state.transactions.length;i++){ t=state.transactions[i]; if(t.transfer && paresTocados[t.transfer]) delete t.transfer; }
      // regras recorrentes que usavam esta conta como origem OU como destino
      state.recurring = (state.recurring||[]).filter(function(r){ return r.accountId!==id && r.toAccountId!==id; });
      if (state.ui.openAccount===id) state.ui.openAccount=null;
      closeModal(); save(); render(); showUndo();
    },

    "delete-tx": function(id){

      pushUndo("Transação eliminada.");

      else if(t&&t.split){ var sp=t.split; state.transactions=state.transactions.filter(function(x){return x.split!==sp;}); }

    "duplicate-tx": function(id){
      var t=txById(id); if(!t) return;
      function copyOf(src, extra){ var c=JSON.parse(JSON.stringify(src)); c.id=uid(); c.cleared=false; if(extra) for(var k in extra) c[k]=extra[k]; return c; }
      pushUndo("Transação duplicada.");
      var msg="Transação duplicada (por confirmar).";
      if (t.transfer) {
        var np=uid(), halves=state.transactions.filter(function(x){return x.transfer===t.transfer;});
        halves.forEach(function(h){ state.transactions.push(copyOf(h,{transfer:np})); });
        msg="Transferência duplicada (por confirmar).";
      } else if (t.split) {
        var ns=uid(), parts=state.transactions.filter(function(x){return x.split===t.split;});
        parts.forEach(function(p){ state.transactions.push(copyOf(p,{split:ns})); });
        msg="Transação dividida duplicada ("+parts.length+" partes, por confirmar).";
      } else {
        state.transactions.push(copyOf(t));
      }
      save(); render(); toast(msg); showUndo();
    },

    "split-dir": function(id){ readSplit(); _split.dir=(id==="in"?"in":"out"); splitModal(); },
    "save-split": function(){
      readSplit(); var s=_split;
      if(!s.accountId){ toast("Selecione uma conta."); return; }
      var lines=s.lines.filter(function(l){ return typeof l.amount==="number" && l.amount>0; });
      if(!lines.length){ toast("Indique pelo menos uma categoria com valor."); return; }
      for(var i=0;i<lines.length;i++){ if(!lines[i].categoryId){ toast("Escolha a categoria em todas as linhas com valor."); return; } }
      var editando=s.editSplit||null;
      if(editando){
        pushUndo("Transação dividida alterada.");
        // Fora as partes antigas, dentro as novas — em bloco, para o total nunca ficar a meio.
        state.transactions=state.transactions.filter(function(x){ return x.split!==editando; });
      }
      var pair = lines.length>1 ? (editando||uid()) : null;
      lines.forEach(function(l){ state.transactions.push({ id:uid(), date:s.date||todayISO(), accountId:s.accountId, payee:s.payee, categoryId:l.categoryId, memo:s.memo,
        outflow: s.dir==="out"?round2(l.amount):0, inflow: s.dir==="in"?round2(l.amount):0, cleared:s.cleared, split:pair }); });
      _split=null; closeModal(); save(); render();
      if(editando){
        toast(pair ? ("Transação dividida alterada — "+lines.length+" categorias.") : "Ficou com uma categoria só — já não é uma transação dividida.");
        showUndo();
      } else {
        toast(pair ? ("Transação dividida em "+lines.length+" categorias.") : "Transação registada.");
      }
    },

  // ---------- Importar / Exportar ----------
  // ---------- Estado da cópia de segurança em ficheiro ----------
  // Assinatura barata dos dados: contagens + somas. Deteta acrescentos, remoções e alterações de valores.
  function backupSig(){
    var st;
    if (_idx && typeof _idx.sumAll === "number") { st = _idx.sumAll; }   // reaproveita o varrimento do render
    else { st=0; for(var i=0;i<state.transactions.length;i++){ var t=state.transactions[i]; st+=(t.inflow||0)-(t.outflow||0); } }
    var sa=0, ka=0; for(var k in state.assignments){ if(state.assignments.hasOwnProperty(k)){ sa+=state.assignments[k]; ka++; } }
    return [state.accounts.length, state.groups.length, state.categories.length, state.transactions.length,
            ka, (state.recurring||[]).length, round2(st), round2(sa)].join("/");
  }
  function backupPending(){
    if(!state.transactions.length && !state.categories.length) return false;
    var b=state.backup||{};
    return !b.at || b.sig!==backupSig();
  }
  function daysSinceBackup(){
    var b=state.backup||{};
    if(!b.at) return null;
    var diff=(new Date().getTime()-new Date(b.at).getTime())/86400000;
    return Math.floor(diff);
  }
  function markBackupDone(){
    state.backup = state.backup || {};
    state.backup.at = new Date().toISOString();
    state.backup.sig = backupSig();
  }
  var _backupBarDismissed=false;
  function maybeShowBackupReminder(){
    if(_backupBarDismissed) return;
    var b=el("backupBar"); if(!b) return;
    if(!backupPending()){ b.classList.remove("show"); return; }
    var d=daysSinceBackup();
    if(d!==null && d<3) { b.classList.remove("show"); return; }   // só avisa a partir de 3 dias
    el("backupText").textContent = (d===null)
      ? "Ainda não guardou nenhuma cópia de segurança em ficheiro."
      : ("A última cópia de segurança tem "+d+" dia"+(d===1?"":"s")+" e há alterações por guardar.");
    b.classList.add("show");
  }
  function hideBackupBar(){ var b=el("backupBar"); if(b) b.classList.remove("show"); }

  // ---------- Instantâneos diários (dentro da aplicação, últimos 5 dias) ----------
  // Guardados numa chave separada do localStorage — não sincronizam nem incham o gist.
  // Servem de "máquina do tempo" para reverter enganos. Funciona igual no iPhone e no PC,
  // porque NÃO transfere ficheiros (evita o download que o iOS bloqueia em silêncio).
  var SNAP_KEY = "meu-orcamento-snaps-v1";
  var SNAP_MAX = 5;
  function loadSnaps(){ try { return JSON.parse(localStorage.getItem(SNAP_KEY)) || []; } catch(e){ return []; } }
  function saveSnaps(arr){
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(arr)); return true; }
    catch(e){ // sem espaço: descarta os mais antigos e tenta de novo
      while(arr.length>1){ arr.shift(); try{ localStorage.setItem(SNAP_KEY, JSON.stringify(arr)); return true; }catch(_e){} }
      return false; }
  }
  function takeDailySnapshot(){
    if(!state.transactions.length && !state.categories.length) return;   // nada de útil para guardar
    var day = todayISO(), sig = backupSig(), snaps = loadSnaps();
    var last = snaps.length ? snaps[snaps.length-1] : null;
    if(last && last.day===day && last.sig===sig) return;                 // hoje já está guardado tal e qual
    var entry = { day:day, at:new Date().toISOString(), sig:sig, data: JSON.stringify(state) };
    if(last && last.day===day) snaps[snaps.length-1] = entry;            // substitui o de hoje
    else snaps.push(entry);                                              // ou acrescenta um dia novo
    while(snaps.length > SNAP_MAX) snaps.shift();                        // mantém só os últimos 5 dias
    saveSnaps(snaps);
  }
  function restoreSnapshot(idx){
    var snaps = loadSnaps(), s = snaps[idx]; if(!s) return;
    if(!confirm("Voltar ao orçamento tal como estava em "+fmtDate(s.day)+"?\nOs dados atuais deste aparelho são substituídos por essa versão.")) return;
    try {
      var obj = JSON.parse(s.data);
      if(!obj.accounts || !obj.transactions) throw new Error("formato");
      obj.settings = obj.settings || {locale:"pt-PT",currency:"EUR"};
      obj.collapsed = obj.collapsed || {}; obj.assignments = obj.assignments || {};
      obj.ui = { view:"budget", month: nowMonthKey() };
      state = obj; _undo=[]; hideUndo(); _idx=null; save(); closeModal(); render();
      toast("Voltou ao orçamento de "+fmtDate(s.day)+". Se sincroniza, envie para atualizar os outros aparelhos.");
    } catch(e){ toast("Esse ponto do histórico está inválido."); }
  }
  function downloadSnapshot(idx){
    var snaps = loadSnaps(), s = snaps[idx]; if(!s) return;
    guardarFicheiro("orcamento-"+s.day+".json", s.data, "application/json", function(){ toast("Histórico de "+fmtDate(s.day)+" guardado em ficheiro."); });
  }
  function snapshotsHtml(){
    var snaps = loadSnaps();
    if(!snaps.length) return '<div class="hint" style="margin-top:8px;">Ainda não há histórico guardado — aparece da próxima vez que abrir a aplicação.</div>';
    var h = '<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">';
    for(var i=snaps.length-1;i>=0;i--){ var s=snaps[i];
      h += '<div style="display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px 6px 10px;">'+
             '<span style="font-size:12.5px;font-weight:600;">'+fmtDate(s.day)+(i===snaps.length-1?' <span class="muted" style="font-weight:500;">· mais recente</span>':'')+'</span>'+
             '<span style="display:flex;gap:6px;">'+
               '<button class="btn" data-action="snap-restore" data-id="'+i+'" style="padding:5px 9px;font-size:12px;">↩ Repor</button>'+
               '<button class="btn" data-action="snap-download" data-id="'+i+'" style="padding:5px 9px;font-size:12px;" title="Descarregar este dia como ficheiro">⬇</button>'+
             '</span></div>';
    }
    return h + '</div>';
  }

  // ==========================================================================
  //  SINCRONIZAÇÃO NA NUVEM  —  gist privado do GitHub + cifra AES-GCM
  //  As credenciais (token, palavra-passe, id do gist) vivem numa chave SEPARADA
  //  do localStorage e NUNCA entram no estado que é exportado/enviado.
  //  O gist só guarda texto CIFRADO — o GitHub nunca vê os dados em claro.
  // ==========================================================================
  var SYNC_KEY = "meu-orcamento-sync-v1";
  var _sync = loadSyncCfg();
  var _syncing = false, _syncStatus = "", _pendingConflict = null, _autoTimer = null;
  var _gistPerdido = null;   // o gist configurado deixou de existir — à espera de decisão do utilizador

  function loadSyncCfg(){ try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch(e){ return {}; } }
  function saveSyncCfg(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(_sync)); } catch(e){} }
  function syncReady(){ return !!(_sync.token && _sync.pass); }
  function setSyncStatus(s){ _syncStatus = s; var e = el("syncStatus"); if (e) e.textContent = s; }

  // ---- Cifra: AES-GCM com chave derivada da palavra-passe (PBKDF2) ----
  function b64(buf){ var b = new Uint8Array(buf), s = ""; for (var i=0;i<b.length;i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function unb64(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i); return a; }
  async function gzip(u8, dir){
    var Ctor = dir === "c" ? (typeof CompressionStream!=="undefined"?CompressionStream:null)
                           : (typeof DecompressionStream!=="undefined"?DecompressionStream:null);
    if (!Ctor) return u8;
    var ab = await new Response(new Blob([u8]).stream().pipeThrough(new Ctor("gzip"))).arrayBuffer();
    return new Uint8Array(ab);
  }
  async function deriveKey(pass, salt){
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), {name:"PBKDF2"}, false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:150000, hash:"SHA-256"},
                                   km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  }
  async function encEnvelope(obj, pass){
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv   = crypto.getRandomValues(new Uint8Array(12));
    var key  = await deriveKey(pass, salt);
    var bytes = new TextEncoder().encode(JSON.stringify(obj)), z = 0;
    if (typeof CompressionStream !== "undefined") { try { bytes = await gzip(bytes,"c"); z = 1; } catch(e){ z = 0; } }
    var ct = await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, bytes);
    return { v:1, z:z, salt:b64(salt.buffer), iv:b64(iv.buffer), ct:b64(ct) };
  }
  async function decEnvelope(env, pass){
    var salt = unb64(env.salt), iv = unb64(env.iv), ct = unb64(env.ct);
    var key = await deriveKey(pass, salt);
    var pt;
    try { pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct); }
    catch(e){ throw new Error("palavra-passe errada ou dados corrompidos"); }
    var bytes = new Uint8Array(pt);
    if (env.z) bytes = await gzip(bytes,"d");
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  // ---- Ligação ao GitHub (gists) ----
  function ghHeaders(){ return { "Authorization":"Bearer "+_sync.token, "Accept":"application/vnd.github+json", "Content-Type":"application/json" }; }
  async function gistRead(){
    var res = await fetch("https://api.github.com/gists/"+_sync.gistId, { headers: ghHeaders() });
    if (!res.ok) throw new Error("leitura ("+res.status+")");
    var g = await res.json(), f = g.files && g.files["orcamento.enc.json"];
    if (!f) throw new Error("ficheiro não encontrado no gist");
    var content = f.content;
    if (f.truncated && f.raw_url) { var r2 = await fetch(f.raw_url); content = await r2.text(); }
    return JSON.parse(content);
  }
  async function gistWrite(outer){
    var res = await fetch("https://api.github.com/gists/"+_sync.gistId, { method:"PATCH", headers: ghHeaders(),
      body: JSON.stringify({ files:{ "orcamento.enc.json":{ content: JSON.stringify(outer) } } }) });
    if (!res.ok) throw new Error("escrita ("+res.status+")");
  }
  async function gistCreate(outer){
    var res = await fetch("https://api.github.com/gists", { method:"POST", headers: ghHeaders(),
      body: JSON.stringify({ description:"O Meu Orçamento (cifrado)", public:false, files:{ "orcamento.enc.json":{ content: JSON.stringify(outer) } } }) });
    if (!res.ok) throw new Error("criação ("+res.status+")");
    return (await res.json()).id;
  }

  // ---- Máquina de sincronização (deteção de conflitos, sem perda silenciosa) ----
  function localChangedSinceSync(){ return _sync.syncedSig === undefined || backupSig() !== _sync.syncedSig; }
  async function pushLocal(rev){
    var outer = { v:1, rev:rev, updatedAt:new Date().toISOString(), device:_sync.device, enc: await encEnvelope(state, _sync.pass) };
    if (_sync.gistId) await gistWrite(outer); else _sync.gistId = await gistCreate(outer);
    _sync.baseRev = rev; _sync.syncedSig = backupSig(); saveSyncCfg();
  }
  function adoptRemote(remoteState, rev){
    var ui = state.ui;                    // preserva a vista/mês/tema deste dispositivo
    state = remoteState; state.ui = ui;
    _idx = null;
    _sync.baseRev = rev; save(); _sync.syncedSig = backupSig(); saveSyncCfg();
    render();
  }
  async function syncNow(opts){
    opts = opts || {};
    if (_syncing || !syncReady()) return;
    _syncing = true; setSyncStatus("A sincronizar…");
    try {
      var outer = null;
      if (_sync.gistId) { outer = await gistRead(); }
      var remoteRev = outer ? (outer.rev||0) : 0, base = _sync.baseRev||0, changed = localChangedSinceSync();
      if (outer && remoteRev > base) {
        if (!changed) {
          adoptRemote(await decEnvelope(outer.enc, _sync.pass), remoteRev);
          setSyncStatus("Atualizado da nuvem ✓"); toast("Sincronizado — dados atualizados da nuvem.");
        } else {
          _pendingConflict = { remoteRev:remoteRev, enc:outer.enc };
          setSyncStatus("Conflito ⚠️"); _syncing = false; conflictModal(); return;
        }
      } else if (changed || !outer || remoteRev < base) {
        var newRev = Math.max(remoteRev, base) + 1;
        await pushLocal(newRev);
        setSyncStatus("Guardado na nuvem ✓" + (_sync.gistId?"  ·  gist "+_sync.gistId.slice(0,8)+"…":""));
        if (!opts.silent) toast("Sincronizado ✓");
      } else {
        setSyncStatus("Já sincronizado ✓");
        if (!opts.silent) toast("Já está sincronizado.");
      }
    } catch(e){
      // Gist não encontrado (apagado no GitHub, ID errado, ou o token deixou de lhe aceder).
      // NUNCA criar outro em silêncio: com dois aparelhos ligados, cada um criaria o seu
      // e os orçamentos passavam a divergir sem ninguém dar por isso.
      if (/\(404\)/.test(e.message) && _sync.gistId) {
        _gistPerdido = { id:_sync.gistId, jaSincronizou: (_sync.baseRev||0) > 0 };
        setSyncStatus("Gist não encontrado ⚠️");
        _syncing = false; gistLostModal(); return;
      }
      if (/\(401\)|\(403\)/.test(e.message)) {
        setSyncStatus("Token recusado ⚠️");
        toast("O GitHub recusou o token — pode ter expirado ou sido revogado.");
        _syncing = false; return;
      }
      setSyncStatus("Erro: "+e.message); toast("Sincronização falhou: "+e.message);
    }
    _syncing = false;
  }
  function scheduleAutoSync(){
    if (!_sync.auto || !syncReady() || _syncing || _gistPerdido) return;
    // Mudar de mês ou de separador também chama save(). Sem dados novos não vale a pena
    // ir à rede — evita um pedido ao GitHub por cada clique de navegação.
    if (!localChangedSinceSync()) return;
    clearTimeout(_autoTimer);
    _autoTimer = setTimeout(function(){ syncNow({silent:true}); }, 4000);
  }

  function download(filename, text, type) {
    var blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }
  // No iPhone com a aplicação instalada no ecrã principal, o download silencioso falha.
  // Nesse caso usa-se a partilha do sistema, que deixa guardar em Ficheiros, enviar por
  // e-mail, mandar para o iCloud/OneDrive, etc. Nos restantes casos, download normal.
  function podePartilharFicheiros(){
    try { return !!(navigator.canShare && navigator.canShare({ files:[new File(["a"], "t.txt", {type:"text/plain"})] })); }
    catch(e){ return false; }
  }
  function appInstaladaIOS(){
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent || "") ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var standalone = (window.navigator.standalone === true) ||
                     (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    return ios && standalone;
  }
  function usaPartilha(){ return appInstaladaIOS() && podePartilharFicheiros(); }
  function guardarFicheiro(nome, texto, tipo, aoConseguir){
    if (usaPartilha()) {
      try {
        navigator.share({ files:[new File([texto], nome, {type:tipo})], title:nome })
          .then(function(){ if(aoConseguir) aoConseguir("partilha"); })
          .catch(function(){});                                  // o utilizador cancelou
        return;
      } catch(e){}
    }
    download(nome, texto, tipo);
    if (aoConseguir) aoConseguir("download");
  }

  // ---------- Importação de CSV ----------
  function splitCSVLine(line, d){
    var out=[],cur="",q=false;
    for(var i=0;i<line.length;i++){ var ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"') q=true; else if(ch===d){ out.push(cur); cur=""; } else cur+=ch; } }
    out.push(cur); return out;
  }
  function normKey(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,""); }
  function parseCSVDate(s){
    s=String(s==null?"":s).trim(); if(!s) return null;
    var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
    m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(m) return m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);
    return null;
  }
  function parseCSV(text, defaultAccountId){
    text=String(text).replace(/^﻿/,"");
    var lines=text.split(/\r?\n/).filter(function(l){ return l.trim()!==""; });
    if(!lines.length) return { rows:[], skipped:0, error:"O ficheiro está vazio." };
    var head=lines[0];
    var cand=[";",",","\t"], d=";", best=-1;
    cand.forEach(function(c){ var n=head.split(c).length-1; if(n>best){ best=n; d=c; } });
    var cols=splitCSVLine(head,d).map(normKey), idx={};
    function set(key,names){ if(key in idx) return; for(var i=0;i<cols.length;i++) if(names.indexOf(cols[i])>=0){ idx[key]=i; return; } }
    set("data",["data","date","datamov","datavalor","dataoperacao","datamovimento"]);
    set("conta",["conta","account"]);
    set("payee",["beneficiario","descricao","payee","description","descritivo","designacao"]);
    set("categoria",["categoria","category"]);
    set("nota",["nota","notas","memo","observacoes","obs"]);
    set("saida",["saida","debito","outflow","despesa","levantamento"]);
    set("entrada",["entrada","credito","inflow","receita","deposito"]);
    set("valor",["valor","montante","amount","importancia"]);
    set("cleared",["confirmada","cleared","reconciliada"]);
    if(!("data" in idx) || (!("saida" in idx) && !("entrada" in idx) && !("valor" in idx)))
      return { rows:[], skipped:0, error:"Cabeçalho não reconhecido. É necessária uma coluna «Data» e uma coluna «Valor» (ou «Saída»/«Entrada»)." };
    var accByName={}, catByName={};
    state.accounts.forEach(function(a){ accByName[normKey(a.name)]=a.id; });
    state.categories.forEach(function(c){ if(!c.cardId) catByName[normKey(c.name)]=c.id; });
    // Contagem do que já existe, por conta+data+valor. Contando (em vez de só marcar) fica
    // certo o caso de haver mesmo duas compras iguais no mesmo dia: só as que já lá estão
    // é que são assinaladas como repetidas.
    var jaExiste={};
    for(var e=0;e<state.transactions.length;e++){
      var te=state.transactions[e];
      var ke=te.accountId+"|"+te.date+"|"+round2(te.outflow||0).toFixed(2)+"|"+round2(te.inflow||0).toFixed(2);
      jaExiste[ke]=(jaExiste[ke]||0)+1;
    }
    var rows=[], skipped=0, semCat=0, dups=0, cortado=0;
    for(var i=1;i<lines.length;i++){
      var f=splitCSVLine(lines[i],d);
      var date=parseCSVDate(f[idx.data]);
      var out=0, inf=0, v;
      if("valor" in idx){ v=parseAmount(f[idx.valor]); if(!isNaN(v)){ if(v<0) out=Math.abs(v); else if(v>0) inf=v; } }
      if("saida" in idx){ v=parseAmount(f[idx.saida]); if(!isNaN(v)&&Math.abs(v)>0.0001) out=Math.abs(v); }
      if("entrada" in idx){ v=parseAmount(f[idx.entrada]); if(!isNaN(v)&&Math.abs(v)>0.0001) inf=Math.abs(v); }
      if(!date || (out<0.005 && inf<0.005)){ skipped++; continue; }
      var accId=defaultAccountId;
      if("conta" in idx){ var an=accByName[normKey(f[idx.conta])]; if(an) accId=an; }
      var catId=null;
      if("categoria" in idx){ var cn=normKey(f[idx.categoria]); if(cn==="rendimento"||cn==="income") catId=INCOME; else if(catByName[cn]) catId=catByName[cn]; }
      if(!catId && inf<0.005) semCat++;
      var cl=true;
      if("cleared" in idx){ var cv=normKey(f[idx.cleared]); if(cv==="nao"||cv==="n"||cv==="false"||cv==="0") cl=false; }
      var kr=accId+"|"+date+"|"+round2(out).toFixed(2)+"|"+round2(inf).toFixed(2);
      var repetida=false;
      if(jaExiste[kr]>0){ repetida=true; jaExiste[kr]--; dups++; }
      rows.push({ date:date, accountId:accId, payee:corta(f[idx.payee]||"", LIM_PAYEE), categoryId:catId,
        memo:("nota" in idx ? corta(f[idx.nota]||"", LIM_NOTA) : ""), outflow:round2(out), inflow:round2(inf), cleared:cl, dup:repetida });
      if(rows.length>=MAX_LINHAS_CSV){ cortado=(lines.length-1)-i; break; }
    }
    return { rows:rows, skipped:skipped, semCat:semCat, dups:dups, cortado:cortado, error:null };
  }
