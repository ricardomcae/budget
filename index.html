      --surface: #111827;
      --surface-2: #0f172a;
      --sidebar: #0b1120;
      --sidebar-2: #060a13;
      --sidebar-text: #94a3b8;
      --sidebar-text-strong: #e2e8f0;
      --text: #e5e7eb;
      --text-muted: #94a3b8;
      --border: #1f2a3c;
      --primary: #14b8a6;
      --primary-dark: #0d9488;
      --primary-soft: #134e4a;
      --accent2: #0e7490;
      --positive: #4ade80;
      --positive-soft: #14351f;
      --negative: #f87171;
      --negative-soft: #3b1414;
      --warning: #fbbf24;
      --warning-soft: #3a2c07;
      --info: #60a5fa;
      --info-soft: #17233f;
      --neutral-soft: #1f2a3c;
      --group-row: #172232;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
    }
  }
  
  body.tema-azul      { --primary: #2563eb; --primary-dark: #1d4ed8; --primary-soft: #dbe6fe; --accent2: #60a5fa; }
  body.tema-violeta   { --primary: #7c3aed; --primary-dark: #6d28d9; --primary-soft: #e9e0fb; --accent2: #c4b5fd; }
  body.tema-ameixa    { --primary: #86198f; --primary-dark: #701a75; --primary-soft: #f5e1f7; --accent2: #d946ef; }
  body.tema-framboesa { --primary: #be185d; --primary-dark: #9d174d; --primary-soft: #fce0ec; --accent2: #f472b6; }
  body.tema-grafite   { --primary: #334155; --primary-dark: #1e293b; --primary-soft: #e6e9ee; --accent2: #94a3b8; }
  body.tema-cobalto   { --primary: #1e3a8a; --primary-dark: #172554; --primary-soft: #dde3f5; --accent2: #6b8ad6; }
  body.tema-cafe      { --primary: #4a3728; --primary-dark: #33261b; --primary-soft: #ece5df; --accent2: #a08972; }
  @media (prefers-color-scheme: dark) {
    body:not([class*="tema-"]) { --primary: #3cb4d1; --primary-dark: #2793ad; --primary-soft: #10262d; --accent2: #1d6f83; }
    body.tema-azul      { --primary: #6fa1f7; --primary-dark: #4f83e0; --primary-soft: #141d2e; --accent2: #3f6bbf; }
    body.tema-violeta   { --primary: #b39af2; --primary-dark: #9575e5; --primary-soft: #1e1630; --accent2: #6d3fc4; }
    body.tema-ameixa    { --primary: #d07ad6; --primary-dark: #b45cbb; --primary-soft: #2a1730; --accent2: #8b3d92; }
    body.tema-framboesa { --primary: #ef7ba5; --primary-dark: #d95c8a; --primary-soft: #2d1520; --accent2: #a63f68; }
    body.tema-grafite   { --primary: #a3b2c7; --primary-dark: #8696ad; --primary-soft: #1b1f26; --accent2: #5b6b80; }
    body.tema-cobalto   { --primary: #8fa5e0; --primary-dark: #6b85cc; --primary-soft: #151a2e; --accent2: #3f56a3; }
    body.tema-cafe      { --primary: #c4a68c; --primary-dark: #a8886d; --primary-soft: #241d17; --accent2: #7a5f47; }
  }
  .theme-toggle { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border); background: linear-gradient(135deg, var(--primary), var(--accent2)); padding: 0; flex: 0 0 auto; cursor: pointer; transition: transform .12s; }
  .theme-toggle:hover { transform: scale(1.1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; }

  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }

  
  .sidebar {
    background: var(--sidebar);
    color: var(--sidebar-text);
    display: flex; flex-direction: column;
    padding: 16px 0; gap: 4px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 12px; margin: 0 6px 4px; width: calc(100% - 12px);
    background: transparent; border: 0; border-radius: 9px; cursor: pointer; text-align: start; color: inherit; }
  .brand:hover { background: rgba(255,255,255,.06); }
  .brand .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--accent2)); display: grid; place-items: center; font-size: 18px; }
  .brand h1 { font-size: 16px; margin: 0; color: var(--sidebar-text-strong); font-weight: 700; letter-spacing: .2px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
  .brand small { display: block; font-size: 10.5px; color: var(--sidebar-text); font-weight: 500; }
  .nav { padding: 6px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: start;
    background: transparent; border: 0; color: var(--sidebar-text);
    padding: 9px 12px; border-radius: 8px; font-weight: 600; font-size: 13.5px;
  }
  .nav button .ic { font-size: 16px; width: 20px; text-align: center; }
  .nav button:hover { background: rgba(255,255,255,.06); color: var(--sidebar-text-strong); }
  .nav button.active { background: var(--primary); color: #fff; }
  .side-section { padding: 14px 20px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: #94a3b8; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .side-accounts { padding: 2px 12px; display: flex; flex-direction: column; gap: 1px; }
  .side-acc { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 7px; background: transparent; border: 0; color: var(--sidebar-text); width: 100%; text-align: start; }
  .side-acc:hover { background: rgba(255,255,255,.06); color: var(--sidebar-text-strong); }
  .side-acc .nm { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-acc .bal { font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .side-acc .bal.neg { color: var(--negative); }
  .side-total { padding: 8px 24px; font-size: 12px; display:flex; justify-content: space-between; color: var(--sidebar-text); border-top: 1px solid rgba(255,255,255,.06); margin-top: 6px; }
  .side-total b { color: var(--sidebar-text-strong); font-variant-numeric: tabular-nums; }
  .add-acc { margin: 8px 16px; padding: 8px; border: 1px dashed rgba(255,255,255,.2); background: transparent; color: var(--sidebar-text); border-radius: 8px; font-weight: 600; font-size: 12.5px; }
  .add-acc:hover { border-color: var(--primary); color: #fff; }
  .side-footer { margin-top: auto; padding: 12px 16px 4px; display: flex; flex-direction: column; gap: 4px; }
  
  .side-footer button { background: transparent; border: 0; color: var(--sidebar-text); text-align: start; padding: 7px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; display:flex; align-items:center; gap:9px; white-space: nowrap; overflow: hidden; }
  
  .side-footer button > span:first-child { flex: 0 0 20px; text-align: center; }
  .side-footer button:hover { background: rgba(255,255,255,.06); color: var(--sidebar-text-strong); }

  
  .main { padding: 0; min-width: 0; display: flex; flex-direction: column; }
  
  .topbar { min-height: 66px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 26px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  
  .view-title { font-size: 19px; font-weight: 700; margin: 0; min-width: 136px; }
  .month-nav { display: flex; align-items: center; gap: 6px; }
  
  .month-nav.sem-mes { visibility: hidden; }
  .month-nav button.arrow { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 16px; display: grid; place-items: center; }
  .month-nav button.arrow:hover { background: var(--surface-2); border-color: var(--primary); }
  .month-nav .month-label { font-weight: 700; font-size: 15px; min-width: 150px; text-align: center; }
  .month-nav .today-btn { font-size: 12px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-weight: 600; }

  .rta-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0; padding: 12px 22px; border-radius: 14px; background: var(--primary); color: #fff; box-shadow: var(--shadow); flex-wrap: wrap; }
  .rta-banner.zero { background: linear-gradient(135deg, var(--primary), var(--accent2)); }
  .rta-banner.over { background: linear-gradient(135deg, #b91c1c, #dc2626); }
  .rta-amount { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .rta-label { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  
  .rta-nums { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; min-width: 0; }
  .rta-nums .rta-amount { flex: 0 0 auto; }
  .rta-nums .rta-label { flex: 1 1 auto; min-width: 0; }

  .rta-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .rta-actions button { background: rgba(255,255,255,.94); color: var(--primary-dark); border: 1px solid transparent; padding: 8px 13px; border-radius: 8px; font-weight: 600; font-size: 12.5px; }
  .rta-actions button:hover { background: #fff; }

  
  .integrity-bar { display: flex; align-items: center; gap: 12px; margin: 10px 0 0; padding: 11px 16px; border-radius: 12px; background: var(--warning-soft); border: 1px solid var(--warning); color: var(--warning); font-size: 13px; font-weight: 600; flex-wrap: wrap; }
  .integrity-bar .grow { flex: 1; min-width: 170px; }
  .integrity-bar button { background: var(--surface); border: 1px solid var(--warning); color: var(--warning); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .integrity-bar button:hover { background: var(--warning); color: #fff; }
  .upcoming-bar { display: flex; align-items: center; gap: 12px; margin: 10px 0 0; padding: 10px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); font-size: 13px; font-weight: 600; flex-wrap: wrap; }
  .upcoming-bar .grow { flex: 1; min-width: 170px; }
  .upcoming-bar b { color: var(--text); font-variant-numeric: tabular-nums; }
  .upcoming-bar button { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .upcoming-bar button:hover { border-color: var(--primary); color: var(--primary); }
  
  .moves-list { max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  
  .pergunta { font-size: 13.5px; line-height: 1.5; white-space: pre-line; }
  
  .q-linhas { margin: 12px 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .q-linhas > div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
    padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .q-linhas > div:last-child { border-bottom: 0; }
  .q-linhas span { color: var(--text-muted); }
  .q-linhas b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .q-linhas .mau { background: var(--negative-soft); }
  .q-linhas .mau b { color: var(--negative); }
  
  .q-nota { margin: 10px 0 0; padding: 9px 12px; border-radius: 9px; background: var(--surface-2);
    font-size: 12.5px; line-height: 1.45; color: var(--text-muted); }
  .pergunta.perigo { border-inline-start: 3px solid var(--negative); padding-inline-start: 12px; }
  .btn.perigo { background: var(--negative); border-color: var(--negative); color: #fff; font-weight: 700; }
  .btn.perigo:hover { filter: brightness(1.08); }
  .move-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; font-size: 12.5px; border-bottom: 1px solid var(--border); }
  .move-row:last-child { border-bottom: 0; }
  
  
  .move-row .m-desc { flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .move-row .m-desc .m-de { display: block; font-size: 11px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .move-row .m-amt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .move-row .m-time { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
  .overspent-bar { display: flex; align-items: center; gap: 12px; margin: 10px 0 0; padding: 11px 16px; border-radius: 12px; background: var(--negative-soft); border: 1px solid var(--negative); color: var(--negative); font-size: 13px; font-weight: 600; flex-wrap: wrap; }
  .overspent-bar .grow { flex: 1; min-width: 170px; }
  .overspent-bar b { font-variant-numeric: tabular-nums; }
  .overspent-bar button { background: var(--surface); border: 1px solid var(--negative); color: var(--negative); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .overspent-bar button:hover { background: var(--negative); color: #fff; }
  .int-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .int-row .who { min-width: 0; }
  .int-row .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  
  .int-row .who .tag { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .int-row .amt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  
  .py-acoes { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  
  .btn.sm.py-ico { padding: 7px 10px; font-size: 15px; line-height: 1; }

  
  .content { padding: 20px var(--lado) 16px; }
  
  #rtaWrap:not(:empty) { padding: 20px var(--lado) 0; }

  .btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 9px 15px; border-radius: 9px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { background: var(--surface-2); border-color: var(--primary); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn:disabled:hover { background: var(--surface); border-color: var(--border); }
  .undo-redo { display: inline-flex; gap: 4px; }
  .undo-redo .btn { padding: 6px 10px; font-size: 14px; line-height: 1; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--negative); border-color: var(--negative-soft); }
  .btn.danger:hover { background: var(--negative-soft); }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  
  
  .toolbar.enc1 .f-prio .rot,
  .toolbar.enc2 .btn-limpar .rot,
  .toolbar.enc3 .tb-acao .rot,
  .toolbar.enc4 .f-estado .rot,
  .toolbar.enc5 .tb-etiq { display: none; }
  .toolbar.enc1 .f-prio + .f-prio { margin-inline-start: -2px; }
  
  .toolbar.medindo { flex-wrap: nowrap; }
  .toolbar.medindo .tb-bloco, .toolbar.medindo .tb-bloco > * { flex-shrink: 0; }
  
  
  .toolbar.acc-head { margin-bottom: 10px; }
  
  .tx-resumo { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    flex-wrap: wrap; font-size: 12.5px; margin: 0 2px 8px; }
  .tx-resumo > span:last-child { margin-inline-start: auto; white-space: nowrap; }
  .toolbar.acc-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
  .toolbar.acc-acoes { margin-bottom: 10px; }
  
  .toolbar.tx-filtros .search-wrap { flex: 1 1 240px; min-width: 150px; max-width: 380px; }
  .toolbar .tb-bloco { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; min-width: 0; }
  .toolbar .tb-fim { flex: 1 1 auto; }   
  .toolbar .spacer { flex: 1; }
  
  .search-wrap { position: relative; display: inline-flex; align-items: center; min-width: 0; }
  .search-wrap .search { width: 100%; padding-inline-end: 30px; }
  .search-x { position: absolute; inset-inline-end: 6px; border: 0; background: transparent; cursor: pointer;
    color: var(--text-muted); font-size: 13px; line-height: 1; padding: 5px 6px; border-radius: 6px; }
  .search-x:hover { background: var(--surface-2); color: var(--text); }
  .search { padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); min-width: 180px; }
  select.filter, input.filter { padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); font-weight: 600; }

  
  
  .budget-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: clip; box-shadow: var(--shadow); }
  table.budget { width: 100%; border-collapse: collapse; }
  table.budget thead th { text-align: end; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); font-weight: 700; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  table.budget thead th.first { text-align: start; }
  table.budget tr.tot-row td { text-align: end; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 6px 10px 9px; border-bottom: 2px solid var(--border); color: var(--text); background: var(--surface-2); }
  table.budget tr.tot-row td.first { text-align: start; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
  table.budget tr.tot-row td.pos { color: var(--positive); }
  table.budget tr.tot-row td.neg { color: var(--negative); }
  table.budget tr.tot-row .tag { font-weight: 600; }

  .grp-row td { padding: 11px 18px; background: var(--group-row); border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); font-weight: 700; }
  .grp-row .grp-name { display: flex; align-items: center; gap: 9px; }
  .grp-row .grp-name .caret { transition: transform .15s; color: var(--text-muted); font-size: 12px; }
  
  .grp-row .grp-name button.grp-toggle { background: transparent; border: 0; display: flex;
    align-items: flex-start; gap: 9px; color: var(--text); font-weight: 700; padding: 0;
    text-align: start; }
  .grp-row .grp-name button.grp-toggle .caret { margin-top: 3px; }
  .grp-row .grp-add { font-size: 11.5px; color: var(--primary); font-weight: 600; background: transparent; border: 0; opacity: 0; }
  .grp-row:hover .grp-add { opacity: 1; }
  .grp-total { text-align: end; font-variant-numeric: tabular-nums; color: var(--text-muted); font-weight: 600; }

  tr.cat-row td { padding: 9px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr.cat-row:hover { background: var(--surface-2); }
  tr.cat-row:last-child td { border-bottom: 0; }
  .cat-name-cell { display: flex; align-items: center; gap: 10px; }
  .cat-name { font-weight: 600; }
  
  .prio-btn { flex: 0 0 auto; width: 22px; height: 22px; padding: 0; border-radius: 6px; border: 1px solid transparent; background: transparent; font-size: 11px; line-height: 1; display: inline-grid; place-items: center; transition: background .12s, border-color .12s; }
  .prio-btn:hover { border-color: var(--border); background: var(--surface-2); }
  
  .prio-btn.p-alta { color: var(--positive); font-size: 12px; }
  .prio-btn.p-normal { color: var(--text-muted); opacity: .4; }
  .prio-btn.p-baixa { color: var(--negative); font-size: 12px; }
  .cat-name-cell .cat-actions { display: flex; gap: 4px; opacity: 0; }
  tr.cat-row:hover .cat-actions { opacity: 1; }
  .cat-actions button { background: transparent; border: 0; color: var(--text-muted); font-size: 13px; padding: 2px 5px; border-radius: 5px; }
  .cat-actions button:hover { background: var(--neutral-soft); color: var(--text); }
  
  .pend { color: var(--warning); }
  .date-field { position: relative; display: inline-flex; align-items: center; width: 100%; }
  .date-txt { width: 100%; padding-inline-end: 34px !important; font-variant-numeric: tabular-nums; }
  .date-txt.erro { border-color: var(--negative); }
  
  .date-nat { position: absolute; inset-inline-end: 0; top: 0; width: 42px; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; z-index: 2; -webkit-appearance: none; appearance: none; }
  .date-btn { position: absolute; inset-inline-end: 3px; background: none; border: 0; font-size: 15px; line-height: 1; padding: 4px 5px; border-radius: 6px; pointer-events: none; z-index: 1; color: var(--text-muted); }
  .toolbar .date-field { width: auto; }
  .toolbar .date-txt { width: 128px; }
  .op-intro { margin: 0 0 12px; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
