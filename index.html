               '<div style="font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;'+(cor||'')+'">'+val+'</div></div>';
      }
      resumoPayee =
        '<div class="data-card" style="padding:14px 16px;margin-bottom:12px;">'+
          '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;">'+
            '<h3 style="margin:0;font-size:15px;">🏷 '+esc(nome||"Beneficiário")+'</h3>'+
            '<span class="muted" style="font-size:12px;">de '+fmtDate(primeira)+' a '+fmtDate(ultima)+'</span></div>'+
          '<div style="display:flex;gap:18px 26px;flex-wrap:wrap;">'+
            bloco("Gasto", fmt(rSaida))+
            (rEntrada>0.005 ? bloco("Recebido/devolvido", fmt(rEntrada)) : "")+
            (rEntrada>0.005 ? bloco("Líquido", fmt(liquido), liquido<0?'color:var(--positive);':'') : "")+
            bloco("Transações", String(list.length))+
            bloco("Média por vez", fmt(media))+
          '</div>'+
          (catsTxt ? '<div class="hint" style="margin-top:10px;">Onde entrou: '+catsTxt+'</div>' : '')+
          '<div class="hint" style="margin-top:6px;">Conta só o que os filtros deixam à vista — escolha um período para ver, por exemplo, só este ano.</div>'+
        '</div>';
    }
    var head = '<div class="toolbar">'+
      // O «Dividir» e o «Beneficiários» saíram daqui: o primeiro está dentro da nova
      // transação, o segundo na barra lateral (e no 🏷️ do topo, no telemóvel).
      '<button class="btn primary hide-phone" data-action="add-tx">➕ Nova transação</button>'+
      '<input class="search" id="txSearch" placeholder="Procurar beneficiário ou nota…" value="'+esc(f.q||"")+'">'+
      '<select class="filter" id="txFilterAcc">'+accOpts+'</select>'+
      '<select class="filter" id="txFilterCat">'+catOpts+'</select>'+
      '<select class="filter" id="txFilterPer">'+perOpts+'</select>'+
      (f.per==="custom" ? dateField("txFilterFrom", f.from||"", 'class="date-txt filter" title="De"')+
                          dateField("txFilterTo", f.to||"", 'class="date-txt filter" title="Até"') : '')+
      (temFiltro ? '<button class="btn sm" data-action="tx-filter-clear" title="Ver todas as transações">✕ Limpar filtros</button>' : '')+
      '<div class="spacer"></div>'+
      '<button class="btn sm" data-action="export-csv">⬇ CSV</button>'+
      (function(){ var pend = porConfirmar(f.account||null);
        if (Math.abs(pend) <= 0.005) return '';
        var qual = f.account ? "nesta conta" : "em todas as contas";
        return '<span class="muted" style="font-size:12.5px;"><b class="pend" title="Registado mas ainda não confirmado no banco">Por confirmar: '+fmt(pend)+'</b> '+qual+'</span>'; })()+
      '<span class="muted" style="font-size:12.5px;">'+list.length+(temFiltro?' de '+state.transactions.length:'')+' transações</span></div>';

    if (!state.transactions.length) {
      el("content").innerHTML = head + emptyState("🧾","Sem transações","Registe as suas entradas e saídas para ver a atividade no orçamento.",
        '<button class="btn primary" data-action="add-tx">➕ Nova transação</button>');
      return;
    }
    var LIM = state.ui.txLimit || PAGINA;
    var visiveis = list.slice(0, LIM);
    // Só faz sentido mostrar saldo acumulado quando se está a ver UMA conta e nada mais:
    // com outros filtros faltariam movimentos pelo meio e o saldo mentiria.
    var balOf = null;
    if (soConta) {
      var asc = state.transactions.filter(function(t){ return t.accountId===f.account; })
        .sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
      balOf = {}; var run = 0;
      for (var bi=0; bi<asc.length; bi++){ run = round2(run + (asc[bi].inflow||0) - (asc[bi].outflow||0)); balOf[asc[bi].id] = run; }
    }
    var body = list.length ? visiveis.map(function(t){ return txRow(t, balOf?balOf[t.id]:undefined, !soConta); }).join("")
                           : '<tr><td colspan="9" class="empty">Nada corresponde ao filtro.</td></tr>';
    if (list.length > LIM) body += '<tr><td colspan="9" style="text-align:center;padding:14px;">'+
      '<button class="btn" data-action="show-more-tx">Mostrar mais '+PAGINA+' (a ver '+LIM+' de '+list.length+')</button></td></tr>';

    el("content").innerHTML = head + resumoPayee +
      '<div class="data-card"><table class="data"><thead><tr>'+
      '<th>'+thSelTodas()+'Data</th>'+(soConta?'':'<th>Conta</th>')+'<th>Beneficiário</th><th>Categoria</th><th class="col-nota">Nota</th>'+
      '<th class="num">Saída</th><th class="num">Entrada</th>'+(soConta?'<th class="num">Saldo</th>':'')+
      '<th style="text-align:center;">✓</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
  }

  function niceMax(v){ if(!(v>0)) return 1; var pow=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)); var f=v/pow; var nf=f<=1?1:(f<=2?2:(f<=2.5?2.5:(f<=5?5:10))); return nf*pow; }

  // Gráfico de linhas em SVG (autónomo). W = largura em píxeis medida, para o texto ficar fixo (não amplia).
  function lineChartSVG(series, months, W){
    W = Math.max(320, W||720);
    var H=300, pl=54, pr=16, pTop=16, pb=30, fs=12;
    var iw=W-pl-pr, ih=H-pTop-pb, n=months.length;
    // Aceita valores negativos (o património líquido pode sê-lo): a escala arranca
    // no mínimo em vez de arrancar sempre em zero.
    var maxRaw=0, minRaw=0;
    series.forEach(function(s){ s.values.forEach(function(v){ if(v>maxRaw) maxRaw=v; if(v<minRaw) minRaw=v; }); });
    var maxV = maxRaw>0 ? niceMax(maxRaw) : 0;
    var minV = minRaw<0 ? -niceMax(-minRaw) : 0;
    if (maxV===minV) maxV = minV + 1;
    function xat(i){ return n<=1 ? pl+iw/2 : pl + iw*(i/(n-1)); }
    function yat(v){ return pTop + ih*(1 - (v-minV)/(maxV-minV)); }
    function sfmt(v){ v=Math.round(Math.abs(v)); return v>=1000 ? (Math.round(v/100)/10)+"k" : ""+v; }
    function etiqueta(v){ return (v<-0.5?"-":"") + currencySym() + sfmt(v); }   // «-€1,2k», não «€-1,2k»
    var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Gráfico de evolução">';
    for(var g=0; g<=4; g++){ var gy=pTop+ih*(g/4), gv=maxV-(maxV-minV)*(g/4);
      s+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" style="stroke:var(--border)" stroke-width="1"/>';
      s+='<text x="'+(pl-8)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="'+fs+'" style="fill:var(--text-muted)">'+etiqueta(gv)+'</text>'; }
    if (minV<0) { var zy=yat(0).toFixed(1);   // linha do zero, para se ver onde começa a dívida
      s+='<line x1="'+pl+'" y1="'+zy+'" x2="'+(W-pr)+'" y2="'+zy+'" style="stroke:var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>'; }
    var step = n>18?4:(n>12?3:(n>6?2:1));
    for(var i=0;i<n;i++){ if(i%step!==0 && i!==n-1) continue; var p=months[i].split("-"); var lab=MONTHS_PT[parseInt(p[1],10)-1].slice(0,3)+" "+p[0].slice(2);
      s+='<text x="'+xat(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="'+fs+'" style="fill:var(--text-muted)">'+lab+'</text>'; }
    series.forEach(function(se){
      var pts=se.values.map(function(v,i){ return xat(i).toFixed(1)+","+yat(v).toFixed(1); }).join(" ");
      s+='<polyline points="'+pts+'" fill="none" stroke="'+se.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
      se.values.forEach(function(v,i){ var cx=xat(i).toFixed(1), cy=yat(v).toFixed(1), p=months[i].split("-"), ml=MONTHS_PT[parseInt(p[1],10)-1].slice(0,3)+" "+p[0].slice(2);
        s+='<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="transparent" class="evo-pt" data-tip="'+esc(se.name+' · '+ml+': '+fmt(v))+'"/>';
        s+='<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="'+se.color+'" style="pointer-events:none"/>'; });
    });
    return s+'</svg>';

  // Mede a largura disponível e desenha o gráfico com essa largura (texto de tamanho fixo, ocupa o ecrã todo).
  function drawInto(hostId, series, months, vazio){
    var host=el(hostId); if(!host) return;
    if(!series.length){ host.innerHTML='<div class="muted" style="padding:30px 0;text-align:center;">'+vazio+'</div>'; return; }
    host.innerHTML=lineChartSVG(series, months, Math.floor(host.clientWidth||720));

  function drawEvo(series, months){
    drawInto("evoHost", series, months, "Escolha uma ou mais categorias abaixo para ver a evolução.");

  // Património líquido no fim de cada mês: soma de tudo o que aconteceu até lá,
  // em todas as contas (incluindo as de acompanhamento e os cartões).
  function netWorthSeries(months){
    var porMes={};
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i], mm=monthOf(t.date);
      porMes[mm]=(porMes[mm]||0)+((t.inflow||0)-(t.outflow||0));
    }
    var chaves=Object.keys(porMes).sort();
    var vals=[], acumulado=0, ci=0;
    for(var j=0;j<months.length;j++){
      while(ci<chaves.length && chaves[ci]<=months[j]){ acumulado+=porMes[chaves[ci]]; ci++; }
      vals.push(round2(acumulado));
    }
    return vals;
  }

  function renderReports() {
    var m = state.ui.month;

    // ---------- Período: comanda TODOS os blocos deste ecrã ----------
    var nMonths = state.ui.reportMonths || 6;
    var customPer = !!(state.ui.reportFrom && state.ui.reportTo && state.ui.reportFrom<=state.ui.reportTo);
    var meses = [];
    if (customPer) { var cur=state.ui.reportFrom, g=0; while(cur<=state.ui.reportTo && g<60){ meses.push(cur); cur=shiftMonth(cur,1); g++; } }
    else { for (var em=nMonths-1; em>=0; em--) meses.push(shiftMonth(m,-em)); }
    if (!meses.length) meses = [m];
    var noPeriodo = {}; meses.forEach(function(k){ noPeriodo[k]=true; });
    var etiqueta = meses.length===1 ? monthLabel(meses[0]) : (monthLabel(meses[0])+" a "+monthLabel(meses[meses.length-1]));

    // ---------- Uma passagem pelas transações do período ----------
    var totalIn=0, totalOut=0, spend={}, porMes={};
    meses.forEach(function(k){ porMes[k]={inc:0,out:0}; });
    for (var i=0;i<state.transactions.length;i++) {
      var t = state.transactions[i], mm = monthOf(t.date);
      if (!noPeriodo[mm]) continue;
      if (t.transfer && !t.categoryId) continue;          // transferência interna não é despesa nem receita
      if (isOpening(t)) continue;                          // saldo inicial não é receita/despesa real
      if (t.categoryId === INCOME) { totalIn += (t.inflow||0); porMes[mm].inc += (t.inflow||0); continue; }
      if (t.outflow) {
        var nome = t.categoryId ? ((lkCat(t.categoryId)||{name:"(apagada)"}).name) : "Sem categoria";
        spend[nome] = (spend[nome]||0) + t.outflow;
        totalOut += t.outflow; porMes[mm].out += t.outflow;
      }
    }
    var net = round2(totalIn - totalOut);

    var repPer = [1,3,6,12,24].map(function(nn){
      return '<button data-action="report-months" data-id="'+nn+'" class="'+((!customPer&&nMonths===nn)?'active':'')+'">'+nn+'<span class="rot"> '+(nn===1?'mês':'meses')+'</span><span class="so-fone">m</span></button>';
    }).join("");
    var blocoPeriodo = '<div class="report-block" style="padding:14px 18px;margin-bottom:18px;">'+
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">'+
        '<span style="font-weight:700;font-size:13px;">Período</span>'+
        '<div class="seg" style="flex:1;min-width:220px;max-width:340px;">'+repPer+'</div>'+
        '<span class="muted hide-phone" style="font-size:12.5px;">ou</span>'+
        '<input class="filter hide-phone" id="repFrom" type="month" value="'+esc(state.ui.reportFrom||"")+'">'+
        '<span class="muted hide-phone" style="font-size:12.5px;">até</span>'+
        '<input class="filter hide-phone" id="repTo" type="month" value="'+esc(state.ui.reportTo||"")+'">'+
        (customPer?'<button class="btn sm" data-action="report-clear-range">Limpar</button>':'')+
      '</div>'+
      // O período em texto fica em linha própria: na barra dos botões encavalitava-se neles.
      '<div class="hint" style="margin-top:10px;"><b style="color:var(--text);font-size:13px;">'+etiqueta+'</b>'+
        ' — é este o período usado nos totais, na despesa por categoria e nos gráficos.</div>'+
    '</div>';

    // ---------- Despesa por categoria ----------
    var arr = Object.keys(spend).map(function(k){return {name:k,val:spend[k]};}).sort(function(a,b){return b.val-a.val;});
    var maxV = arr.length ? arr[0].val : 1;
    var bars = arr.length ? arr.map(function(x){
      return '<div class="bar-row"><div class="b-name" title="'+esc(x.name)+'">'+esc(x.name)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(2,(x.val/maxV)*100)+'%"></div></div>'+
        '<div class="bar-val">'+fmt(x.val)+'</div></div>';
    }).join("") : '<div class="muted" style="padding:8px 0;">Sem despesas registadas neste período.</div>';

    // ---------- Rendimento vs Despesa, mês a mês, com os valores nas barras ----------
    var maxBar = 1;
    meses.forEach(function(k){ maxBar = Math.max(maxBar, porMes[k].inc, porMes[k].out); });
    var trend = meses.map(function(k){
      var d = porMes[k], p = k.split("-");
      var lab = MONTHS_PT[parseInt(p[1],10)-1].slice(0,3)+" "+p[0].slice(2);
      return '<div class="bar-row" style="grid-template-columns:74px 1fr 1fr;">'+
        '<div class="b-name">'+lab+'</div>'+
        '<div class="bar-track" title="Rendimento"><div class="bar-fill" style="width:'+(d.inc/maxBar*100)+'%;background:linear-gradient(90deg,var(--positive),#4ade80);"></div>'+
          (d.inc>0.005?'<span class="bar-num">'+fmt(d.inc)+'</span>':'')+'</div>'+
        '<div class="bar-track" title="Despesa"><div class="bar-fill" style="width:'+(d.out/maxBar*100)+'%;background:linear-gradient(90deg,#dc2626,#f87171);"></div>'+
          (d.out>0.005?'<span class="bar-num">'+fmt(d.out)+'</span>':'')+'</div>'+
        '</div>';
    }).join("");

    // ---------- Evolução por categoria ----------
    if (state.ui.reportCats === undefined) {
      var _tot={}; for (var _i=0;_i<state.transactions.length;_i++){ var _t=state.transactions[_i]; if(_t.outflow&&_t.categoryId){ _tot[_t.categoryId]=(_tot[_t.categoryId]||0)+_t.outflow; } }
      state.ui.reportCats = Object.keys(_tot).filter(function(id){var c=categoryById(id); return c&&!c.cardId;}).sort(function(a,b){return _tot[b]-_tot[a];}).slice(0,2);
    }
    var mode = state.ui.reportMode || "gasto";
    var monthIdx={}; meses.forEach(function(mm2,ix){ monthIdx[mm2]=ix; });
    var selCats = (state.ui.reportCats||[]).filter(function(id){ var c=categoryById(id); return c && !c.cardId; });
    var valById={}; selCats.forEach(function(id){ valById[id]=meses.map(function(mm2){ return mode==="atribuido" ? assignedFor(id, mm2) : 0; }); });
    if (mode !== "atribuido") {
      for (var si=0; si<state.transactions.length; si++){ var stx=state.transactions[si]; if(!stx.outflow||!stx.categoryId) continue; if(valById[stx.categoryId]===undefined) continue; var ix=monthIdx[monthOf(stx.date)]; if(ix===undefined) continue; valById[stx.categoryId][ix]+=stx.outflow; }
    }
    var evoSeries = selCats.map(function(id,ix){ return {catId:id, name:(categoryById(id)||{name:""}).name, color:REPORT_COLORS[ix%REPORT_COLORS.length], values:valById[id].map(function(v){return round2(v);})}; });
    var allRepCats = state.categories.filter(function(c){ return !c.cardId && !c.hidden; });
    var repChips = allRepCats.map(function(c){ var sIx=selCats.indexOf(c.id); var act=sIx>=0; var col=act?REPORT_COLORS[sIx%REPORT_COLORS.length]:null; return '<button class="rep-chip'+(act?' active':'')+'" data-action="report-toggle-cat" data-id="'+c.id+'"'+(act?' style="background:'+col+';border-color:'+col+';color:#fff"':'')+'>'+esc(c.name)+'</button>'; }).join("");
    var repMode = '<button data-action="report-mode" data-id="gasto" class="'+(mode!=="atribuido"?'active':'')+'">Gasto</button><button data-action="report-mode" data-id="atribuido" class="'+(mode==="atribuido"?'active':'')+'">Atribuído</button>';
    var evoBlock = '<div class="report-block"><h3>📈 Evolução por categoria</h3>'+
      '<div class="seg" style="max-width:260px;margin-bottom:12px;">'+repMode+'</div>'+
      '<div id="evoHost" class="evo-host"></div>'+
      (allRepCats.length ? '<div class="rep-chips" style="margin-top:16px;">'+repChips+'</div>' : '<div class="muted" style="margin-top:12px;">Ainda não há categorias.</div>')+
    '</div>';

    // ---------- Património líquido ----------
    var pnVals = netWorthSeries(meses);
    var pnDelta = round2(pnVals[pnVals.length-1] - pnVals[0]);
    var pnBlock = '<div class="report-block"><h3>💰 Evolução do património líquido</h3>'+
      '<div class="hint" style="margin:-8px 0 12px;">Tudo o que tem, menos tudo o que deve, no fim de cada mês.'+
      (meses.length>1 ? (' Variação no período: <b class="'+(pnDelta>=0?"tx-amt in":"tx-amt out")+'">'+(pnDelta>=0?"+":"")+fmt(pnDelta)+'</b>.') : '')+'</div>'+
      '<div id="pnHost" class="evo-host"></div></div>';

    el("content").innerHTML =
      blocoPeriodo +
      '<div class="kpi-grid">'+
        '<div class="kpi"><div class="k-label">Rendimento</div><div class="k-value pos">'+fmt(totalIn)+'</div></div>'+
        '<div class="kpi"><div class="k-label">Despesa</div><div class="k-value neg">'+fmt(totalOut)+'</div></div>'+
        '<div class="kpi"><div class="k-label">Resultado</div><div class="k-value '+(net>=0?"pos":"neg")+'">'+fmt(net)+'</div></div>'+
        '<div class="kpi"><div class="k-label">Património no fim</div><div class="k-value">'+fmt(pnVals[pnVals.length-1])+'</div></div>'+
      '</div>'+
      '<div class="report-block"><h3>Despesa por categoria</h3>'+bars+'</div>'+
      '<div class="report-block"><h3>Rendimento (verde) vs Despesa (vermelho)</h3>'+trend+'</div>'+
      evoBlock + pnBlock;
    drawEvo(evoSeries, meses);
    drawInto("pnHost", [{ name:"Património líquido", color:REPORT_COLORS[0], values:pnVals }], meses, "Sem dados no período escolhido.");
  }

  function renderRecurring(){
    var list=(state.recurring||[]).slice().sort(function(a,b){return a.nextDate<b.nextDate?-1:(a.nextDate>b.nextDate?1:0);});
    var head='<div class="toolbar"><button class="btn primary" data-action="add-recurring">➕ Nova recorrente</button>'+
      '<div class="spacer"></div><span class="muted" style="font-size:12.5px;">'+list.length+' regras · lançadas automaticamente na data</span></div>';
    if(!list.length){
      el("content").innerHTML=head+emptyState("📅","Sem transações recorrentes",
        "Crie regras para lançar automaticamente o que se repete — renda, salário, subscrições. Aparecem sozinhas na data marcada.",
        '<button class="btn primary" data-action="add-recurring">➕ Nova recorrente</button>');
      return;
    }
    // Separador de mês. A lista já vem por ordem de data, por isso basta reparar quando o mês
    // muda. É só uma linha a mais na tabela: não mexe em contas, em ordens nem em filtros.
    var mesAnterior = null;
    var rows=list.map(function(r){
      var sep = "";
      var mesDesta = monthOf(r.nextDate);
      if (mesDesta !== mesAnterior) {
        mesAnterior = mesDesta;
        sep = '<tr class="mes-sep"><td colspan="8">'+monthLabel(mesDesta)+'</td></tr>';
      }
      var acc=accountById(r.accountId);
      var ehTr=!!r.toAccountId, dest=ehTr?accountById(r.toAccountId):null;
      var cat=ehTr
        ? ('<span class="pill tracking">↔ Transferência</span>'+(r.categoryId?' <span class="tag">'+esc((lkCat(r.categoryId)||{name:"(apagada)"}).name)+'</span>':''))
        : (r.categoryId===INCOME?'<span class="pill budget">Rendimento</span>':(r.categoryId?esc((categoryById(r.categoryId)||{name:"(apagada)"}).name):'<span class="muted">—</span>'));
      var amt=r.outflow?'<span class="tx-amt out">'+fmt(r.outflow)+'</span>':(r.inflow?'<span class="tx-amt in">'+fmt(r.inflow)+'</span>':'');
      return sep + '<tr class="hoverable" data-action="edit-recurring" data-id="'+r.id+'" style="cursor:pointer;'+(r.active?'':'opacity:.5;')+'">'+
        '<td style="white-space:nowrap;font-weight:600;">'+fmtDate(r.nextDate)+'</td>'+
        '<td><span class="pill tracking">'+(FREQ_LABEL[r.freq]||r.freq)+'</span></td>'+
        '<td style="font-weight:600;">'+(ehTr?('↔ '+esc(dest?dest.name:"—")):esc(r.payee||""))+'</td>'+
        '<td>'+cat+'</td>'+
        '<td class="tag">'+esc(acc?acc.name:"—")+'</td>'+
        '<td class="num">'+amt+'</td>'+
        '<td style="text-align:center;"><span class="cleared-dot '+(r.active?'on':'')+'" data-action="toggle-recurring" data-id="'+r.id+'" title="Ativar / desativar">✓</span></td>'+
        '<td class="row-actions">'+
          '<button data-action="post-recurring-now" data-id="'+r.id+'" title="Lançar já a próxima">▶</button>'+
          '<button data-action="delete-recurring" data-id="'+r.id+'" title="Eliminar">🗑</button></td></tr>';
    }).join("");
    el("content").innerHTML=head+'<div class="data-card"><table class="data"><thead><tr>'+
      '<th>Próxima data</th><th>Frequência</th><th>Beneficiário</th><th>Categoria</th><th>Conta</th><th class="num">Valor</th><th style="text-align:center;">Ativa</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  function emptyState(icon, title, text, actions) {

  }

  // ---------- Janelas ----------
  function focusaveis(){
    var n = el("modal").querySelectorAll('button, input, select, textarea, [href], [tabindex]:not([tabindex="-1"])'), out=[];
    for (var i=0;i<n.length;i++) if (!n[i].disabled && n[i].offsetParent !== null) out.push(n[i]);
    return out;
  }
  // Toda a página volta ao topo. Usa-se quando o que está no ecrã passa a ser OUTRA coisa —
  // outra lista, outro ecrã — e não faz sentido aterrar a meio de conteúdo que já não é o mesmo.
  function aoTopo(){
    try { window.scrollTo(0,0); } catch(e){}
    // No telemóvel quem desliza é o cartão da tabela, não a página: sem isto, «voltar ao topo»
    // deixava a lista na mesma altura onde estava.
    try {
      var cs = document.querySelectorAll(".data-card");
      for (var i=0;i<cs.length;i++) cs[i].scrollTop = 0;
    } catch(e){}
  }
  // A barra de cima está colada ao topo e muda de altura (no telemóvel dobra para duas linhas).
  // O cabeçalho das tabelas tem de parar exatamente por baixo dela, por isso mede-se.
  function medirTopo(){
    try {
      var raiz = document.documentElement;
      var tb = document.querySelector(".topbar");
      if (tb) raiz.style.setProperty("--topo", Math.round(tb.getBoundingClientRect().height)+"px");
      // No telemóvel, a altura que a lista pode ocupar não pode ser um palpite: mede-se onde a
      // tabela começa e quanto ocupa a barra de baixo, senão as últimas linhas ficavam
      // escondidas por trás dela — e como quem desliza é o cartão, nunca se lá chegava.
      var card = document.querySelector(".data-card");
      if (card) {
        var acima = card.getBoundingClientRect().top + (window.pageYOffset||0);
        var barra = document.querySelector(".sidebar");
        var hb = (barra && getComputedStyle(barra).position === "fixed") ? barra.getBoundingClientRect().height : 0;
        raiz.style.setProperty("--carta", Math.round(acima + hb + 18) + "px");
      }
    } catch(e){}
  }

  // Opções de categoria com o saldo disponível entre parênteses (referente ao mês em vista no orçamento).
  // Os <option> não aceitam HTML, por isso o estado do alvo vai num símbolo antes do nome
  // (funciona em todo o lado, incluindo no seletor nativo do iPhone). A cor é um extra
  // que só alguns navegadores de computador respeitam.
  var STATUS_MARCA = { ok:"🟢", warn:"🟡", neg:"🔴", none:"⚪", snoozed:"😴" };

  function optCat(cat, m, selId){

      '</div>'+
      '<div class="modal-foot"><span>'+(editing
          ? '<button class="btn danger" data-action="delete-tx" data-id="'+tx.id+'">Eliminar</button>'
          : '<button class="btn sm" data-action="to-split">➗ Dividir</button> <button class="btn sm" data-action="transfer">↔ Transferir</button>')+'</span>'+
        '<span><button class="btn" data-action="close">Cancelar</button> <button class="btn primary" data-action="save-tx" data-id="'+(tx.id||"")+'">Guardar</button></span></div>');
    // Aviso discreto (não bloqueia): movimento numa conta de orçamento sem categoria.
    function txWarn(){
      var acc=lkAcc(el("txAcc").value);
      var o=parseAmount(el("txOut").value); if(isNaN(o)) o=0;
      var e=parseAmount(el("txIn").value);  if(isNaN(e)) e=0;
      var temValor = (Math.abs(o)>0.005 || Math.abs(e)>0.005);
      var semCat = !el("txCat").value;
      var falta = !!(semCat && temValor && precisaCategoria(acc));
      el("txCatWarn").classList.add("hidden");            // substituído pelo aviso único abaixo
      var req=el("txCatReq");
      if (req) {
        req.classList.toggle("hidden", !falta);
        if (falta) req.innerHTML = (acc.type==="credit")
          ? "⚠️ No cartão de crédito a categoria é obrigatória — é ela que faz o orçamento guardar o dinheiro para pagar a dívida."
          : "⚠️ A categoria é obrigatória — sem ela o movimento mexe no saldo da conta mas fica de fora do orçamento.";
      }
    }
    // Contas de acompanhamento estão fora do orçamento: uma transação normal aí não leva categoria.
    // Esconde o campo — exceto se, por engano ou herança, já tiver uma categoria escolhida (para se
    // poder ver e limpar). Cartões e contas de orçamento mostram-no sempre.
    function txCatVis(){
      var acc=lkAcc(el("txAcc").value);
      var esconder = !!(acc && acc.type==="tracking" && !el("txCat").value);
      el("txCatField").classList.toggle("hidden", esconder);
    }
    ["txAcc","txCat","txOut","txIn"].forEach(function(f){
      var n=el(f); if(!n) return;
      n.addEventListener("change", txWarn); n.addEventListener("input", txWarn);
    });
    el("txAcc").addEventListener("change", txCatVis);
    el("txCat").addEventListener("change", txCatVis);
    // Sugere a categoria da última vez que usou este beneficiário — sem nunca
    // sobrepor uma escolha que já tenha feito.
    function sugerirCategoria(){
      if (el("txCat").value) return;
      var accS=lkAcc(el("txAcc").value);
      if (accS && accS.type==="tracking") return;   // conta de acompanhamento não leva categoria
      var c = payeeCategoria(el("txPayee").value);
      if (!c) return;
      el("txCat").value = c;
      el("txCatSug").classList.remove("hidden");
      txWarn();
    }
    el("txPayee").addEventListener("change", sugerirCategoria);
    el("txPayee").addEventListener("blur", sugerirCategoria);
    el("txCat").addEventListener("change", function(){ el("txCatSug").classList.add("hidden"); });
    wirePayeeAutocomplete(el("txPayee"));
    txWarn(); txCatVis();
  }

  // Autocomplete próprio dos beneficiários: filtra à medida que se escreve, sugere a categoria
  // habitual ao lado, e deixa criar um novo (é só usar o texto escrito — os beneficiários nascem
  // das transações). Feito à mão porque o <datalist> nativo não aparece no Safari do iPhone.
  function wirePayeeAutocomplete(input){
    if(!input) return;
    var wrap = input.parentNode, box = null, items = [], active = -1;
    function close(){ if(box && box.parentNode) box.parentNode.removeChild(box); box=null; items=[]; active=-1; }
    function catName(catId){ if(!catId) return ""; if(catId===INCOME) return "Rendimento"; var c=lkCat(catId); return c?c.name:""; }
    function build(q){
      var idx = payeeIndex(), arr=[], qk = payeeKey(q);
      for(var k in idx){ if(!idx.hasOwnProperty(k)) continue; var e=idx[k];
        if(qk && payeeKey(e.name).indexOf(qk)<0) continue;
        arr.push(e);
      }
      arr.sort(function(a,b){
        var as = payeeKey(a.name).indexOf(qk)===0?0:1, bs = payeeKey(b.name).indexOf(qk)===0?0:1;
        return as-bs || b.count-a.count || (a.name<b.name?-1:1);   // começa-por primeiro, depois mais usados
      });
      return arr.slice(0,8);
    }
    function render(){
      var q = input.value.trim();
      var arr = build(q), exact = q && payeeIndex()[payeeKey(q)];
      items = arr.map(function(e){ return { name:e.name, cat:e.cat }; });
      if(q && !exact) items.push({ name:q, isNew:true });
      if(!items.length){ close(); return; }
      if(!box){ box=document.createElement("div"); box.className="ac-list"; wrap.appendChild(box); }
      active = -1;
      box.innerHTML = items.map(function(it,i){
        if(it.isNew) return '<div class="ac-item ac-new" data-i="'+i+'">➕ Usar «'+esc(it.name)+'» (novo)</div>';
        var cn = catName(it.cat);
        return '<div class="ac-item" data-i="'+i+'"><span>'+esc(it.name)+'</span>'+(cn?'<span class="ac-cat">'+esc(cn)+'</span>':'')+'</div>';
      }).join("");
    }
    function highlight(){
      if(!box) return; var nodes=box.querySelectorAll(".ac-item");
      for(var i=0;i<nodes.length;i++) nodes[i].classList.toggle("active", i===active);
      if(active>=0 && nodes[active]) nodes[active].scrollIntoView({block:"nearest"});
    }
    function pick(i){
      var it=items[i]; if(!it) return;
      input.value = it.name; close();
      var ev; try{ ev=new Event("change"); }catch(e){ ev=document.createEvent("Event"); ev.initEvent("change",true,true); }
      input.dispatchEvent(ev);   // dispara a sugestão de categoria e os avisos
      input.focus();
    }
    input.addEventListener("input", render);
    input.addEventListener("focus", render);
    input.addEventListener("keydown", function(e){
      if(!box) return;
      if(e.key==="ArrowDown"){ e.preventDefault(); active=Math.min(items.length-1, active+1); highlight(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(0, active-1); highlight(); }
      else if(e.key==="Enter"){ if(active>=0){ e.preventDefault(); e.stopPropagation(); pick(active); } }
      else if(e.key==="Escape"){ e.stopPropagation(); close(); }
    });
    // mousedown (não click) para escolher antes de o campo perder o foco; preventDefault mantém o foco.
    wrap.addEventListener("mousedown", function(e){
      var it = e.target.closest && e.target.closest(".ac-item");
      if(it){ e.preventDefault(); pick(+it.getAttribute("data-i")); }
    });
    input.addEventListener("blur", function(){ setTimeout(close, 150); });
  }

        : v==="semiannual" ? "Ex.: o mês em que paga o seguro semestral. Indicando-o, a aplicação reparte o que ainda falta pelos meses até lá e avança sozinha para o semestre seguinte. Em branco, reserva 1/6 por mês."
        : "Ex.: o mês em que paga o IUC. Indicando-o, a aplicação reparte o que ainda falta pelos meses até lá e avança sozinha para o ano seguinte. Em branco, reserva 1/12 por mês.";
      var hints = { none:"Sem alvo — a categoria não mostra progresso.",
        monthly:"Quer ter este valor disponível todos os meses (ex.: renda, supermercado).",
        weekly:"Valor por semana. O total do mês = valor × nº desse dia da semana no mês (4 ou 5).",
        quarterly:"Total gasto a cada 3 meses (ex.: seguro trimestral). Deixa de pedir dinheiro assim que tiver o total juntado.",
        semiannual:"Total gasto a cada 6 meses (ex.: seguro semestral). Deixa de pedir dinheiro assim que tiver o total juntado.",
        yearly:"Total gasto uma vez por ano (ex.: IUC, seguro anual). Deixa de pedir dinheiro assim que tiver o total juntado.",
        byDate:"Junta o valor total até ao mês indicado (ex.: férias, entrada de carro)." };
      el("catTargetHint").textContent = hints[v]||"";
      el("catAmtLabel").textContent = v==="monthly" ? "Valor por mês" : (v==="weekly" ? "Valor por semana" : (v==="byDate" ? "Total a juntar" : "Valor total do período"));
    }
    sel.addEventListener("change", syncTargetUI);
    var fundSel = el("catFund"); if (fundSel) fundSel.addEventListener("change", syncTargetUI);
    syncTargetUI();
  }

          '<div style="font-size:12.5px;font-weight:600;margin-top:8px;">'+
            (syncReady() ? ('Ligada — '+esc(_syncStatus||"pronta")) : 'Desligada neste aparelho.')+'</div>'+

          '<div class="hint" style="margin-top:4px;">Mantém o telemóvel e o PC com os mesmos dados — <b>todos os orçamentos</b> — numa cópia cifrada guardada num único gist privado do GitHub.</div>'+
          '<button class="btn" data-action="open-sync" style="width:100%;justify-content:center;margin-top:10px;">☁️ '+(syncReady()?"Gerir sincronização":"Ligar sincronização")+'</button>'+
        '</div>'+
        '<div class="field"><button class="btn" data-action="archived-menu" style="width:100%;justify-content:center;">🗄 Contas e categorias arquivadas</button>'+
          '<div class="hint">Repor o que escondeu do orçamento sem apagar o histórico.</div></div>'+
        (temDados() ? '' : '<div class="field"><button class="btn" data-action="load-sample" style="width:100%;justify-content:center;">🧪 Carregar dados de exemplo</button></div>')+
        '<div class="field"><button class="btn danger" data-action="reset-data" style="width:100%;justify-content:center;">🗑 Apagar todos os dados</button></div>'+
        (function(){ var e=espacoApp(); if(!e) return "";
          return '<div class="hint" id="zonaEspaco" style="border-top:1px solid var(--border);padding-top:10px;">Espaço usado: <b>'+mb(e.total)+
            '</b> de cerca de 5 MB (orçamento '+mb(e.dados)+' · lista do histórico '+mb(e.hist)+').<br>'+
            '<span id="zonaExtra" class="muted">a verificar o resto…</span></div>'; })()+
      '</div>'+
      '<div class="modal-foot"><span class="muted" style="font-size:12px;">Orçamento base-zero · <a href="#" data-action="changelog" style="color:var(--primary);cursor:pointer;">Versão '+APP_VERSION+' — novidades</a></span><button class="btn" data-action="close">Fechar</button></div>');
    // Estado real do armazenamento — as duas coisas que não se veem de outra forma: se os
    // dados estão protegidos contra a limpeza automática do navegador, e quanto espaço têm
    // mesmo disponível (o histórico já não vive no espaço apertado dos ~5 MB).
    (function(){
      var alvo = el("zonaExtra"); if(!alvo) return;
      var partes = [];
      function mostrar(){ alvo.innerHTML = partes.length ? partes.join(" &nbsp;·&nbsp; ") : ""; }
      function fim(){ mostrar(); }
      try {
        if (navigator.storage && navigator.storage.estimate) {
          navigator.storage.estimate().then(function(q){
            if (q && q.quota) partes.unshift("Histórico e restantes cópias: <b>"+mb(q.usage||0)+"</b> de <b>"+
              (q.quota>1073741824 ? (q.quota/1073741824).toFixed(1).replace(".",",")+" GB" : mb(q.quota))+"</b> disponíveis");
            mostrar();
          })["catch"](fim);
        }
        if (navigator.storage && navigator.storage.persisted) {
          navigator.storage.persisted().then(function(ok){
            partes.push(ok ? "🔒 Protegido: o navegador não apaga estes dados sozinho"
                           : "⚠️ Ainda não protegido — o navegador pode apagar os dados se não usar a aplicação durante uns dias");
            mostrar();
          })["catch"](fim);
        } else {
          partes.push("Este navegador não diz se protege os dados.");
          mostrar();
        }
      } catch(e){ alvo.textContent = ""; }
    })();
    el("importFile").addEventListener("change", function(e){ importJSON(e.target.files[0]); });
    el("curSel").addEventListener("change", function(){ state.settings.currency=el("curSel").value; save(); render(); dataModal(); });
  }

    arr.sort(ordem==="recentes" ? function(a,b){ return (a.e.lastDate<b.e.lastDate?1:(a.e.lastDate>b.e.lastDate?-1:0)) || porNome(a,b); }
           : ordem==="nome"     ? porNome
           :                      function(a,b){ return b.e.count-a.e.count || porNome(a,b); });

    var corpo;
    if (!arr.length) {
      corpo = '<div class="muted" style="text-align:center;padding:20px 0;">Ainda não há beneficiários — aparecem aqui à medida que for registando transações.</div>';
    } else {
      corpo = '<div class="ac-wrap" style="margin-bottom:8px;"><input id="pyFilter" class="search" autocomplete="off" placeholder="Filtrar beneficiários…" style="width:100%;padding-inline-end:34px;">'+
        '<button type="button" class="date-btn" data-action="py-filter-clear" style="pointer-events:auto;cursor:pointer;color:var(--text-muted);" title="Limpar filtro" aria-label="Limpar filtro">✕</button></div>'+
        '<div class="field" style="margin-bottom:10px;"><select id="pyOrdem">'+
          '<option value="usados"'+(ordem==="usados"?" selected":"")+'>Dos que mais usa para os que menos usa</option>'+
          '<option value="recentes"'+(ordem==="recentes"?" selected":"")+'>Dos mais recentes para os mais antigos</option>'+
          '<option value="nome"'+(ordem==="nome"?" selected":"")+'>Por ordem alfabética</option>'+
        '</select></div>'+
        '<div id="pyEmpty" class="muted hidden" style="text-align:center;padding:16px 0;">Nenhum beneficiário corresponde.</div>'+
        '<div id="pyList" style="max-height:340px;overflow:auto;">' + arr.map(function(x){
        // Os dois botões vão na MESMA célula da grelha (a .int-row tem 3 colunas: 1fr auto auto).
        // Postos como dois filhos separados, o segundo caía para a linha de baixo.
        return '<div class="int-row" data-pk="'+esc(payeeKey(x.e.name))+'"><span class="who"><b>'+esc(x.e.name)+'</b>'+
          // Sem a categoria: um nome comprido voltava a cortar a linha, e a informação era pouco
          // fiável (era só a ÚLTIMA usada, não a habitual) — quem quiser vê-as todas no 📊.
          // Sem ela sobra espaço para dizer «transações» por extenso mesmo no telemóvel; só o
          // «última em» é que se abrevia, para caber num iPhone pequeno.
          '<span class="tag">'+x.e.count+' transaç'+(x.e.count===1?'ão':'ões')+
            '<span class="rot"> · última em </span><span class="so-fone"> · </span>'+
            fmtDate(x.e.lastDate)+'</span></span>'+
          '<span></span>'+
          // Só os ícones: com o rótulo por extenso os dois botões comiam 163px dos 432 úteis da
          // janela, e a descrição (que precisa de ~290px) era cortada com "…". Assim sobram 356px
          // e cabe inteira. O que fazem fica no title (rato) e no aria-label (leitor de ecrã).
          '<span class="py-acoes">'+
            '<button class="btn sm py-ico" data-action="payee-report" data-id="'+x.k+'" title="Ver as transações e o total deste beneficiário" aria-label="Ver transações e totais de '+esc(x.e.name)+'">📊</button>'+
            '<button class="btn sm py-ico" data-action="rename-payee" data-id="'+x.k+'" title="Mudar o nome deste beneficiário" aria-label="Mudar o nome de '+esc(x.e.name)+'">✎</button>'+
          '</span></div>';
      }).join("") + '</div>';
    }
    openModal(
      '<div class="modal-head"><h2>🏷 Beneficiários</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        '<p class="muted" style="margin-top:0;">Os nomes que já usou, do mais frequente para o menos. São eles que alimentam as sugestões ao escrever uma transação.<br>'+
        'Mudar um nome altera <b>todas</b> as transações e regras onde aparece. Se lhe der um nome que já existe, os dois <b>juntam-se</b> num só — é assim que se corrige um «Continemte» ou se unificam variantes.</p>'+
        corpo+
      '</div>'+
      '<div class="modal-foot"><span class="muted" style="font-size:12px;">'+arr.length+' beneficiário'+(arr.length===1?'':'s')+'</span><button class="btn" data-action="close">Fechar</button></div>');
  }

  function integrityModal(){
    var m=state.ui.month;
    var dv=integrityDelta(m), iss=integrityIssues(m);
    var caixa=budgetCashUpto(m), orc=budgetedTotal(m);

    var GRUPOS = [
      ["semCat",       "Movimentos sem categoria",
                       "Mexeram no saldo da conta mas não passaram por nenhuma categoria, por isso o orçamento não deu por eles."],
      ["orfa",         "Categoria apagada entretanto",
                       "A categoria destes movimentos já não existe, e o dinheiro deles ficou sem destino no orçamento."],
      ["paraFora",     "Transferências que entram ou saem do orçamento",
                       "Movem dinheiro entre uma conta de orçamento e uma de acompanhamento. Dê-lhes categoria para o orçamento acompanhar."],
      ["rendFora",     "Rendimento fora das contas de orçamento",
                       "Foram marcados como «Rendimento» numa conta que não entra no orçamento, por isso aumentaram o Pronto a atribuir sem haver dinheiro que lhe corresponda."],
      ["categFora",    "Categoria numa conta fora do orçamento",
                       "Contas de acompanhamento estão fora do orçamento. Dar-lhes categoria mexe no «Disponível» dessa categoria sem haver dinheiro do orçamento por trás."],
      ["transfCat",    "Transferências com categoria a mais",
                       "Só devem ter categoria as transferências que atravessam a fronteira do orçamento. Estas têm-na sem a atravessar, e por isso contam o movimento duas vezes."],
      ["transfCartao", "Transferências entre cartão e conta de acompanhamento",
                       "Mexem na reserva para a fatura do cartão sem que saia dinheiro do orçamento. Registe o pagamento do cartão a partir de uma conta de orçamento."],
      ["meia",         "Transferências a que falta a outra metade",
                       "Só existe um dos dois lados — normalmente de dados importados de um ficheiro alterado à mão."]
    ];

    function linha(x){
      var accao = (x.motivo==="paraFora" || x.motivo==="transfCat")
        ? '<button class="btn sm" data-action="fix-transfer" data-id="'+x.t.id+'">Categorizar</button>'
        : '<button class="btn sm" data-action="edit-tx" data-id="'+x.t.id+'">Corrigir</button>';
      var onde = x.outra ? ("para "+esc(x.outra.name)) : esc(x.acc.name);
      return '<div class="int-row"><span class="who"><b>'+esc(x.t.payee||"(sem beneficiário)")+'</b>'+
        '<span class="tag">'+fmtDate(x.t.date)+' · '+esc(x.acc.name)+(x.outra?(' → '+esc(x.outra.name)):'')+'</span></span>'+
        '<span class="amt '+(x.delta<0?"tx-amt out":"tx-amt in")+'">'+fmt(x.delta)+'</span>'+
        accao+'</div>';
    }

    var corpo =
      '<div class="field" style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;">'+
        '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Dinheiro nas contas de orçamento</span><b style="font-variant-numeric:tabular-nums;">'+fmt(caixa)+'</b></div>'+
        '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Pronto a atribuir + Disponível das categorias</span><b style="font-variant-numeric:tabular-nums;">'+fmt(orc)+'</b></div>'+
        '<div style="display:flex;justify-content:space-between;padding:7px 0 0;margin-top:5px;border-top:1px solid var(--border);font-weight:700;">'+
          '<span>Diferença</span><b class="'+(dv<0?"tx-amt out":"tx-amt in")+'" style="font-variant-numeric:tabular-nums;">'+fmt(dv)+'</b></div>'+
      '</div>';

    if (!iss.itens.length && Math.abs(dv) < 0.005) {
      corpo += '<div class="muted" style="text-align:center;padding:18px 0;">✅ Está tudo certo — cada euro nas contas de orçamento tem uma função.</div>';
    } else {
      GRUPOS.forEach(function(g){
        var lista = iss.itens.filter(function(x){ return x.motivo===g[0]; });
        if(!lista.length) return;
        var soma=0; lista.forEach(function(x){ soma+=x.delta; });
        corpo += '<div class="field"><label>'+g[1]+' ('+lista.length+' · '+fmt(round2(soma))+')</label>'+
          '<div class="hint" style="margin:-2px 0 8px;">'+g[2]+'</div>'+
          '<div style="max-height:210px;overflow:auto;">'+lista.map(linha).join("")+'</div></div>';
      });
      var explicado=0; iss.itens.forEach(function(x){ explicado+=x.delta; });
      var resto=round2(dv-explicado);
      if (Math.abs(resto) >= 0.005) {
        corpo += '<div class="hint" style="color:var(--negative);font-weight:600;">Faltam '+fmt(resto)+
          ' que os movimentos acima não explicam. Exporte uma cópia de segurança antes de mexer.</div>';
      }
    }

    if (iss.cartaoSemCat > 0) {
      corpo += '<div class="hint" style="border-top:1px solid var(--border);padding-top:10px;">ℹ️ Há <b>'+iss.cartaoSemCat+
        '</b> movimento(s) no cartão de crédito <b>sem categoria</b>, criado(s) antes de a categoria passar a ser obrigatória. '+
        'Numa <b>compra</b>, é a categoria que faz o orçamento guardar o dinheiro para pagar o cartão; numa <b>devolução</b>, é ela que devolve o dinheiro à categoria onde tinha gasto. '+
        'Abra a conta do cartão e escolha a categoria de cada um.</div>';
    }

    openModal(
      '<div class="modal-head"><h2>🔍 Orçamento vs. contas — '+monthLabel(m)+'</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        '<p class="muted" style="margin-top:0;">Num orçamento base-zero, o dinheiro nas contas de orçamento tem de ser exatamente igual ao que está por atribuir mais o disponível de todas as categorias. Quando não bate, é porque houve movimentos que o orçamento não conseguiu acompanhar.</p>'+
        corpo+
      '</div>'+
      '<div class="modal-foot"><span></span><button class="btn primary" data-action="close">Fechar</button></div>');
  }

      '</div>';

    openModal(

  function helpModal() {
    function sec(t){ return '<div style="font-weight:700;color:var(--text);margin:16px 0 6px;font-size:13px;">'+t+'</div>'; }
    openModal(
      '<div class="modal-head"><h2>❓ Como funciona</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body"><div class="help-list">'+

      sec("O essencial")+
      '<ul style="margin:0;padding-inline-start:18px;">'+
        '<li><b>Dê uma função a cada euro.</b> O <b>Pronto a atribuir</b> é o dinheiro por distribuir — o objetivo é chegar a 0 €.</li>'+
        '<li>Os <b>rendimentos</b> entram como transações de <b>Entrada</b> com a categoria «Rendimento».</li>'+
        '<li>O que atribui fica em <b>Disponível</b> e transita de mês para mês.</li>'+
        '<li><b>Excesso</b> (a vermelho): gastou mais do que tinha atribuído. Atribua mais para o cobrir, ou use o <b>🩹</b> na linha da categoria para ir buscar o dinheiro a outra.</li>'+
        '<li><b>O excesso transita com a categoria.</b> Se acabar o mês a vermelho, a categoria <b>começa o mês seguinte com esse valor negativo</b> — e continua vermelha até o cobrir. O dinheiro que atribuir em primeiro lugar tapa o buraco: só depois de chegar a zero é que fica disponível para gastar. Assim a dívida fica onde foi criada, à vista, em vez de desaparecer para uma conta geral.</li>'+
      '</ul>'+

      sec("Alvos")+
      '<ul style="margin:0;padding-inline-start:18px;">'+
        '<li>Definem-se no <b>✎</b> de cada categoria: mensal, semanal, trimestral, semestral, anual, ou até uma data.</li>'+
        '<li>No mensal, «<b>Repor até X</b>» acrescenta só o que falta para ter X disponível; «<b>Reservar X</b>» acrescenta sempre X, mesmo que já o tenha.</li>'+
        '<li>Trimestral, <b>semestral</b> e anual <b>param de pedir</b> quando já tiver o total. Indicando o mês da despesa, repartem o que falta até lá.</li>'+
        '<li><b>😴 Adiar este mês:</b> num alvo que ainda pede dinheiro, o <b>😴</b> na linha da categoria diz para <b>não chatear só este mês</b> — deixa de aparecer a amarelo e sai do «Financiar alvos». No mês seguinte volta ao normal, ou reative antes com o <b>☀️</b>. Para ver de uma vez tudo o que adiou, use o filtro <b>😴 Adiadas</b> na barra do orçamento — adiadas não são nem «abaixo do alvo» nem «cumpridas», por isso não aparecem nesses.</li>'+
      '</ul>'+

      sec("Distribuir o dinheiro")+
      '<ul style="margin:0;padding-inline-start:18px;">'+
        '<li><b>🎯 Financiar alvos</b> — <i>Pronto a atribuir → categorias.</i> Está sempre disponível. Dá a cada categoria o que lhe falta para cumprir o alvo do mês. Pode <b>financiar tudo</b>, ou <b>repartir só o que está por atribuir</b> — esta nunca o deixa negativo, e reparte de três maneiras: <b>por prioridade</b> (serve as Altas primeiro), <b>proporcional</b> (todas ficam igualmente perto do alvo — quem precisa de mais leva mais) ou <b>pela ordem da lista</b> (completa de cima para baixo até acabar).</li>'+

  var _covSel = null, _covAlvo = null, _covFalta = 0, _covFontes = null;

  function coverModal(alvoId, keepSel) {
    var m = state.ui.month, cat = categoryById(alvoId);
    if (!cat) return;
    var falta = round2(-availableFor(alvoId, m));
    if (falta <= 0.005) { toast("Esta categoria já não está negativa."); return; }
    var modo = state.ui.coverMode || "prio";
    var fontes = coverSources(alvoId, m);
    _covAlvo = alvoId; _covFalta = falta; _covFontes = fontes;
    if (!(keepSel && _covSel)) _covSel = coverAuto(fontes, falta, modo);

    if (!fontes.length) {
      openModal(
        '<div class="modal-head"><h2>🩹 Cobrir «'+esc(cat.name)+'» — '+monthLabel(m)+'</h2><button class="x" data-action="close">×</button></div>'+
        '<div class="modal-body">'+
        opIntro('Gastou <b>'+fmt(falta)+'</b> a mais nesta categoria, mas <b>nenhuma outra tem dinheiro parado</b> nem há nada por atribuir.',
          "Nenhuma origem", "«"+esc(cat.name)+"»")+
        '<p class="muted" style="margin:0;">Só há duas saídas: registar mais rendimento, ou aceitar o excesso e deixá-lo passar para o mês seguinte.</p></div>'+
        '<div class="modal-foot"><span></span><button class="btn" data-action="close">Fechar</button></div>');
      return;
    }

    var linhas = coverOrder(fontes, modo).map(function(f){
      var v = _covSel[f.id] || 0;
      return '<div class="cov-row">'+
        '<div class="cov-nome">'+(f.rta ? '💵 ' : '<span class="prio-dot p-'+f.prio+'">'+PRIO_ICON[f.prio]+'</span> ')+esc(f.name)+
          '<span class="tag">tem '+fmt(f.max)+(f.rta?'':' · prioridade '+PRIO_LABEL[f.prio].toLowerCase())+'</span></div>'+
        '<input type="range" class="cov-slider" data-cov="'+f.id+'" min="0" max="'+f.max+'" step="0.01" value="'+v+'">'+
        '<b class="cov-val" id="cv_'+f.id+'">'+fmt(v)+'</b></div>';
    }).join("");

    openModal(
      '<div class="modal-head"><h2>🩹 Cobrir «'+esc(cat.name)+'» — '+monthLabel(m)+'</h2><button class="x" data-action="close">×</button></div>'+
      '<div class="modal-body">'+
        opIntro('Gastou <b>'+fmt(falta)+'</b> a mais nesta categoria — o objetivo é <b>trazê-la a zero</b>. Escolha de onde tirar esse valor.',
          "Outras categorias", "«"+esc(cat.name)+"»")+
        '<div class="field"><label>De onde tirar</label><select id="covModo">'+
          '<option value="prio"'+(modo==="prio"?" selected":"")+'>Primeiro das prioridades mais baixas</option>'+
          '<option value="folga"'+(modo==="folga"?" selected":"")+'>Primeiro de quem tem mais folga</option>'+
          '<option value="manual"'+(modo==="manual"?" selected":"")+'>Manual — escolho eu</option>'+
        '</select></div>'+
        '<div id="covKpis">'+opKpis("Em falta", fmt(-falta), "neg", "cobrir", fmt(coverTotal(_covSel)), fmt(round2(coverTotal(_covSel)-falta)), "")+'</div>'+
        '<div class="cov-sum"><span id="covFal"></span></div>'+
        '<div class="cov-list">'+linhas+'</div>'+
      '</div>'+
      '<div class="modal-foot"><span></span><span><button class="btn" data-action="close">Cancelar</button> '+
        '<button class="btn primary" id="covOk" data-action="preview-cover">Cobrir '+fmt(coverTotal(_covSel))+'</button></span></div>');

    function pinta(){
      var tot = coverTotal(_covSel), resta = round2(_covFalta - tot), fica = round2(tot - _covFalta);
      el("covKpis").innerHTML = opKpis("Em falta", fmt(-_covFalta), "neg", "cobrir", fmt(tot), fmt(fica), fica < -0.005 ? "neg" : "pos");
      el("covFal").textContent = resta > 0.005 ? ("Ainda faltam "+fmt(resta)+" — puxe mais algum cursor.") : "✅ Buraco tapado.";
      el("covFal").className = resta > 0.005 ? "muted" : "pos";
      el("covOk").disabled = tot <= 0.005;
      el("covOk").textContent = "Cobrir "+fmt(tot);
    }
    var sliders = document.querySelectorAll("[data-cov]");
    for (var i=0;i<sliders.length;i++) {
      sliders[i].addEventListener("input", function(ev){
        var id = ev.target.getAttribute("data-cov"), pedido = round2(parseFloat(ev.target.value)||0);
        // Nunca deixar juntar mais do que o buraco: o que sobrar é devolvido ao cursor.
        var outros = 0;
        for (var k in _covSel) if (_covSel.hasOwnProperty(k) && k !== id) outros += _covSel[k]||0;
        var tecto = round2(_covFalta - outros);
        if (pedido > tecto) { pedido = Math.max(0, tecto); ev.target.value = pedido; }
        _covSel[id] = pedido;
        el("cv_"+id).textContent = fmt(pedido);
        pinta();
      });
    }
    el("covModo").addEventListener("change", function(ev){
      state.ui.coverMode = ev.target.value; save(); coverModal(alvoId);
    });
    pinta();
  }

                   categoryId:"", memo:"", outflow:0, inflow:0, active:true };

      _rec.tipo = (r && r.toAccountId) ? "transf" : "normal";
    }
    var s = _rec, editing = !!s._id, ehTransf = s.tipo==="transf";
    if (ehTransf && state.accounts.length<2){ toast("Precisa de pelo menos duas contas para transferir."); s.tipo="normal"; ehTransf=false; }
    function opts(sel){ return state.accounts.filter(function(a){return !a.hidden || a.id===sel;}).map(function(a){ return '<option value="'+a.id+'"'+(sel===a.id?" selected":"")+'>'+esc(a.name)+'</option>'; }).join(""); }
    if (ehTransf && !s.toAccountId) { for(var j=0;j<state.accounts.length;j++){ if(state.accounts[j].id!==s.accountId){ s.toAccountId=state.accounts[j].id; break; } } }
    function fo(v,l){ return '<option value="'+v+'"'+(s.freq===v?" selected":"")+'>'+l+'</option>'; }

  // ---------- Ações ----------
  // Aceita vírgula OU ponto como separador de cêntimos (sem separador de milhares).
  // Uma conta escrita à mão no campo ("120+35-10") vale o seu resultado. Exige dígitos dos DOIS
  // lados de cada sinal — é o que impede a colisão com as convenções de sinal dos extratos:
  // "-45,90", "45,90-" (sinal à direita, como alguns bancos escrevem) e "(45,90)" continuam a
  // ser lidos como valores negativos, e não como contas por acabar.
  function avaliaExpr(s){
    s = String(s==null?"":s).replace(/\s+/g, "");
    if (!/^[0-9.,]+(?:[+\-][0-9.,]+)+$/.test(s)) return null;
    var partes = s.match(/[+\-]?[0-9.,]+/g);
    if (!partes) return null;
    var total = 0;
    for (var i=0;i<partes.length;i++){
      var v = parseAmount(partes[i]);          // reaproveita a leitura pt-PT de cada parcela
      if (isNaN(v)) return null;
      total += v;
    }
    if (!isFinite(total) || Math.abs(total) > MAX_VALOR) return null;
    return round2(total);
  }
  function parseAmount(s){
    if (typeof s === "number") return s;
    s = String(s==null?"":s).trim();
    if (!s) return NaN;
    var exp = avaliaExpr(s);                   // "120+35" vale 155 em qualquer campo de dinheiro
    if (exp !== null) return exp;
    // Negativo pode vir como "-45,90", "45,90-" (alguns bancos põem o sinal à direita) ou entre
    // parênteses, "(45,90)" — a convenção contabilística que o Excel e vários extratos usam. Sem
    // reconhecer os parênteses, uma despesa era importada como ENTRADA de dinheiro.
    var neg = s.indexOf("-") >= 0 || (/\(\s*[0-9][0-9.,\s]*\)/.test(s));
    s = s.replace(/[^0-9.,]/g, "");
    if (!s) return NaN;
    var di = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
    var intp, frac;
    if (di === -1) { intp = s; frac = ""; }
    else { intp = s.slice(0, di).replace(/[.,]/g, ""); frac = s.slice(di+1).replace(/[.,]/g, ""); }
    var v = parseFloat((intp || "0") + (frac ? ("." + frac) : ""));
    if (isNaN(v)) return NaN;
    // Fora de escala conta como inválido. Este é o único sítio por onde passam TODOS os
    // valores (formulários e importação de CSV) — sem isto, um número absurdo vindo de um
    // ficheiro tornava-se Infinity e envenenava todas as somas do orçamento.
    if (!isFinite(v) || v > MAX_VALOR) return NaN;
    return neg ? -v : v;
  }
  function amtStr(n){ if (n===""||n===null||n===undefined||n===0) return ""; return String(n).replace(".", ","); }

  // ---------- Limites do que pode entrar ----------
  // Tudo o que se escreve vai parar ao armazenamento do navegador (~5 MB), ao ficheiro de
  // cópia e ao gist. Sem tecto, um texto colado por engano ou um ficheiro enorme enchem tudo.
  var LIM_NOME = 60, LIM_PAYEE = 100, LIM_NOTA = 300, LIM_TOKEN = 255;
  var MAX_VALOR = 1e12;                    // chega para qualquer orçamento pessoal
  var MAX_FICH_JSON = 20*1024*1024;        // 20 MB
  var MAX_FICH_CSV  = 10*1024*1024;        // 10 MB
  var MAX_LINHAS_CSV = 20000;
  function corta(s, n){ s=String(s==null?"":s).trim(); return s.length>n ? s.slice(0,n) : s; }

  // ---------- Campos de valor ----------
  // Deixa passar apenas dígitos e UM separador decimal, com 9 inteiros e 2 decimais no máximo.
  // Havendo vários separadores, o último é o decimal e os anteriores eram de milhares — assim
  // colar «1.234,56» do banco dá 1234,56 em vez de estragar o número.
  var LIM_INT = 9, LIM_DEC = 2;
  function limpaValor(txt, permiteNegativo){
    var s = String(txt==null?"":txt);
    var neg = permiteNegativo && s.indexOf("-") >= 0;
    s = s.replace(/[^0-9.,]/g, "");
    var ult = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
    var intp, frac = null, sep = ",";
    if (ult < 0) { intp = s; }
    else { sep = s.charAt(ult); intp = s.slice(0, ult).replace(/[.,]/g, ""); frac = s.slice(ult+1).replace(/[.,]/g, ""); }
    intp = intp.slice(0, LIM_INT);
    if (frac !== null) frac = frac.slice(0, LIM_DEC);
    return (neg?"-":"") + intp + (frac===null ? "" : sep+frac);
  }
  // Como limpaValor, mas deixa passar os sinais + e − para se poder escrever a conta no campo.
  // Cada parcela é limitada como um valor normal; sinais repetidos ficam reduzidos a um só.
  function limpaExpr(txt, permiteNegativo){
    var s = String(txt==null?"":txt).replace(/[^0-9.,+\-]/g, "");
    // Sinais seguidos: vale o ÚLTIMO, que é o que a pessoa acabou de escrever ao corrigir-se.
    // "5++3" -> "5+3"; "5+-3" -> "5-3" (trocou a soma por subtração).
    s = s.replace(/[+\-]{2,}/g, function(m){ return m.charAt(m.length-1); });
    s = permiteNegativo ? s.replace(/^\+/, "") : s.replace(/^[+\-]+/, "");
    var toks = s.split(/([+\-])/), out = "";
    for (var i=0;i<toks.length;i++) out += (toks[i]==="+"||toks[i]==="-") ? toks[i] : limpaValor(toks[i], false);
    return out;
  }
  function mb(bytes){ return (bytes/1048576).toFixed(1).replace(".", ",")+" MB"; }

    if (isNaN(v)) {

      return 0;
    }
    return round2(v);

    "delete-account": function(id){
      var a = accountById(id); if(!a) return;
      // Uma transferência tem uma metade em cada conta. Apagar só a metade desta conta
      // deixaria a outra órfã; apagar as duas mudaria o saldo de uma conta que fica.
      // A saída certa é a outra metade sobreviver como movimento normal.
      var paresTocados = {}, nOutras = 0, i, t;
      for (i=0;i<state.transactions.length;i++){ t=state.transactions[i]; if(t.transfer && t.accountId===id) paresTocados[t.transfer]=true; }
      for (i=0;i<state.transactions.length;i++){ t=state.transactions[i]; if(t.transfer && paresTocados[t.transfer] && t.accountId!==id) nOutras++; }
      var aviso = "Eliminar a conta «"+a.name+"» e todas as suas transações?";
      if (nOutras) aviso += "\n\n"+nOutras+" transferência"+(nOutras===1?"":"s")+" ligava"+(nOutras===1?"":"m")+
        " esta conta a outras. A outra metade fica onde está, como movimento normal — o saldo dessas contas não muda, mas pode precisar de lhe dar categoria.";
      if (!confirm(aviso)) return;
      pushUndo("Conta «"+a.name+"» eliminada.");
      if (a.paymentCatId) removePaymentCategory(a);
      state.accounts = state.accounts.filter(function(x){return x.id!==id;});
      // Um cartão podia ter esta conta como "conta de pagamento predefinida". Sem limpar, ficava
      // uma referência morta e o "💳 Pagar" pré-selecionava uma conta que já não existe.
      for (var pf=0; pf<state.accounts.length; pf++) if(state.accounts[pf].payFrom===id) state.accounts[pf].payFrom=null;
      state.transactions = state.transactions.filter(function(x){return x.accountId!==id;});
      for (i=0;i<state.transactions.length;i++){ t=state.transactions[i]; if(t.transfer && paresTocados[t.transfer]) delete t.transfer; }
      // regras recorrentes que usavam esta conta como origem OU como destino
      state.recurring = (state.recurring||[]).filter(function(r){ return r.accountId!==id && r.toAccountId!==id; });
      if (state.ui.openAccount===id) state.ui.openAccount=null;
      closeModal(); save(); render(); showUndo();
    },

      pushUndo("Transação duplicada.");
      var msg="Transação duplicada (por confirmar).";
      if (t.transfer) {
        var np=uid(), halves=state.transactions.filter(function(x){return x.transfer===t.transfer;});
        halves.forEach(function(h){ state.transactions.push(copyOf(h,{transfer:np})); });
        msg="Transferência duplicada (por confirmar).";
        logMove("⧉ Duplicou transferência", null);
      } else if (t.split) {
        var ns=uid(), parts=state.transactions.filter(function(x){return x.split===t.split;});
        parts.forEach(function(p){ state.transactions.push(copyOf(p,{split:ns})); });
        msg="Transação dividida duplicada ("+parts.length+" partes, por confirmar).";
        logMove("⧉ Duplicou transação dividida ("+parts.length+" partes)", null);
      } else {
        state.transactions.push(copyOf(t));
        logMove("⧉ Duplicou: "+(t.payee||t.memo||"transação"), round2((t.inflow||0)-(t.outflow||0)));

      save(); render(); toast(msg); showUndo();
    },

      if(!confirm("Eliminar esta categoria? As transações ficam sem categoria.")) return;
      pushUndo("Categoria «"+(pc?pc.name:"")+"» eliminada.");
      state.categories=state.categories.filter(function(c){return c.id!==id;});
      for (var t=0;t<state.transactions.length;t++) if(state.transactions[t].categoryId===id) state.transactions[t].categoryId=null;
      for (var k in state.assignments) if(state.assignments.hasOwnProperty(k) && k.split("|")[0]===id) delete state.assignments[k];
      // As regras recorrentes também apontavam para a categoria apagada: continuavam ativas e
      // passavam a lançar, TODOS os meses, transações com uma categoria que já não existe — que
      // depois apareciam como "órfãs" no aviso de integridade. Desativam-se para o utilizador
      // decidir o que fazer, em vez de desaparecerem em silêncio.
      var recAfetadas=0;
      for (var r=0;r<(state.recurring||[]).length;r++){
        if(state.recurring[r].categoryId===id){ state.recurring[r].categoryId=null; state.recurring[r].active=false; recAfetadas++; }
      }
      for (var sk in state.snooze) if(state.snooze.hasOwnProperty(sk) && sk.split("|")[0]===id) delete state.snooze[sk];
      state.ui.lastFunding=null;
      if(recAfetadas) toast(recAfetadas+" regra"+(recAfetadas===1?"":"s")+" recorrente"+(recAfetadas===1?"":"s")+" usava"+(recAfetadas===1?"":"m")+" esta categoria — ficou"+(recAfetadas===1?"":"ram")+" em pausa até lhe dar outra.");
      closeModal(); save(); render(); showUndo();

    "apply-cover": function(){
      var m=state.ui.month, alvo=_covAlvo, sel=_covSel;
      if(!alvo||!sel){ return; }
      var tot=coverTotal(sel);
      if(tot<=0.005){ toast("Escolha de onde tirar o dinheiro."); return; }
      pushUndo("Excesso coberto.");
      var snap=[], nFontes=0;
      function guarda(key){ snap.push({key:key, prev: state.assignments.hasOwnProperty(key)?state.assignments[key]:null}); }
      for(var id in sel){
        if(!sel.hasOwnProperty(id)) continue;
        var t=sel[id]; if(t<=0.005) continue;
        nFontes++;
        // Do «Pronto a atribuir» não há nada a descontar: é dinheiro ainda sem função.
        if(id!==RTA_ID){ var kf=id+"|"+m; guarda(kf); state.assignments[kf]=round2((state.assignments[kf]||0)-t); }
      }
      var ka=alvo+"|"+m; guarda(ka); state.assignments[ka]=round2((state.assignments[ka]||0)+tot);
      state.ui.lastFunding={month:m, entries:snap};
      var nome=(categoryById(alvo)||{}).name||"";
      logMove("🩹 Cobriu «"+nome+"»", tot);
      _covSel=null; _covAlvo=null; _covFontes=null;
      closeModal(); save(); render();
      toast("Coberto "+fmt(tot)+" em «"+nome+"» — pode anular no topo.");
    },
    "fund-one": function(id){
      var m=state.ui.month; var c=categoryById(id); if(!c) return;
      var ti=targetInfo(c,m); if(!ti||!(ti.need>0)){ toast("Alvo já cumprido."); return; }
      // O 🎯 tira sempre do «Pronto a atribuir». Se não chegar, avisa ANTES — o mesmo cuidado que a
      // janela de financiar em lote já tinha. Sem isto, um toque podia pôr o mês a vermelho sem dar
      // por isso. (Deixa passar se o utilizador confirmar: às vezes é mesmo o que se quer.)
      var rtaDepois = round2(readyToAssign(m) - ti.need);
      if (rtaDepois < -0.005 && !confirm(
            "Financiar «"+c.name+"» precisa de "+fmt(ti.need)+", mas só tem "+fmt(readyToAssign(m))+" por atribuir.\n\n"+
            "O «Pronto a atribuir» ficaria negativo em "+fmt(-rtaDepois)+".\n\n"+
            "Financiar mesmo assim?")) return;
      pushUndo("Alvo financiado.");
      var key=id+"|"+m;
      state.ui.lastFunding={month:m, entries:[{key:key, prev: state.assignments.hasOwnProperty(key)?state.assignments[key]:null}]};
      state.assignments[key]=round2((state.assignments[key]||0)+ti.need);
      logMove("🎯 Financiou «"+c.name+"»", ti.need);
      save(); render();
      toast(rtaDepois < -0.005
        ? ("Alvo financiado — o «Pronto a atribuir» ficou negativo em "+fmt(-rtaDepois)+".")
        : "Alvo financiado — pode anular no topo.");
    },

    "save-recurring": function(id){
      readRec();
      var d = _rec;
      if(!d.accountId){ toast("Selecione uma conta."); return; }
      var dados;
      if (d.tipo==="transf") {
        if(!d.toAccountId){ toast("Selecione a conta de destino."); return; }
        if(d.toAccountId===d.accountId){ toast("Escolha contas diferentes."); return; }
        var valor = round2((d.outflow||0) || (d.inflow||0));
        if(valor<=0){ toast("Indique um valor."); return; }
        var fa=accountById(d.accountId), ta=accountById(d.toAccountId);
        var cruza = !!(fa && ta && crossesBudget(fa,ta));
        if(cruza && !d.categoryId){ toast("Escolha a categoria — este movimento entra ou sai do orçamento."); return; }
        dados = { nextDate:d.nextDate||todayISO(), freq:d.freq, accountId:d.accountId, toAccountId:d.toAccountId,
                  payee:"", categoryId: cruza ? d.categoryId : null, memo:d.memo||"",
                  outflow:valor, inflow:0, active:!!d.active };
      } else {
        if((d.outflow||0)===0 && (d.inflow||0)===0){ toast("Indique um valor de saída ou entrada."); return; }
        if((d.outflow||0)>0 && (d.inflow||0)>0){ toast("Preencha só a Saída OU a Entrada, não as duas."); return; }
        var accR=accountById(d.accountId);
        // Mesma regra da transação avulsa (precisaCategoria): senão a regra passaria a lançar
        // TODOS os meses movimentos que o orçamento não acompanha — o pior sítio para os deixar.
        if(!d.categoryId && precisaCategoria(accR)){
          toast(accR.type==="credit" ? "Escolha a categoria — no cartão de crédito é obrigatória."
                                     : "Escolha a categoria — sem ela o movimento fica de fora do orçamento.");
          return;
        }
        dados = { nextDate:d.nextDate||todayISO(), freq:d.freq, accountId:d.accountId, toAccountId:null,
                  payee:d.payee||"", categoryId:(accR && accR.type==="tracking") ? null : (d.categoryId||null), memo:d.memo||"",
                  outflow:d.outflow||0, inflow:d.inflow||0, active:!!d.active };
      }
      // Dia pretendido da regra: fixa-se aqui, a partir da data escolhida. É o que permite a uma
      // regra do dia 31 voltar ao 31 depois de passar por fevereiro (ver advanceDate).
      dados.dia = +String(dados.nextDate).slice(8,10) || null;
      pushUndo(d._id ? "Recorrente alterada." : "Recorrente criada.");
      if(d._id){ var r=recById(d._id); for(var k in dados) r[k]=dados[k]; }
      else { dados.id=uid(); state.recurring.push(dados); }
      _rec=null; closeModal(); save();
      var posted=processRecurring(); render();
      toast(posted>0?("Regra guardada — lançadas "+posted+" já em atraso."):"Regra recorrente guardada.");
    },

    // Troca APENAS o token (ex.: expirou ou foi revogado). Preserva o gist, a palavra-passe e o
    // estado de sincronização (baseRev/syncedSig), por isso NÃO dispara o fluxo de conflito nem
    // obriga a recolar o ID do gist — ao contrário de desligar e voltar a ligar.
    "sync-update-token": function(){
      var tok = el("syncNewToken") ? el("syncNewToken").value.trim() : "";
      if(!tok){ toast("Cole o token novo."); return; }
      _sync.token = tok; saveSyncCfg();
      if(el("syncNewToken")) el("syncNewToken").value = "";
      toast("Token atualizado — a sincronizar…"); syncNow();
    },
    "sync-connect": function(){
      var tok = el("syncToken") ? el("syncToken").value.trim() : "";
      var pass = el("syncPass") ? el("syncPass").value : "";
      var gid = el("syncGist") ? el("syncGist").value.trim() : "";
      if(!tok){ toast("Indique o token do GitHub."); return; }
      if(!pass){ toast("Escolha uma palavra-passe de cifra."); return; }
      _sync.token = tok; _sync.pass = pass; if(gid) _sync.gistId = gid;
      if(!_sync.device) _sync.device = uid();
      if(_sync.auto === undefined) _sync.auto = true;
      _sync.baseRev = 0;
      // Se este dispositivo ainda não tem dados próprios, adota a nuvem sem conflito.
      var vazio = !state.transactions.length && !state.categories.length && _bindex.list.length===1;
      _sync.syncedSig = vazio ? allSig() : undefined;
      saveSyncCfg(); closeModal(); toast("A ligar…"); syncNow();
    },
    "sync-disconnect": function(){ if(!confirm("Desligar a sincronização neste dispositivo? O token e a palavra-passe são apagados daqui (os dados e o gist mantêm-se).")) return; _sync={auto:false}; _gistPerdido=null; saveSyncCfg(); closeModal(); toast("Sincronização desligada."); },
    "gist-use-id": function(){
      var v = el("glId") ? el("glId").value.trim() : "";
      if(!v){ toast("Cole o ID do gist que quer usar."); return; }
      // Recomeça a contagem: se houver diferenças entre este aparelho e o gist,
      // o fluxo normal deteta o conflito e deixa escolher qual manter.
      _sync.gistId=v; _sync.baseRev=0; _sync.syncedSig=undefined; saveSyncCfg();
      _gistPerdido=null; closeModal(); toast("A tentar com esse ID…"); syncNow();
    },
    "gist-create-new": function(){
      if(!confirm("Criar um gist novo a partir dos dados DESTE aparelho?\nOs outros aparelhos vão precisar do ID novo para voltarem a sincronizar.")) return;
      closeModal();

  // ---------- Estado da cópia de segurança em ficheiro ----------
  // Assinatura do CONTEÚDO — hash FNV-1a de 32 bits sobre os dados que interessam.
  //
  // A versão anterior era barata (contagens + somas) mas cega a tudo o que não mexesse
  // num total: recategorizar uma transação, mover dinheiro de uma categoria para outra,
  // mudar uma data, confirmar no banco ou corrigir um beneficiário passavam despercebidos.
  // Como só se envia à nuvem quando a assinatura muda, essas edições nunca subiam — e se
  // outro aparelho publicasse entretanto, eram apagadas em silêncio ao receber. Mover
  // dinheiro entre categorias é a operação mais frequente do método, por isso a cegueira
  // acertava justamente onde mais dói.
  //
  // 'ui', 'collapsed' e 'backup' ficam de fora DE PROPÓSITO: mudar de mês ou de separador
  // também chama save(), e isso não é dado novo para levar à rede.
  function hash32(s){
    var h = 0x811c9dc5;                                   // FNV-1a, base
    for (var i=0;i<s.length;i++){
      h ^= s.charCodeAt(i);
      h = (h + ((h<<1) + (h<<4) + (h<<7) + (h<<8) + (h<<24))) >>> 0;   // × 16777619
    }
    return h.toString(36);
  }
  function sigOf(st){

      return hash32(s) + "/" + s.length;                  // o comprimento afasta colisões

    if (outros.length)        return '⚠️ Este orçamento está guardado, mas falta guardar '+quais+' — a cópia inclui <b>todos</b> os orçamentos.';

  function daysSinceBackup(){

      var id=_bindex.list[i].id;

        state.backup.dev = _deviceId; state.backup.devNome = nomeDesteAparelho();

        var st = loadBudgetRaw(id);

        st.backup.dev = _deviceId; st.backup.devNome = nomeDesteAparelho();

  // ---------- Instantâneos diários (dentro da aplicação, últimos 5 dias) ----------
  // Guardados numa chave separada do localStorage — não sincronizam nem incham o gist.
  // Servem de "máquina do tempo" para reverter enganos. Funciona igual no iPhone e no PC,
  // porque NÃO transfere ficheiros (evita o download que o iOS bloqueia em silêncio).
  // ==========================================================================
  //  ARMAZÉM GRANDE (IndexedDB) — só para as CÓPIAS do histórico
  //
  //  O armazenamento simples do navegador tem ~5 MB. Cada ponto de histórico é uma cópia
  //  inteira do orçamento: com 3.400 transações são ~1 MB cada, e oito pontos vezes três
  //  orçamentos passam dos 12 MB — não cabe, e o histórico degradava-se sozinho até sobrar
  //  um ponto, precisamente em quem tem mais dados a proteger.
  //
  //  Este armazém guarda só as cópias, e tem espaço a mais (o Safari dá até 60% do disco).
  //  A LISTA do histórico — dia, hora, motivo — continua no sítio simples: é minúscula e,
  //  por ser lida sem esperas, todo o código à volta continua igual. Só ler o conteúdo de um
  //  ponto (repor, descarregar) é que passa a ter de esperar, e são ações raras e deliberadas.
  // ==========================================================================
  var IDB_NOME = "meu-orcamento", IDB_LOJA = "copias", _idb = null, _idbFalhou = false;
  function idbAberta(cb){
    if (_idb) { cb(_idb); return; }
    if (_idbFalhou || typeof indexedDB === "undefined") { cb(null); return; }
    try {
      var req = indexedDB.open(IDB_NOME, 1);
      req.onupgradeneeded = function(){ try { req.result.createObjectStore(IDB_LOJA); } catch(e){} };
      req.onsuccess = function(){ _idb = req.result; cb(_idb); };
      req.onerror = function(){ _idbFalhou = true; cb(null); };   // navegação privada, por exemplo
    } catch(e){ _idbFalhou = true; cb(null); }

  function idbGuardar(ref, texto, cb){
    idbAberta(function(db){

        var tx = db.transaction(IDB_LOJA, "readwrite");
        tx.objectStore(IDB_LOJA).put(texto, ref);
        tx.oncomplete = function(){ if(cb) cb(true); };
        tx.onerror = tx.onabort = function(){ if(cb) cb(false); };
      } catch(e){ if(cb) cb(false); }
    });
  }
  function idbLer(ref, cb){
    idbAberta(function(db){
      if(!db){ cb(null); return; }
      try {
        var r = db.transaction(IDB_LOJA, "readonly").objectStore(IDB_LOJA).get(ref);
        r.onsuccess = function(){ cb(typeof r.result === "string" ? r.result : null); };
        r.onerror = function(){ cb(null); };

    });
  }
  function idbApagar(refs){
    if(!refs || !refs.length) return;

      try {
        var lj = db.transaction(IDB_LOJA, "readwrite").objectStore(IDB_LOJA);

  // Pedir ao navegador para NÃO apagar estes dados. O Safari limpa sozinho o armazenamento de

  var SNAP_KEY = "meu-orcamento-snaps-v1";

  function snapKey(){ return SNAP_KEY + "::" + _bindex.active; }
  function loadSnaps(){ try { return JSON.parse(localStorage.getItem(snapKey())) || []; } catch(e){ return []; } }
  // Guarda a LISTA (leve) no sítio simples e manda cada CÓPIA nova para o armazém grande.
  // Uma entrada pode trazer `data` (acabada de criar) ou já só `ref` (a morada da cópia).
  function saveSnaps(arr){
    var refsVivas = {};
    for (var i=0;i<arr.length;i++){
      var s = arr[i];
      if (s.data != null && !s.ref){
        s.ref = "s-" + _bindex.active + "-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);
        idbGuardar(s.ref, s.data);
        // A cópia sai da lista: é ela que pesa. Fica em memória durante esta sessão para o
        // caso de se repor logo a seguir, mas não é gravada no sítio simples.
        try { Object.defineProperty(s, "data", { value:s.data, enumerable:false, writable:true, configurable:true }); } catch(e){}
      }
      if (s.ref) refsVivas[s.ref] = true;
    }
    // As cópias das entradas que saíram da lista deixam de fazer falta.
    var antes = [];
    try { antes = JSON.parse(localStorage.getItem(snapKey())) || []; } catch(e){}
    var orfas = [];
    for (var j=0;j<antes.length;j++) if (antes[j].ref && !refsVivas[antes[j].ref]) orfas.push(antes[j].ref);
    if (orfas.length) idbApagar(orfas);
    try { localStorage.setItem(snapKey(), JSON.stringify(arr)); return true; }
    catch(e){ // a lista é minúscula; se nem ela couber, o armazenamento está mesmo cheio
      while(arr.length>1){ arr.shift(); try{ localStorage.setItem(snapKey(), JSON.stringify(arr)); return true; }catch(_e){} }
      return false; }
  }
  // Vai buscar a cópia de um ponto, esteja ela onde estiver: em memória (acabada de criar),
  // ainda dentro da lista (versões anteriores da aplicação) ou no armazém grande.
  function lerCopia(s, cb){
    if (!s) { cb(null); return; }

    if (s.ref) { idbLer(s.ref, cb); return; }

  // Passagem única das cópias antigas — que viviam dentro da lista — para o armazém grande.

  function migrarHistorico(){
    try {

      for (var k in localStorage) if (localStorage.hasOwnProperty(k) && k.indexOf(SNAP_KEY)===0) chaves.push(k);
      for (var i=0;i<chaves.length;i++){

        for (var j=0;j<lista.length;j++){

  function takeDailySnapshot(){

    // última entrada não chega: um ponto de segurança guardado entretanto fica por cima dele,
    // e o dia de hoje acabava duplicado a cada gravação.
    var iDia = -1;
    for(var i=snaps.length-1;i>=0;i--){ if(snaps[i].day===day && !snaps[i].motivo){ iDia=i; break; } }
    if(iDia>=0 && snaps[iDia].sig===sig) return;                         // hoje já está guardado tal e qual
    var entry = { day:day, at:new Date().toISOString(), sig:sig, data: JSON.stringify(state) };

  // Mantém os últimos SNAP_MAX pontos DIÁRIOS e, além desses, os últimos SEG_MAX pontos de

  // nem o passar dos dias apaga o ponto guardado antes de uma ação destrutiva.
  function podarSnaps(snaps){
    var seg=0, dia=0;
    for(var i=snaps.length-1;i>=0;i--){
      if(snaps[i].motivo){ if(++seg > SEG_MAX) snaps.splice(i,1); }
      else { if(++dia > SNAP_MAX) snaps.splice(i,1); }

  // Ponto de segurança: fotografia tirada IMEDIATAMENTE ANTES de uma ação que não se pode

  // orçamento). Sem isto, a rede de segurança desaparecia justamente nas ações que mais

  function pontoDeSeguranca(motivo, estado){
    try {
      var st = estado || state;
      if(!st || (!st.transactions || !st.transactions.length) && (!st.categories || !st.categories.length)) return;
      var snaps = loadSnaps();

  function restoreSnapshot(idx){

    if(!confirm("Voltar ao orçamento "+comoEstava+"?\nOs dados atuais deste aparelho são substituídos por essa versão.")) return;
    // O ponto de segurança acrescenta uma entrada à lista, o que pode deslocar os índices.

  function snapshotsHtml(){

    for(var i=snaps.length-1;i>=0;i--){ var s=snaps[i];
